    return { grade: up };
  }

  // Frustschutz: Angebot nach mehreren nicht gelösten Aufgaben in Folge
  const needOffer = () => state.cfg.frustN > 0 && mem.miss >= state.cfg.frustN && mem.cool <= 0;
  const offerAnswered = (accepted) => { if (accepted) mem.easy = 2; mem.miss = 0; mem.cool = 8; };

  // Fehler-Detektiv: erkennt typische Flüchtigkeitsfehler und gibt einen freundlichen Hinweis, ohne die Lösung zu verraten
  const OPNAME = { "+": "Plus", "−": "Minus", "·": "Mal" };
  function diagnose(t, val) {
    if (!Number.isFinite(val) || val === t.result) return null;
    const a = t.a, b = t.b, r = t.result, d = val - r;
    const alt = t.op === "+" ? [a - b, a * b] : [a + b];
    if (alt.includes(val)) return { kind: "op", text: `Schau noch einmal aufs Rechenzeichen: Hier steht ein ${OPNAME[t.op]}.` };
    if (val === a || val === b) return { kind: "copy", text: "Das ist eine Zahl aus der Aufgabe. Was kommt am Ende heraus?" };
    const sv = String(val), sr = String(r);
    if (sv.length === sr.length && sv.length >= 2 && [...sv].reverse().join("") === sr) return { kind: "dig", text: "Fast: Die Ziffern stehen vertauscht. Erst die Zehner, dann die Einer." };
    if (t.op === "·" && (Math.abs(d) === a || Math.abs(d) === b)) return { kind: "row", text: "Eine Reihe zu viel oder zu wenig? Rechne die Reihe noch einmal von vorn." };
    if (Math.abs(d) === 10 && t.op !== "·") return { kind: "ten", text: "Fast! Die Zehnerstelle stimmt noch nicht. Denk an den Zehnerübergang." };
    if (Math.abs(d) === 1) return { kind: "one", text: "Ganz knapp! Rechne den letzten Schritt noch einmal." };
    return null;
  }

  // Lob und Ermutigung
  const PHRASES = {
    ok: ["Super!", "Richtig!", "Klasse!", "Spitze!", "Genau!", "Gut gemacht!", "Stark gerechnet!", "Weiter so!", "Das sitzt!", "Sauber gerechnet!"],
    hard: ["Stark, das war eine Knobelaufgabe!", "Wow, sogar die schwere Aufgabe!", "Knobel-Profi!", "Das war knifflig, und du hast es geschafft!"],
    again: ["Genau, jetzt stimmt es!", "Gut hingeschaut!", "Sauber korrigiert!"],
    stay: ["Toll, dass du drangeblieben bist!", "Geschafft! Dranbleiben lohnt sich.", "Das war knifflig, und du hast es gelöst!", "Gut, dass du nicht aufgegeben hast!"],
    shown: ["Gut gemacht! Beim nächsten Mal klappt es noch besser.", "Das war eine knifflige. Die nächste schaffst du!"],
    nudge1: ["Noch nicht ganz. Versuch es noch einmal.", "Fast! Rechne nochmal nach.", "Schau noch einmal genau hin."],
    mut1: ["Fast! Probier es noch einmal.", "Noch nicht ganz, du schaffst das!"],
    mut2: ["Schau dir die Hilfe an, dann klappt es.", "Keine Sorge, das ist eine knifflige Aufgabe."],
  };
  const STREAK = { 3: "Drei richtig hintereinander!", 5: "Fünf in Folge, das läuft!", 10: "Zehn in Folge. Beeindruckend!", 15: "Fünfzehn in Folge. Wow!", 20: "Zwanzig in Folge. Das ist Meisterklasse!", 30: "Dreißig in Folge!" };
  function phrase(list) {
    const c = list.filter((x) => x !== mem.last), t = pick(c.length ? c : list);
    mem.last = t;
    return t;
  }
  function withName(t) {
    const n = state.cfg.name;
    return n && /[!.]$/.test(t) && Math.random() < 0.35 ? t.replace(/[!.]$/, `, ${n}!`) : t;
  }
  function praise(code, hard) {
    if (code >= 2 && STREAK[mem.streak]) { mem.last = STREAK[mem.streak]; return withName(STREAK[mem.streak]); }
    if (code === 3) return withName(phrase(hard ? PHRASES.hard : PHRASES.ok));
    if (code === 2) return withName(phrase(PHRASES.again));
    if (code === 1) return withName(phrase(PHRASES.stay));
    return phrase(PHRASES.shown);
  }
  const gradeName = (g) => ["", "Lehrling", state.cfg.titel === "m" ? "Geselle" : "Gesellin", state.cfg.titel === "m" ? "Meister" : "Meisterin"][g] || "";
  // ---------- LOGIK-ENDE ----------
  // ---------- Zustand und Speichern ----------
  // Gespeichert wird dreifach: sofort im Browser, im Claude-Viewer zusätzlich im Konto
  // und auf Wunsch als Spielstand-Code zum Sichern oder Mitnehmen auf ein anderes Gerät.
  const VERSION = "1.3.1";
  const STORE_KEY = "zauber-rechnen-v2"; // Schlüssel bleiben trotz neuem Namen, damit der Fortschritt erhalten bleibt
  const OLD_STORE_KEY = "zauber-rechnen-v1";
  let task = null;   // { a, b, op, result, skill, group, hard, pool }
  let input = "", tries = 0, revealed = false, locked = false, localOk = true;
  let shownAt = 0, firstMs = null, away = false, offerOpen = false, dirtyTask = false;

  const stored = () => ({ ...state, gen: DATA_GEN, album: state.album.map((k) => [k.s, k.n, k.c, k.g]) });

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY);
      const parsed = raw && JSON.parse(raw);
      const loaded = sanitize(parsed);
      if (loaded) {
        state = loaded;
        // Älterer Stand: einmalig bei null beginnen und das sofort festhalten, damit auch das Konto nachzieht
        if (parsed.gen !== DATA_GEN) { save(); localStorage.removeItem(OLD_STORE_KEY); }
      }
    } catch (e) { localOk = false; }
  }
  function save() {
    state.savedAt = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stored())); localOk = true; } catch (e) { localOk = false; }
    queueCloudSave();
    renderSaveStatus();
  }

  // Claude-Konto: ein privates Dokument pro Person, nur im Claude-Viewer verfügbar
  const cloud = { ref: null, status: "off", busy: false, dirty: false, timer: 0, retried: false };
  async function initCloud() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = db && user ? await user.id() : null;
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/progress");
      const snap = await ref.get();
      cloud.ref = ref;
      cloud.status = "on";
      const raw = snap.exists ? snap.data() : null, remote = raw && sanitize(raw);
      if (remote && remote.savedAt > state.savedAt) adopt(remote);
      // Gerät neuer, oder im Konto liegt noch ein Stand von vor 1.1: den aktuellen Stand hinschreiben
      else if (raw ? raw.gen !== DATA_GEN || state.savedAt > remote.savedAt : state.savedAt) { cloud.dirty = true; flushCloud(); }
    } catch (e) {
      cloud.status = "error";
    }
    renderSaveStatus();
  }
  function queueCloudSave() {
    if (!cloud.ref) return;
    cloud.dirty = true;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(flushCloud, 1200);
  }
  async function flushCloud() {
    if (!cloud.ref || cloud.busy || !cloud.dirty) return;
    cloud.busy = true; cloud.dirty = false;
    try {
      await cloud.ref.set(stored());
      cloud.status = "on"; cloud.retried = false;
    } catch (e) {
      if (e && e.code === "unavailable" && !cloud.retried) {
        cloud.retried = true; cloud.dirty = true;
        setTimeout(flushCloud, 1500 + Math.random() * 2000);
      } else {
        cloud.status = "error";
      }
    } finally {
      cloud.busy = false;
      renderSaveStatus();
      if (cloud.dirty && cloud.status === "on") cloud.timer = setTimeout(flushCloud, 600);
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { away = true; clearTimeout(cloud.timer); flushCloud(); }
  });

  // Einen neueren Stand übernehmen (aus dem Konto oder per Code); die laufende Aufgabe bleibt, wenn sie noch passt
  const genSig = () => JSON.stringify([state.max, state.ops, state.level, state.cfg.mode, state.cfg.sk]);
  function adopt(next) {
    const before = genSig();
    state = next;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stored())); } catch (e) { localOk = false; }
    syncSettings(); applyPad(); renderProgress(); renderSaveStatus();
    if (!$("parents").hidden) parentsSync();
    if (genSig() !== before && task && !overlayOpen()) newTask();
  }

  // Spielstand-Code: ZR2 enthält alles (auch Lernstand und Einstellungen); ZR1 aus älteren Versionen bleibt lesbar
  const CODE_PREFIX = "ZR2.";
  const b64 = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
  const exportCode = () => CODE_PREFIX + b64(JSON.stringify(stored()));
  function parseCode(text) {
    const raw = String(text || "").replace(/\s+/g, "");
    try {
      if (raw.startsWith("ZR2.")) return sanitize({ ...JSON.parse(unb64(raw.slice(4))), gen: DATA_GEN });
      if (raw.startsWith("ZR1.")) {
        const d = JSON.parse(unb64(raw.slice(4)));
        const o = typeof d.o === "string" && /^[01]{3}$/.test(d.o) ? d.o : "111";
        return sanitize({ gen: DATA_GEN, correct: d.c, album: d.a, max: d.m, level: d.l, pad: d.p, sound: d.t !== 0,
          ops: { plus: o[0] === "1", minus: o[1] === "1", mal: o[2] === "1" } });
      }
    } catch (e) { /* fällt unten durch */ }
    return null;
  }

  // ---------- Töne und Sprache ----------
  const VOLS = { leise: 0.5, mittel: 1, laut: 1.7 };
  let audioCtx = null;
  function play(freqs, { step = 0.12, type = "triangle", gain = 0.16, len = 1.6 } = {}) {
    if (!state.sound || !state.cfg.fx) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const g0 = gain * (VOLS[state.cfg.vol] || 1);
      freqs.forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        const t0 = audioCtx.currentTime + i * step;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(g0, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + step * len);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + step * len + 0.05);
      });
    } catch (e) { /* kein Ton möglich */ }
  }
  const SFX = {
    ok: (streak) => play([523.25, 783.99].map((f) => f * 2 ** (Math.min(streak, 7) / 12))),   // je länger die Serie, desto heller
    again: () => play([440, 587.33], { type: "sine", gain: 0.14 }),
    stay: () => play([440, 587.33, 739.99], { type: "sine", gain: 0.15, step: 0.13 }),
    soft: () => play([349.23], { type: "sine", gain: 0.06, step: 0.1, len: 1.2 }),        // weicher, neutraler Ton statt Brummer
    pic: () => play([523, 659, 784, 1047]),
    gold: () => play([784, 988, 1175, 1568, 1976], { step: 0.1, gain: 0.15 }),
    mark: () => play([523, 659, 784, 1047, 1319], { step: 0.1 }),
  };

  let voice = null;
  const hasSpeech = "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function";
  function pickVoice() {
    try {
      const vs = window.speechSynthesis.getVoices() || [];
      voice = vs.find((v) => /^de/i.test(v.lang) && v.localService) || vs.find((v) => /^de/i.test(v.lang)) || null;
    } catch (e) { voice = null; }
  }
  if (hasSpeech) { pickVoice(); try { window.speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (e) { /* ältere Browser */ } }
  function speak(text, force) {
    if (!text || !hasSpeech || (!force && (!state.sound || !state.cfg.speech))) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "de-DE"; if (voice) u.voice = voice;
      u.rate = 0.95; u.pitch = 1.05; u.volume = Math.min(1, 0.6 * (VOLS[state.cfg.vol] || 1));
      window.speechSynthesis.speak(u);
    } catch (e) { /* keine Sprachausgabe möglich */ }
  }

  // ---------- Darstellung ----------
  const $ = (id) => document.getElementById(id);
  const fbEl = $("feedback"), hintEl = $("hint"), starsEl = $("stars"), answerEl = $("answer");
  const STAR_PATH = "M17 2.5 L21.2 11.6 L31 12.7 L23.6 19.4 L25.7 29.2 L17 24.2 L8.3 29.2 L10.4 19.4 L3 12.7 L12.8 11.6 Z";
  const OP_WORD = { "+": "plus", "−": "minus", "·": "mal" };

  // Das Antwortfeld bleibt dasselbe Element, damit der Tastatur-Fokus nie verloren geht
  function renderTask(cls) {
    $("numA").textContent = task.a;
    $("opSign").textContent = task.op;
    $("numB").textContent = task.b;
    answerEl.value = input;
    answerEl.readOnly = locked;
    answerEl.setAttribute("aria-label", `Ergebnis von ${task.a} ${OP_WORD[task.op]} ${task.b}`);
    answerEl.className = "answer";
    if (cls) { void answerEl.offsetWidth; answerEl.classList.add(cls); } // Wackel-Animation neu starten
  }
  function renderTags() {
    $("tagKnobel").hidden = !task.hard;
    $("tagUeb").hidden = !(state.cfg.uebTag && (task.pool === "ueb" || task.pool === "retry"));
  }
  // Gold kommt mit dem Bild, in dessen Abschnitt eine volle Hunderter- (bzw. Fünfziger-, Zweihunderter-) Marke fällt.
  // So klappt es auch, wenn "Bild nach je 3" nicht genau auf 100 trifft.
  const goldAt = (correct, N, G) => G > 0 && correct > 0 && Math.floor(correct / G) > Math.floor(Math.max(0, correct - N) / G);
  function answersToGold() {
    const N = state.cfg.rewardEvery, G = state.cfg.goldEvery;
    if (!G) return 0;
    for (let R = state.correct + Math.max(1, N - state.sincePic), i = 0; i < 1000; R += N, i++) if (goldAt(R, N, G)) return R - state.correct;
    return 0;
  }
  function renderProgress(popIndex) {
    const N = state.cfg.rewardEvery;
    if (starsEl.children.length !== N) starsEl.innerHTML = Array.from({ length: N }, () => `<svg class="star" viewBox="0 0 34 34" aria-hidden="true"><path d="${STAR_PATH}"/></svg>`).join("");
    starsEl.classList.toggle("many", N > 5);
    const n = Math.min(state.sincePic, N);
    [...starsEl.children].forEach((s, i) => {
      s.classList.toggle("on", i < n);
      s.classList.remove("pop");
      if (i === popIndex) { void s.getBoundingClientRect(); s.classList.add("pop"); }
    });
    const toGold = answersToGold();
    $("progressText").innerHTML = `Noch <b>${N - n}</b> bis zum<br>nächsten Bild` + (toGold ? `<br><span class="gold-hint">Goldbild in ${toGold}</span>` : "");
    $("albumBtn").textContent = `Album ${state.album.length}`;
  }

  // Welche Hilfe passt? Punktefeld fürs Einmaleins, Zwanzigerfeld bis 20, sonst ein Rechenweg
  const hintType = (t) => (t.op === "·" ? "field" : Math.max(t.a, t.result) <= 20 ? "dots" : "steps");

  // Punkte in Zehnerreihen, jede Reihe in zwei Fünferbündeln
  function dotRows(classes, perRow) {
    let html = "";
    for (let r = 0; r * perRow < classes.length; r++) {
      const row = classes.slice(r * perRow, (r + 1) * perRow);
      const groups = [row.slice(0, 5), row.slice(5)].filter((g) => g.length)
        .map((g) => `<span class="group">${g.map((c) => `<span class="dot ${c}"></span>`).join("")}</span>`).join("");
      html += `<div class="row${r === 4 ? " split" : ""}">${groups}</div>`;
    }
    return html;
  }

  function stepHint(t) {
    const { a, b } = t, add = t.op === "+", s = add ? "+" : "−";
    if (a % 10 === 0 && b % 10 === 0)
      return `Rechne mit Zehnern: ${a / 10} Zehner ${s} ${b / 10} Zehner = ? Zehner`;
    if (b % 10 === 0)
      return `Zähl in Zehnerschritten ${add ? "weiter" : "zurück"}: ${a}, ${add ? a + 10 : a - 10}, …`;
    if (b < 10) {
      const e = a % 10;
      if (add && e + b === 10) return `Die Einer ${e} + ${b} ergeben genau 10. Das ist ein Zehner mehr!`;
      if (add && e + b > 10) {
        const up = 10 - e, next = a + up;
        return `Erst bis zum nächsten Zehner: ${a} + ${up} = ${next}. Dann noch ${b - up} dazu: ${next} + ${b - up} = ?`;
      }
      if (!add && b > e && e === 0) return `${a} sind ${a - 10} und 10. Rechne 10 − ${b} und zähl das zur ${a - 10} dazu.`;
      if (!add && b > e) {
        const down = a - e;
        return `Erst zurück bis zum Zehner: ${a} − ${e} = ${down}. Dann noch ${b - e} weg: ${down} − ${b - e} = ?`;
      }
      return `Schau nur auf die Einer: ${e} ${s} ${b}. Die Zehner bleiben gleich.`;
    }
    const tens = b - (b % 10), mid = add ? a + tens : a - tens;
    return `Erst die Zehner: ${a} ${s} ${tens} = ${mid}. Dann die Einer: ${mid} ${s} ${b % 10} = ?`;
  }

  function renderHint() {
    const t = task, type = hintType(t);
    hintEl.className = "hint";
    if (type === "field") {
      const dots = Array(t.a * t.b).fill("a");
      hintEl.classList.add("small");
      hintEl.innerHTML = dotRows(dots, t.b) + `<p class="steps caption">${t.a} Reihen mit je ${t.b} Punkten</p>`;
      hintEl.setAttribute("aria-label", `${t.a} Reihen mit je ${t.b} Punkten`);
    } else if (type === "dots") {
      const dots = [];
      if (t.op === "+") {
        for (let i = 0; i < t.a; i++) dots.push("a");
        for (let i = 0; i < t.b; i++) dots.push("b");
      } else {
        for (let i = 0; i < t.a; i++) dots.push(i >= t.a - t.b ? "a gone" : "a");
      }
      hintEl.innerHTML = dotRows(dots, 10);
      hintEl.setAttribute("aria-label", t.op === "+"
        ? `${t.a} rosa Punkte und ${t.b} grüne Punkte`
        : `${t.a} Punkte, ${t.b} davon durchgestrichen`);
    } else {
      // jeder Satz eine Zeile, Gleichungen nie umbrechen
      const html = stepHint(t)
        .replace(/\d+ [+−] \d+ = (\d+|\?)/g, (m) => `<span class="nb">${m}</span>`)
        .replace(/\. /g, ".<br>");
      hintEl.innerHTML = `<p class="steps">${html}</p>`;
      hintEl.removeAttribute("aria-label");
    }
    hintEl.hidden = false;
  }

  function setFeedback(text, kind) {
    fbEl.textContent = text;
    fbEl.className = "feedback " + (kind || "");
  }

  // Meistermarke: Wappen mit Zunftfarbe, Zeichen der Fähigkeit und bis zu drei Sternen
  function emblemSVG(s, g) {
    const i = SKILLS.indexOf(s), hue = (i * 47 + 20) % 360;
    const dark = `hsl(${hue},42%,36%)`, light = `hsl(${hue},55%,88%)`;
    const label = s.group === "mal" ? s.id.slice(1) : s.group === "plus" ? "+" : "−";
    const stars = [0, 1, 2].map((k) => `<path transform="translate(${22 + k * 18} 74) scale(.42)" d="${STAR_PATH}" fill="${k < g ? "#f0b84a" : "none"}" stroke="${k < g ? "#c9921e" : dark}" stroke-width="2.4" stroke-linejoin="round" opacity="${k < g ? 1 : 0.35}"/>`).join("");
    return `<svg viewBox="0 0 80 96" aria-hidden="true"><path d="M8 6h64v40c0 24-15 38-32 46C23 84 8 70 8 46Z" fill="${light}" stroke="${dark}" stroke-width="4" stroke-linejoin="round"/>` +
      `<text x="40" y="${s.group === "mal" ? 52 : 56}" text-anchor="middle" font-family="Lexend, Nunito, sans-serif" font-weight="600" font-size="${label.length > 1 ? 26 : 32}" fill="${dark}">${label}</text>` +
      (s.group === "mal" ? `<text x="40" y="66" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="10" fill="${dark}">REIHE</text>` : "") + stars + `</svg>`;
  }
  let toastTimer = 0;
  function showToast(html) {
    const t = $("toast");
    t.innerHTML = html; t.hidden = false;
    t.classList.remove("in"); void t.offsetWidth; t.classList.add("in");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }
  function announceGrade(skillId, g) {
    const s = SKILL_BY_ID[skillId];
    showToast(`${emblemSVG(s, g)}<div><b>Neue Marke: ${gradeName(g)}</b><span>${s.label} · Zunft der ${s.zunft}</span></div>`);
    if (g >= 2) {
      setTimeout(() => SFX.mark(), 250);
      speak(`Du bist jetzt ${gradeName(g)} in der Zunft der ${s.zunft}!`);
    }
  }

  // ---------- Aufgaben stellen ----------
  function newTask() {
    if (offerOpen) return;
    task = nextTask();
    input = ""; tries = 0; revealed = false; locked = false;
    shownAt = performance.now(); firstMs = null; away = false;
    renderTask(""); renderTags();
    hintEl.hidden = true;
    focusAnswer();
    if (state.cfg.readTask) speak(`${task.a} ${OP_WORD[task.op]} ${task.b}`);
  }
  // Nach einer gelösten Aufgabe: entweder Angebot für etwas Leichteres oder gleich die nächste
  function afterTask() {
    if (needOffer()) showOffer(); else newTask();
  }
  function showOffer() {
    offerOpen = true; locked = true;
    setFeedback("", "");
    hintEl.hidden = true;
    $("offer").hidden = false;
    $("checkBtn").hidden = true;
    $("offerText").textContent = phrase([
      "Das waren gerade ein paar knifflige Aufgaben. Das ist völlig in Ordnung! Soll als Nächstes etwas Leichteres kommen?",
      "Puh, die waren schwer. Möchtest du kurz etwas Leichteres rechnen?",
    ]);
    try { $("offerYes").focus({ preventScroll: true }); } catch (e) { $("offerYes").focus(); }
  }
  function closeOffer(accept) {
    offerAnswered(accept);
    $("offer").hidden = true;
    offerOpen = false;
    applyPad();
    newTask();
  }
  $("offerYes").addEventListener("click", () => closeOffer(true));
  $("offerNo").addEventListener("click", () => closeOffer(false));

  // ---------- Eingabe ----------
  const coarse = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  const padVisible = () => state.pad === "show" || (state.pad === "auto" && coarse);
  const overlayOpen = () => ["reward", "album", "viewer", "parents"].some((id) => !$(id).hidden);

  function applyPad() {
    const show = padVisible();
    $("pad").hidden = !show;
    $("checkBtn").hidden = show;
    // Mit Bildschirm-Tasten am Tablet keine zweite Tastatur aufklappen; eine echte Tastatur geht trotzdem
    answerEl.setAttribute("inputmode", show && coarse ? "none" : "numeric");
  }
  function focusAnswer() {
    if (overlayOpen() || offerOpen) return;
    if (coarse && padVisible()) return;
    try { answerEl.focus({ preventScroll: true }); } catch (e) { answerEl.focus(); }
  }
  answerEl.addEventListener("input", () => {
    if (locked) { answerEl.value = input; return; }
    input = answerEl.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 3);
    renderTask("");
  });
  function typeDigit(d) {
    if (locked || input.length >= 3) return;
    if (input === "0") input = "";
    input += d;
    renderTask("");
  }
  function del() {
    if (locked) return;
    input = input.slice(0, -1);
    renderTask("");
  }

  function check() {
    if (locked || input === "") return;
    const val = parseInt(input, 10);
    if (firstMs === null && !away) firstMs = performance.now() - shownAt;
    if (val === task.result) solved(); else wrong(val);
  }

  function solved() {
    locked = true;
    renderTask("right");
    const h = state.cfg.helpAfter;
    const code = revealed ? 0 : tries === 0 ? 3 : tries < h ? 2 : 1;
    const { grade } = recordResult(task, code, away ? NaN : firstMs);
    let reward = false, popAt = -1;
    if (!revealed) {
      state.correct += 1; state.sincePic += 1;
      popAt = state.sincePic - 1;
      if (state.sincePic >= state.cfg.rewardEvery) { state.sincePic = 0; reward = true; }
    }
    save();
    renderProgress(reward ? state.cfg.rewardEvery - 1 : popAt);
    const text = praise(code, task.hard);
    setFeedback(text, "good");
    if (reward) {
      [...starsEl.children].forEach((s) => s.classList.add("on"));
      setFeedback(`${text} ${state.cfg.rewardEvery} Sterne! Da wartet etwas auf dich …`, "good");
      SFX.pic();
      speak(text);
    } else {
      code === 3 ? SFX.ok(mem.streak) : code === 2 ? SFX.again() : code === 1 ? SFX.stay() : SFX.soft();
      if (code >= 1) speak(text);
    }
    if (grade) setTimeout(() => announceGrade(task.skill, grade), 500);
    setTimeout(reward ? showReward : afterTask, reward ? 900 : code === 0 ? 1300 : 1000);
  }

  function wrong(val) {
    tries += 1;
    input = "";
    renderTask("wrong");
    SFX.soft();
    const h = state.cfg.helpAfter;
    let detective = null;
    if (tries === 1) {
      detective = state.cfg.detektiv ? diagnose(task, val) : null;
      const kind = detective ? detective.kind : "other";
      state.err[kind] = (state.err[kind] || 0) + 1;
    }
    if (tries < h) {
      setFeedback(detective ? detective.text : phrase(PHRASES.nudge1), "try");
      if (state.cfg.speechMode === "mut") speak(phrase(PHRASES.mut1));
    } else if (tries === h) {
      const type = hintType(task);
      setFeedback(detective ? detective.text : type === "field" ? "Zähl die Punkte. In Fünferschritten geht's schneller!"
        : type === "steps" ? "Hier ist ein Rechenweg für dich:"
        : task.op === "+" ? "Zähl alle Punkte zusammen." : "Zähl die Punkte, die übrig bleiben.", "try");
      renderHint();
      if (state.cfg.speechMode === "mut") speak(phrase(PHRASES.mut2));
    } else {
      revealed = true;
      setFeedback(`Das Ergebnis ist ${task.result}. Tipp es ein!`, "try");
      renderHint();
    }
  }

  const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "ok"];
  $("pad").innerHTML = KEYS.map((k) =>
    k === "del" ? `<button class="key del" type="button" data-k="del" aria-label="Löschen">Löschen</button>`
    : k === "ok" ? `<button class="key ok" type="button" data-k="ok" aria-label="Prüfen">OK</button>`
    : `<button class="key" type="button" data-k="${k}">${k}</button>`).join("");
  $("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    if (k === "del") del(); else if (k === "ok") check(); else typeDigit(k);
    focusAnswer();
  });
  $("checkBtn").addEventListener("click", () => { check(); focusAnswer(); });

  document.addEventListener("keydown", (e) => {
    const field = e.target.closest && e.target.closest("input:not(#answer), textarea, select");
    if (overlayOpen()) {
      if (e.key === "Escape") { e.preventDefault(); closeOverlays(); return; }
      const onButton = e.target.closest && e.target.closest("button, summary, label");
      if (e.key === "Enter" && !onButton && !field && $("parents").hidden) { e.preventDefault(); closeOverlays(); }
      return;
    }
    if (offerOpen || field) return;
    // Im Antwortfeld tippt der Browser selbst; nur Enter prüft
    if (e.target === answerEl) {
      if (e.key === "Enter") { e.preventDefault(); check(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // Getippt, während etwas anderes den Fokus hat: Ziffer trotzdem ins Antwortfeld
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); typeDigit(e.key); focusAnswer(); }
    else if (e.key === "Backspace") { e.preventDefault(); del(); focusAnswer(); }
    else if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); check(); }
  });

  // ---------- Belohnung, Sammlung, Meistermarken ----------
  let uidCounter = 0;
  const picHTML = (card) => cardSVG(card, "p" + (++uidCounter) + "_");

  function showReward() {
    const gold = goldAt(state.correct, state.cfg.rewardEvery, state.cfg.goldEvery);
    const card = newCard(state.album[state.album.length - 1], gold, state.album.slice(-3));
    state.album.push(card);
    save();
    const mark = gold ? Math.floor(state.correct / state.cfg.goldEvery) * state.cfg.goldEvery : 0;
    $("rewardTitle").textContent = gold ? `${mark === state.correct ? "" : "Schon über "}${mark} richtige Aufgaben! Ein goldenes Bild für dich!` : "Geschafft! Ein neues Bild für deine Sammlung";
    $("rewardPic").innerHTML = picHTML(card);
    $("rewardPic").classList.toggle("rare", !!card.g);
    $("rewardName").textContent = cardName(card);
    $("rewardNo").textContent = `Bild Nr. ${state.album.length}${card.g ? " · golden" : ""}`;
    $("reward").hidden = false;
    $("rewardClose").focus();
    if (card.g) { setTimeout(() => SFX.gold(), 350); speak(`Ein goldenes Bild! Das hast du dir verdient${state.cfg.name ? ", " + state.cfg.name : ""}!`); }
    else speak("Hier ist dein neues Bild!");
    renderProgress();
  }

  // Sammlung: Bilder (neueste zuerst, gezeichnet erst im Blickfeld) und Meistermarken (nur Erreichtes)
  let albumObserver = null;
  function drawThumb(el) {
    const card = state.album[Number(el.dataset.i)];
    if (card && !el.firstChild) el.innerHTML = picHTML(card);
  }
  function setTab(which) {
    const pics = which === "pics";
    $("tabPics").setAttribute("aria-selected", String(pics));
    $("tabMarks").setAttribute("aria-selected", String(!pics));
    $("panelPics").hidden = !pics;
    $("panelMarks").hidden = pics;
    if (!pics) renderMarks();
  }
  function renderMarks() {
    const got = SKILLS.filter((s) => (state.stats[s.id] || {}).g > 0)
      .sort((a, b) => state.stats[b.id].g - state.stats[a.id].g || SKILLS.indexOf(a) - SKILLS.indexOf(b));
    $("marksInfo").textContent = got.length
      ? `${got.length} ${got.length === 1 ? "Marke" : "Marken"} in deiner Werkstatt. Jede wächst mit: Lehrling, ${gradeName(2)}, ${gradeName(3)}.`
      : "Hier sammelst du Zunftmarken: Wer eine Aufgabenart gut kann, wird Lehrling, dann Geselle und schließlich Meister. Rechne einfach weiter!";
    $("marksGrid").innerHTML = got.map((s) => {
      const g = state.stats[s.id].g;
      return `<div class="mark">${emblemSVG(s, g)}<b>${gradeName(g)}</b><span>${s.label}</span><small>Zunft der ${s.zunft}</small></div>`;
    }).join("");
  }
  function showAlbum() {
    const n = state.album.length, gold = state.album.filter((k) => k.g).length;
    $("albumInfo").textContent = n === 0
      ? `Noch leer. Rechne ${state.cfg.rewardEvery} Aufgaben richtig, dann kommt dein erstes Bild.`
      : `${n} ${n === 1 ? "Bild" : "Bilder"} gesammelt${gold ? `, davon ${gold} golden` : ""}. Jedes ist ein Unikat.`;
    $("albumGrid").innerHTML = state.album.map((k, i) => i).reverse().map((i) => {
      const k = state.album[i];
      return `<button class="album-item" type="button" data-i="${i}"><span class="pic${k.g ? " rare" : ""}" data-i="${i}"></span>` +
        `<span class="album-name">${cardName(k)}</span><span class="album-no">Nr. ${i + 1}${k.g ? " · golden" : ""}</span></button>`;
    }).join("");
    setTab("pics");
    $("album").hidden = false;
    const thumbs = [...$("albumGrid").querySelectorAll(".pic")];
    if (albumObserver) albumObserver.disconnect();
    if ("IntersectionObserver" in window) {
      albumObserver = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { drawThumb(e.target); albumObserver.unobserve(e.target); }
      }), { root: $("album"), rootMargin: "300px 0px" });
      thumbs.forEach((t) => albumObserver.observe(t));
    } else thumbs.forEach(drawThumb);
    // Fokus ohne Springen: die Sammlung soll oben beim neuesten Bild beginnen
    try { $("albumClose").focus({ preventScroll: true }); } catch (e) { $("albumClose").focus(); }
    $("album").scrollTop = 0;
  }
  $("tabPics").addEventListener("click", () => setTab("pics"));
  $("tabMarks").addEventListener("click", () => setTab("marks"));

  let viewerReturn = null;
  function showViewer(i) {
    const k = state.album[i];
    if (!k) return;
    viewerReturn = document.activeElement;
    $("viewerPic").innerHTML = picHTML(k);
    $("viewerPic").classList.toggle("rare", !!k.g);
    $("viewerName").textContent = cardName(k);
    $("viewerNo").textContent = `Bild Nr. ${i + 1}${k.g ? " · golden" : ""}`;
    $("viewer").hidden = false;
    $("viewer").scrollTop = 0;
    try { $("viewerClose").focus({ preventScroll: true }); } catch (e) { $("viewerClose").focus(); }
  }
  function closeViewer() {
    $("viewer").hidden = true;
    if (viewerReturn && viewerReturn.focus) { try { viewerReturn.focus({ preventScroll: true }); } catch (e) { viewerReturn.focus(); } }
  }
  $("albumGrid").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (b) showViewer(Number(b.dataset.i));
  });
  $("viewerClose").addEventListener("click", closeViewer);
  $("viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") closeViewer(); });

  function closeOverlays() {
    if (!$("viewer").hidden) { closeViewer(); return; }
    if (!$("parents").hidden) { closeParents(); return; }
    const wasReward = !$("reward").hidden;
    $("reward").hidden = true;
    $("album").hidden = true;
    if (albumObserver) albumObserver.disconnect();
    if (wasReward) { setFeedback("", ""); afterTask(); } else focusAnswer();
  }
  $("rewardClose").addEventListener("click", closeOverlays);
  $("albumClose").addEventListener("click", closeOverlays);
  $("albumBtn").addEventListener("click", showAlbum);
  $("album").addEventListener("click", (e) => { if (e.target.id === "album") closeOverlays(); });

  // ---------- Eltern-Menü ----------
  // Jede Einstellung hat einen Pfad im Zustand ("max", "ops.plus", "cfg.anteil" …). Bauen, Anzeigen und Speichern laufen darüber.
  const NUM_PATHS = new Set(["max", "cfg.anteil", "cfg.helpAfter", "cfg.frustN", "cfg.rewardEvery", "cfg.goldEvery"]);
  const QUIET_PATHS = /^(pad|sound|cfg\.(fx|vol|speech|speechMode|readTask|name|titel|uebTag|rewardEvery|goldEvery|detektiv|helpAfter))$/;
  const getP = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), state);
  function setP(path, v) {
    const ks = path.split("."), last = ks.pop();
    ks.reduce((o, k) => o[k], state)[last] = v;
  }
  const note = (t) => (t ? `<p class="note">${t}</p>` : "");
  const seg = (path, label, opts, help, ids = {}) =>
    `<fieldset class="p-field"><legend>${label}</legend><div class="seg">${opts.map(([v, l]) =>
      `<label class="opt"><input type="radio" name="${path}" data-p="${path}" data-v="${v}"${ids[v] ? ` id="${ids[v]}"` : ""}><span>${l}</span></label>`).join("")}</div>${note(help)}</fieldset>`;
  const tog = (path, label, help, id) =>
    `<div class="p-field"><label class="tog"><input type="checkbox" data-p="${path}"${id ? ` id="${id}"` : ""}><span>${label}</span></label>${note(help)}</div>`;

  // Auf dem Home-Bildschirm: Hinweis nur zeigen, wenn die Seite im Browser läuft (nicht als App, nicht im Claude-Viewer)
  const isStandalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const showHomeHint = () => !isStandalone() && !window.claude && /^https?:$/.test(location.protocol);
  const homeGroup = () => !showHomeHint() ? "" : `
      <details class="pg" open id="pgHome"><summary>Auf den Home-Bildschirm legen</summary>
        <ol class="steps-list">
          <li>Diese Seite in <b>Safari</b> öffnen (auf dem iPhone geht es nur dort).</li>
          <li>Unten auf das <b>Teilen-Symbol</b> tippen (Quadrat mit Pfeil nach oben). Manchmal steckt es hinter den drei Punkten.</li>
          <li>Nach unten wischen und <b>„Zum Home-Bildschirm“</b> wählen. Erscheint ein Schalter „Als Web-App öffnen“, einschalten.</li>
          <li><b>Hinzufügen</b> tippen.</li>
          <li>Ab jetzt immer über das neue Symbol starten. Es speichert getrennt von Safari. Den bisherigen Stand also einmal mit „Sicherung speichern“ und „Code eingeben“ übertragen.</li>
        </ol>
        ${note("Android mit Chrome: Menü (drei Punkte) → „App installieren“ oder „Zum Startbildschirm hinzufügen“. Am Computer: in der Adressleiste auf das Installieren-Symbol.")}
      </details>`;

  function buildParents() {
    const rows = SKILLS.filter((s) => s.group === "mal");
    const pm = SKILLS.filter((s) => s.group !== "mal");
    $("parentsBody").innerHTML = `
      <details class="pg" open><summary>Modus</summary>
        ${seg("cfg.mode", "Wie sollen die Aufgaben ausgewählt werden?", [["auto", "Auto-Modus"], ["manual", "Manuell"]],
          "Im <b>Auto-Modus</b> merkt sich die Rechenreise, was sitzt und wo es hakt, und wählt die Aufgaben danach aus. Deine Einstellungen unten gelten weiter. Im <b>manuellen Modus</b> bestimmen nur deine Einstellungen, was vorkommt.", { auto: "modeAuto", manual: "modeManual" })}
      </details>

      <details class="pg" open><summary>Aufgaben</summary>
        <fieldset class="p-field"><legend>Rechenarten</legend><div class="seg">
          <label class="opt"><input type="checkbox" data-p="ops.plus" id="opPlus"><span>Plus</span></label>
          <label class="opt"><input type="checkbox" data-p="ops.minus" id="opMinus"><span>Minus</span></label>
          <label class="opt"><input type="checkbox" data-p="ops.mal" id="opMal"><span>Einmaleins</span></label>
        </div>${note("Teilen kommt mit Version 1.6 dazu.")}</fieldset>
        ${seg("max", "Zahlenraum für Plus und Minus", [[10, "bis 10"], [20, "bis 20"], [100, "bis 100"]], "Bis 1000 kommt mit Version 1.5.", { 10: "max10", 20: "max20", 100: "max100" })}
        <fieldset class="p-field"><legend>Einmaleins-Reihen</legend>
          <div class="chips" id="rowChips">${rows.map((s) => `<button type="button" class="rchip" data-chip="${s.id}"></button>`).join("")}</div>
          ${note("Tippen wechselt: <b>normal</b> → <b>★ öfter üben</b> → <b>aus</b>. Öfter geübte Reihen zählen im Auto-Modus von Anfang an als Schwerpunkt.")}
        </fieldset>
        <details class="pg-in"><summary>Plus- und Minus-Aufgaben im Detail</summary>
          <div class="sk-list">${pm.map((s) => `<div class="sk-row"><div class="sk-name">${s.label}<small>${s.ex}${s.hard ? " · Knobelaufgabe" : ""}</small></div>
            <div class="seg seg-sm">${[[0, "Aus"], [1, "Normal"], [2, "Öfter"]].map(([v, l]) =>
              `<label class="opt"><input type="radio" name="sk-${s.id}" data-sk="${s.id}" data-v="${v}"><span>${l}</span></label>`).join("")}</div></div>`).join("")}</div>
          ${note("Aufgabenarten, die im gewählten Zahlenraum nicht vorkommen können (z. B. 38 + 47 bei bis 20), bleiben unabhängig von dieser Einstellung weg.")}
        </details>
        ${seg("level", "Mischung im manuellen Modus", [["easy", "eher leicht"], ["mix", "gemischt"], ["hard", "eher schwer"]],
          "Anteil der Knobelaufgaben: eher leicht 20 %, gemischt 45 %, eher schwer 75 %. Im Auto-Modus steuert das „Schwerer werden“ weiter unten.", { easy: "levelEasy", mix: "levelMix", hard: "levelHard" })}
      </details>

      <details class="pg" open id="pgAuto"><summary>Auto-Modus</summary>
        <div class="p-field"><label class="rng-l" for="rAnteil">Aufgaben aus ihren Schwächen: <b data-out="cfg.anteil"></b></label>
          <input type="range" id="rAnteil" data-p="cfg.anteil" min="10" max="60" step="5">
          <div class="slider-scale"><span>10 % sanft</span><span>60 % intensiv</span></div>
          ${note("Der Rest bleibt gemischt, mit Sicherem zwischendurch, damit sie Erfolge hat.")}</div>
        ${seg("cfg.sicher", "Ab wann gilt eine Aufgabenart als sicher?", [["3in3", "3 richtig hintereinander"], ["4in5", "4 von 5 ohne Hilfe"], ["9in10", "9 von 10 ohne Hilfe"]],
          "Sicheres kommt seltener, aber nie ganz weg. Nach einem Glückstreffer übt die App trotzdem weiter, bis es auch auf längere Sicht sitzt.")}
        ${seg("cfg.steigern", "Wie schnell darf es schwerer werden?", [["langsam", "langsam"], ["mittel", "mittel"], ["schnell", "schnell"]],
          "Steuert den Anteil der Knobelaufgaben. Läuft es gut, steigt er, nach mehreren Fehlern sinkt er.")}
        ${tog("cfg.erfolg", "Nach zwei schwierigen Aufgaben eine leichtere einstreuen", "Ein kleiner Erfolg zwischendurch, gegen das Aufgeben.")}
        ${tog("cfg.retry", "Nicht gelöste Aufgaben später wiederholen", "Nach 5 bis 8 Aufgaben kommt dieselbe Aufgabenart noch einmal, meist mit anderen Zahlen.")}
        ${tog("cfg.uebTag", "Zeichen „Übung“ an Übungsaufgaben anzeigen")}
      </details>

      <details class="pg"><summary>Hilfe und Fehler</summary>
        ${seg("cfg.helpAfter", "Hilfe zeigen nach", [[1, "1 Fehlversuch"], [2, "2 Fehlversuchen"], [3, "3 Fehlversuchen"]],
          "Einen Versuch später wird die Lösung gezeigt. Diese Aufgabe zählt dann nicht als Stern.")}
        ${tog("cfg.detektiv", "Fehler-Detektiv", "Erkennt typische Flüchtigkeitsfehler (Rechenzeichen oder Ziffern vertauscht, Zehnerstelle, eine Reihe zu viel) und gibt einen gezielten Hinweis, ohne die Lösung zu verraten.")}
        ${seg("cfg.frustN", "Leichtere Aufgabe anbieten nach", [[0, "nie"], [2, "2"], [3, "3"], [4, "4"], [5, "5"]],
          "…nicht gelösten Aufgaben hintereinander. Sie entscheidet selbst, ob sie das Angebot annimmt.")}
      </details>

      <details class="pg"><summary>Ton und Sprache</summary>
        ${tog("sound", "Ton insgesamt", "Entspricht dem Knopf oben neben „Album“.", "pSound")}
        ${tog("cfg.fx", "Klänge")}
        ${seg("cfg.vol", "Lautstärke", [["leise", "leise"], ["mittel", "mittel"], ["laut", "laut"]])}
        ${tog("cfg.speech", "Sprachausgabe", "Die Stimme kommt vom Gerät und klingt je nach Gerät verschieden.")}
        ${seg("cfg.speechMode", "Was soll gesprochen werden?", [["lob", "nur Lob"], ["mut", "Lob und Ermutigung"]], "„Ermutigung“ spricht auch nach Fehlversuchen ein paar freundliche Worte.")}
        ${tog("cfg.readTask", "Aufgaben vorlesen")}
        <div class="p-field"><button type="button" class="small-btn" id="voiceTest">Stimme testen</button><span class="note" id="voiceMsg"></span></div>
        <div class="p-field"><label class="rng-l" for="pName">Name für das Lob (freiwillig)</label>
          <input type="text" id="pName" class="p-text" data-p="cfg.name" maxlength="20" autocomplete="off" placeholder="z. B. Lena"></div>
        ${seg("cfg.titel", "Zunfttitel", [["f", "Gesellin, Meisterin"], ["m", "Geselle, Meister"]])}
      </details>

      <details class="pg"><summary>Belohnungen</summary>
        ${seg("cfg.rewardEvery", "Ein Bild nach je", [[3, "3"], [5, "5"], [7, "7"], [10, "10"]], "…richtig gelösten Aufgaben.")}
        ${seg("cfg.goldEvery", "Ein goldenes Bild nach je", [[0, "nie"], [50, "50"], [100, "100"], [200, "200"]], "…richtig gelösten Aufgaben. Planbar, kein Zufall.")}
      </details>

      <details class="pg"><summary>Bedienung</summary>
        ${seg("pad", "Bildschirm-Tasten", [["auto", "automatisch"], ["show", "immer zeigen"], ["hide", "nur Tastatur"]],
          "„Automatisch“ zeigt die großen Zahlentasten am Tablet und Handy. Am Computer tippt man ins Antwortfeld. Die Tastatur funktioniert immer.", { auto: "padAuto", show: "padShow", hide: "padHide" })}
      </details>

      <details class="pg" id="pgLern"><summary>Lernstand</summary>
        <p class="note" id="lernSum"></p>
        <div class="ls-list" id="lernList"></div>
        <p class="note">Punkte: <i class="ld ok"></i> ohne Hilfe richtig · <i class="ld help"></i> mit Hilfe · <i class="ld no"></i> Lösung gezeigt. Die Auswertung mit Verlauf kommt mit Version 1.7.</p>
        <div class="reset-row" id="lernReset"><button class="link-btn" type="button" data-lr="ask">Lernstand zurücksetzen</button></div>
      </details>

      ${homeGroup()}

      <details class="pg"><summary>Spielstand</summary>
        <p class="note" id="saveStatus"></p>
        <div class="save-actions">
          <button class="small-btn primary" id="backupBtn" type="button">Sicherung speichern</button>
          <button class="small-btn" id="codeShowBtn" type="button">Spielstand-Code anzeigen</button>
          <button class="small-btn" id="codeEnterBtn" type="button">Code eingeben</button>
        </div>
        <p class="note" id="backupMsg" role="status"></p>
        <div class="code-box" id="codeBox" hidden>
          <label class="note" for="codeOut">Diesen Code kopieren und aufheben, zum Beispiel in einer Notiz. Auf einem anderen Gerät unter „Code eingeben“ einfügen.</label>
          <textarea id="codeOut" rows="3" readonly></textarea>
          <div class="code-row"><button class="small-btn" id="codeCopyBtn" type="button">Kopieren</button><span class="note" id="codeCopyMsg" role="status"></span></div>
        </div>
        <div class="code-box" id="codeInBox" hidden>
          <label class="note" for="codeIn">Spielstand-Code hier einfügen:</label>
          <textarea id="codeIn" rows="3" placeholder="ZR2.…" autocomplete="off" spellcheck="false"></textarea>
          <div class="code-row"><button class="small-btn" id="codeLoadBtn" type="button">Laden</button><span class="note" id="codeInMsg" role="status"></span></div>
          <div class="code-row" id="codeConfirm" hidden>
            <span class="note" id="codeConfirmText"></span>
            <button class="link-btn danger" id="codeYes" type="button">Ja, laden</button>
            <button class="link-btn" id="codeNo" type="button">Abbrechen</button>
          </div>
        </div>
        <div class="reset-row" id="resetRow"><button class="link-btn" id="resetBtn" type="button">Alles zurücksetzen (Fortschritt, Sammlung, Lernstand)</button></div>
      </details>
      <p class="note version">Rechenreise · Version ${VERSION}</p>`;
  }

  const CHIP_TXT = { 0: "aus", 1: "normal", 2: "öfter üben" };
  const STATUS_TXT = { neu: "noch neu", uebend: "übt noch", sicher: "sicher", wackelig: "wackelt" };
  function parentsSync() {
    const body = $("parentsBody");
    body.querySelectorAll("[data-p]").forEach((inp) => {
      const v = getP(inp.dataset.p);
      if (inp.type === "radio") inp.checked = String(v) === inp.dataset.v;
      else if (inp.type === "checkbox") inp.checked = !!v;
      else if (inp.type === "range" || inp.type === "text") { if (document.activeElement !== inp) inp.value = v; }
    });
    body.querySelectorAll("[data-out]").forEach((o) => { o.textContent = getP(o.dataset.out) + " %"; });
    body.querySelectorAll("[data-sk]").forEach((inp) => { inp.checked = String(skLevel(inp.dataset.sk)) === inp.dataset.v; });
    body.querySelectorAll("[data-chip]").forEach((b) => {
      const s = SKILL_BY_ID[b.dataset.chip], lv = skLevel(s.id);
      b.dataset.s = lv;
      b.textContent = `${lv === 2 ? "★ " : ""}${s.id.slice(1)}er`;
      b.setAttribute("aria-label", `${s.label}: ${CHIP_TXT[lv]}. Tippen zum Ändern.`);
    });
    const manual = state.cfg.mode === "manual";
    $("pgAuto").classList.toggle("off", manual);
    $("pgAuto").querySelectorAll("input").forEach((i) => { i.disabled = manual; });
    $("pgAuto").querySelector("summary").textContent = manual ? "Auto-Modus (gerade aus)" : "Auto-Modus";
    renderSaveStatus();
  }
  function renderLernstand() {
    const today = todayKey(), [n, ok] = state.days[today] || [0, 0];
    let n7 = 0, ok7 = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(Date.now() - i * 864e5), p = (x) => String(x).padStart(2, "0");
      const v = state.days[`${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`];
      if (v) { n7 += v[0]; ok7 += v[1]; }
    }
    $("lernSum").textContent = `Heute ${n} ${n === 1 ? "Aufgabe" : "Aufgaben"}, davon ${ok} ohne Hilfe richtig. Letzte 7 Tage: ${n7} Aufgaben, ${ok7} ohne Hilfe richtig.`;
    const on = new Set(enabledSkills().map((s) => s.id));
    $("lernList").innerHTML = SKILLS.map((s) => {
      const st = state.stats[s.id], status = statusOf(s.id);
      const dots = (st ? st.h : "").split("").map((c) => `<i class="ld ${c >= "2" ? "ok" : c === "1" ? "help" : "no"}"></i>`).join("");
      return `<div class="ls-row${on.has(s.id) ? "" : " off"}"><span class="ls-name">${s.label}${st && st.g ? `<small>${gradeName(st.g)}</small>` : ""}</span>` +
        `<span class="ls-dots" aria-label="letzte Ergebnisse">${dots || "<small>noch nicht geübt</small>"}</span><span class="ls-st st-${status}">${STATUS_TXT[status]}</span></div>`;
    }).join("");
  }

  function afterChange(path) {
    if (path === "pad") applyPad();
    if (path === "sound") syncSettings();
    if (path === "cfg.rewardEvery" || path === "cfg.goldEvery") renderProgress();
    if (!QUIET_PATHS.test(path)) dirtyTask = true;
    save();
    parentsSync();
  }
  let nameTimer = 0;
  function wireParents() {
    const body = $("parentsBody");
    body.addEventListener("change", (e) => {
      const t = e.target;
      if (t.dataset.sk) { setSk(t.dataset.sk, Number(t.dataset.v)); afterChange("cfg.sk"); return; }
      const p = t.dataset.p;
      if (!p || t.type === "text" || t.type === "range") return;
      const v = t.type === "checkbox" ? t.checked : NUM_PATHS.has(p) ? Number(t.dataset.v) : t.dataset.v;
      if (p.startsWith("ops.")) {
        const next = { ...state.ops, [p.slice(4)]: v };
        if (!next.plus && !next.minus && !next.mal) { parentsSync(); return; }   // mindestens eine Rechenart
      }
      setP(p, v); afterChange(p);
    });
    body.addEventListener("input", (e) => {
      const t = e.target, p = t.dataset.p;
      if (!p) return;
      if (t.type === "range") { setP(p, Number(t.value)); afterChange(p); }
      else if (t.type === "text") {
        // sofort übernehmen, damit ein schneller Tipp auf eine andere Option den Namen nicht überschreibt; gespeichert wird gebündelt
        setP(p, cleanCfg({ name: t.value }).name);
        clearTimeout(nameTimer);
        nameTimer = setTimeout(save, 400);
      }
    });
    body.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.chip) {
        const id = b.dataset.chip, lv = skLevel(id);
        setSk(id, lv === 1 ? 2 : lv === 2 ? 0 : 1);
        afterChange("cfg.sk");
      } else if (b.id === "voiceTest") {
        if (!hasSpeech) { $("voiceMsg").textContent = " Dieses Gerät hat keine Sprachausgabe."; return; }
        $("voiceMsg").textContent = voice ? ` Stimme: ${voice.name}` : " Keine deutsche Stimme gefunden, das Gerät nimmt seine Standardstimme.";
        speak(`Gut gemacht${state.cfg.name ? ", " + state.cfg.name : ""}! So klingt die Sprachausgabe.`, true);
      } else if (b.dataset.lr) {
        const box = $("lernReset");
        if (b.dataset.lr === "ask") box.innerHTML = `<span class="note">Lernstand wirklich löschen? Bilder, Sterne und Einstellungen bleiben.</span><button class="link-btn danger" type="button" data-lr="yes">Ja, löschen</button><button class="link-btn" type="button" data-lr="no">Abbrechen</button>`;
        else {
          if (b.dataset.lr === "yes") { state.stats = {}; state.days = {}; state.err = {}; state.seq = 0; dirtyTask = true; save(); renderLernstand(); }
          box.innerHTML = `<button class="link-btn" type="button" data-lr="ask">Lernstand zurücksetzen</button>`;
        }
      }
    });
    body.addEventListener("toggle", (e) => { if (e.target.id === "pgLern" && e.target.open) renderLernstand(); }, true);
  }
  function setSk(id, v) {
    if (v === (DEFAULT_SK[id] ?? 1)) delete state.cfg.sk[id]; else state.cfg.sk[id] = v;
  }
  function openParents() {
    parentsSync();
    if ($("pgLern").open) renderLernstand();
    $("parents").hidden = false;
    $("parents").scrollTop = 0;
    try { $("parentsClose").focus({ preventScroll: true }); } catch (e) { $("parentsClose").focus(); }
  }
  function closeParents() {
    $("parents").hidden = true;
    if (dirtyTask && !offerOpen) { dirtyTask = false; setFeedback("", ""); newTask(); } else focusAnswer();
  }
  $("parentsBtn").addEventListener("click", openParents);
  $("parentsClose").addEventListener("click", closeParents);
  $("parents").addEventListener("click", (e) => { if (e.target.id === "parents") closeParents(); });

  function syncSettings() {
    const btn = $("soundBtn");
    btn.textContent = state.sound ? "Ton an" : "Ton aus";
    btn.setAttribute("aria-pressed", String(state.sound));
  }
  $("soundBtn").addEventListener("click", () => {
    state.sound = !state.sound;
    if (!state.sound && hasSpeech) { try { window.speechSynthesis.cancel(); } catch (e) { /* egal */ } }
    save(); syncSettings();
    if (!$("parents").hidden) parentsSync();
  });

  // ---------- Spielstand ----------
  const BACKUP_KEY = "zr-backup-at";
  const backupAt = () => { try { return Number(localStorage.getItem(BACKUP_KEY)) || 0; } catch (e) { return 0; } };
  function markBackup() { try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) { /* egal */ } renderSaveStatus(); }
  const clockTime = (t) => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  function renderSaveStatus() {
    const el = $("saveStatus");
    if (!el) return;
    const when = state.savedAt ? ` Zuletzt gespeichert um ${clockTime(state.savedAt)} Uhr.` : "";
    let text;
    if (cloud.status === "on") text = "Wird automatisch in deinem Claude-Konto gespeichert und ist auf jedem Gerät gleich, auf dem du mit diesem Konto angemeldet bist." + when;
    else if (!localOk) text = "Dieser Browser speichert gerade nichts (zum Beispiel im privaten Fenster). Sichere den Fortschritt mit dem Spielstand-Code.";
    else text = "Wird automatisch in diesem Browser auf diesem Gerät gespeichert." + when +
      (cloud.status === "error" ? " Das Speichern im Claude-Konto klappt gerade nicht." : "") +
      " Für ein anderes Gerät oder als Sicherung: „Sicherung speichern“.";
    if (cloud.status !== "on") {
      const b = backupAt(), days = b ? Math.floor((Date.now() - b) / 864e5) : 0;
      text += b ? ` Letzte Sicherung: ${days === 0 ? "heute" : days === 1 ? "gestern" : "vor " + days + " Tagen"}.` : " Noch nie gesichert.";
      if (state.correct >= 30 && (!b || days >= 14)) text += " Es ist Zeit für eine Sicherung.";
    }
    el.textContent = text;
  }
  function wireSaveUI() {
    let pendingImport = null;
    // Sicherung: über das Teilen-Menü des Geräts (zum Beispiel in eine Notiz oder Nachricht an sich selbst), sonst in die Zwischenablage
    $("backupBtn").addEventListener("click", async () => {
      const code = exportCode(), msg = $("backupMsg");
      try {
        if (navigator.share) {
          await navigator.share({ title: "Rechenreise Spielstand", text: code });
          markBackup(); msg.textContent = "Gesichert. Bewahre die Notiz oder Nachricht gut auf.";
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") { msg.textContent = "Abgebrochen. Es wurde nichts gesichert."; return; }
      }
      try { await navigator.clipboard.writeText(code); markBackup(); msg.textContent = "Code kopiert. Jetzt in einer Notiz einfügen und aufbewahren."; }
      catch (e) { $("codeShowBtn").click(); msg.textContent = "Kopiere den Code unten und bewahre ihn auf."; }
    });
    $("codeShowBtn").addEventListener("click", () => {
      $("codeInBox").hidden = true;
      $("codeOut").value = exportCode();
      $("codeCopyMsg").textContent = "";
      $("codeBox").hidden = false;
      $("codeOut").select();
    });
    $("codeCopyBtn").addEventListener("click", () => {
      const done = () => { $("codeCopyMsg").textContent = "Kopiert."; markBackup(); };
      const fallback = () => { $("codeOut").select(); $("codeCopyMsg").textContent = "Markiert. Jetzt mit Strg+C oder „Kopieren“ übernehmen."; };
      try { navigator.clipboard.writeText($("codeOut").value).then(done, fallback); } catch (e) { fallback(); }
    });
    $("codeEnterBtn").addEventListener("click", () => {
      $("codeBox").hidden = true;
      $("codeInMsg").textContent = "";
      $("codeConfirm").hidden = true;
      $("codeInBox").hidden = false;
      $("codeIn").focus();
    });
    $("codeLoadBtn").addEventListener("click", () => {
      const next = parseCode($("codeIn").value);
      if (!next) {
        $("codeInMsg").textContent = "Dieser Code passt nicht. Er beginnt mit „ZR2.“ (oder „ZR1.“ aus älteren Versionen) und muss vollständig kopiert sein.";
        $("codeConfirm").hidden = true;
        return;
      }
      pendingImport = next;
      $("codeInMsg").textContent = "";
      $("codeConfirmText").textContent = `Spielstand mit ${next.correct} richtigen Aufgaben und ${next.album.length} Bildern laden? Der jetzige Stand (${state.correct} Aufgaben, ${state.album.length} Bilder) wird ersetzt.`;
      $("codeConfirm").hidden = false;
    });
    $("codeNo").addEventListener("click", () => { pendingImport = null; $("codeConfirm").hidden = true; });
    $("codeYes").addEventListener("click", () => {
      if (!pendingImport) return;
      adopt(pendingImport);
      pendingImport = null;
      dirtyTask = true;
      save();
      $("codeConfirm").hidden = true;
      $("codeIn").value = "";
      $("codeInMsg").textContent = "Spielstand geladen.";
    });
    $("resetRow").addEventListener("click", (e) => {
      const id = e.target.id, box = $("resetRow");
      if (id === "resetBtn") box.innerHTML = `<span class="note">Wirklich alles zurücksetzen? Die Einstellungen bleiben.</span><button class="link-btn danger" id="resetYes" type="button">Ja, zurücksetzen</button><button class="link-btn" id="resetNo" type="button">Abbrechen</button>`;
      else if (id === "resetNo" || id === "resetYes") {
        if (id === "resetYes") {
          const keep = { max: state.max, ops: state.ops, level: state.level, pad: state.pad, sound: state.sound, cfg: state.cfg };
          state = { ...freshState(), ...keep };
          dirtyTask = true; save(); renderProgress(); renderLernstand();
        }
        box.innerHTML = `<button class="link-btn" id="resetBtn" type="button">Alles zurücksetzen (Fortschritt, Sammlung, Lernstand)</button>`;
      }
    });
  }

  // ---------- Start ----------
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* kein Problem */ }
  buildParents();
  wireParents();
  wireSaveUI();
  load();
  syncSettings();
  applyPad();
  renderProgress();
  renderSaveStatus();
  drawBackdrop();
  newTask();
  initCloud();
})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
