      ["Die Werkbank", `Zusammen mit ${mk} baust du eine Werkbank. „Jedes Handwerk braucht einen festen Platz“, sagt ${er}. Du stellst dich gleich dahinter und probierst alles aus.`],
      ["Das erste Werkzeug", `${mk} schenkt dir ${G.wz}. Du hängst dein Werkzeug an die Wand über der Werkbank, damit du es immer gleich findest.`],
      ["Der Gesellenbrief", `Dein Gesellenbrief hängt jetzt gerahmt an der Wand! Als ${gradeName(2)} darfst du eigene ${G.w} machen. Die ersten stehen schon im Regal.`],
      [G.h ? "Das Feuer brennt" : "Ein großer Schrank", G.h ? `Heute wird ${G.h} angeheizt. Es wird warm in der ${G.o}, und im Regal stehen immer mehr ${G.w}.` : `Ein großer Schrank kommt dazu, und im Regal stehen immer mehr ${G.w}. ${mk} nickt zufrieden.`],
      ["Die erste Kundschaft", `Es klopft! ${G.k} braucht ${G.kw}. ${mk} schaut dir über die Schulter, aber du schaffst es ganz allein.`],
      ["Der Meisterbrief", `Du bist ${gradeName(3)}! ${mk} gibt dir den großen Schlüssel: Ab heute ist es deine ${G.o}. Über der Tür hängt dein eigenes Zunftschild.`],
      ["Das Meisterstück", `Dein Meisterstück ist fertig: ${G.ms}. Die halbe Stadt kommt, um es zu bestaunen, und sogar die Werkstattkatze schnurrt stolz.`],
    ];
  }

  // Das Bild der Werkstatt: ein Fachwerkraum, der mit jedem Kapitel voller wird
  function workshopSVG(s, stage, u) {
    const G = GUILD[s.id] || GUILD.x2, sym = ZSYM[s.id] || ZSYM.x2, tin = TINCT[SKILLS.indexOf(s) % TINCT.length];
    const beam = "#6b4426", dark = "#3b2a1e", pc = G.pc, gold = "#e2a93a";
    const item = (x, y, sc, c = pc, d = dark, k = "") => `<g transform="translate(${x} ${y}) scale(${sc})">${sym(c, d, u + k + x + "_" + y)}</g>`;
    const o = [];
    o.push(`<defs><linearGradient id="${u}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0f0"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient>
      <radialGradient id="${u}glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>`);
    o.push(`<rect width="360" height="220" fill="#f1e4c9"/><rect width="360" height="176" fill="${tin}" opacity=".07"/>`);
    // Fenster mit Hügeln draußen
    o.push(`<rect x="24" y="34" width="60" height="64" fill="url(#${u}sky)"/><path d="M24 84Q44 72 62 80T84 76V98H24Z" fill="#9cc58a"/><circle cx="72" cy="48" r="6" fill="#fff3b0"/>
      <g fill="none" stroke="${beam}" stroke-width="4"><rect x="24" y="34" width="60" height="64"/><path d="M54 34V98M24 66H84"/></g>`);
    // Tür: zu, ab Kapitel 6 offen mit Kundschaft
    if (stage >= 6) {
      o.push(`<path d="M280 176V96A28 26 0 0 1 336 96V176Z" fill="url(#${u}sky)"/><path d="M280 160Q308 150 336 158V176H280Z" fill="#9cc58a"/>`);
      o.push(`<g fill="${dark}"><circle cx="309" cy="118" r="8"/><path d="M296 176L299 132C302 127 316 127 319 132L322 176Z"/><path d="M300 112Q309 100 318 112Z"/></g><path d="M299 140L290 156" stroke="${dark}" stroke-width="4" stroke-linecap="round"/><rect x="284" y="152" width="12" height="9" rx="2" fill="${pc}"/>`);
      o.push(`<path d="M280 96A28 26 0 0 1 336 96V176H332V98A24 22 0 0 0 284 98V176H280Z" fill="${beam}"/><path d="M336 100L350 108V176L336 176Z" fill="#8a5a33"/>`);
    } else {
      o.push(`<path d="M280 176V96A28 26 0 0 1 336 96V176Z" fill="#8a5a33" stroke="${beam}" stroke-width="3"/><path d="M299 80V176M317 80V176" stroke="#6e4426" stroke-width="1.4"/><circle cx="326" cy="138" r="2.6" fill="${dark}"/>`);
    }
    // Fachwerk und Boden
    o.push(`<g fill="${beam}"><rect width="360" height="12"/><rect width="10" height="176"/><rect x="350" width="10" height="176"/><rect x="262" y="12" width="8" height="164"/></g>`);
    o.push(`<rect y="176" width="360" height="44" fill="#b8875a"/><g stroke="#9c6f45" stroke-width="1.2">${[192, 206].map((y) => `<path d="M0 ${y}H360"/>`).join("")}${[40, 110, 190, 260, 330].map((x, i) => `<path d="M${x + (i % 2) * 20} 176V192M${x + 35} 192V206M${x + 10} 206V220"/>`).join("")}</g><rect y="174" width="360" height="4" fill="${beam}"/>`);
    // 1: Laterne und Hocker
    o.push(`<path d="M128 12V26" stroke="${dark}" stroke-width="1.5"/><circle cx="128" cy="36" r="22" fill="url(#${u}glow)"/><path d="M121 26H135L133 44H123Z" fill="${dark}"/><rect x="124.5" y="29" width="7" height="12" fill="#ffd27a"/>`);
    o.push(`<g fill="#7a4a28"><rect x="104" y="150" width="28" height="6" rx="2"/><path d="M107 156L104 176H108L111 156ZM129 156L132 176H128L125 156Z"/></g>`);
    // 5: Feuerstelle oder Schrank (hinten, unter dem Fenster)
    if (stage >= 5) {
      if (G.h) {
        o.push(`<path d="M20 176V136C20 118 34 108 55 108S90 118 90 136V176Z" fill="#a4573c"/><g stroke="#7d3f2a" stroke-width="1">${[120, 132, 144, 156, 168].map((y) => `<path d="M22 ${y}H88"/>`).join("")}</g>
          <path d="M38 176V150A17 17 0 0 1 72 150V176Z" fill="#2a1a12"/><circle cx="55" cy="164" r="22" fill="url(#${u}glow)"/><path d="M46 176C44 166 50 162 52 154C55 162 58 158 60 152C64 160 66 168 63 176Z" fill="#ff9a3c"/><path d="M51 176C50 170 54 167 55 162C57 168 60 170 59 176Z" fill="#ffe08a"/>`);
      } else {
        o.push(`<rect x="24" y="112" width="62" height="64" rx="2" fill="#8a5a33" stroke="${beam}" stroke-width="2"/><path d="M55 114V174" stroke="${beam}" stroke-width="1.6"/><circle cx="51" cy="144" r="1.8" fill="${dark}"/><circle cx="59" cy="144" r="1.8" fill="${dark}"/>
          <path d="M32 112L36 100H48L52 112Z" fill="#b5653a"/><g fill="#4f8a4a"><ellipse cx="38" cy="96" rx="5" ry="3" transform="rotate(-30 38 96)"/><ellipse cx="46" cy="94" rx="5" ry="3" transform="rotate(30 46 94)"/><circle cx="42" cy="90" r="3.4" fill="#d14f7a"/></g>`);
      }
    }
    // 4–6: Regal mit Waren
    if (stage >= 4) {
      o.push(`<g fill="#7a4a28"><rect x="98" y="56" width="54" height="4"/><rect x="98" y="88" width="54" height="4"/><rect x="98" y="120" width="54" height="4"/><rect x="98" y="50" width="3" height="76"/><rect x="149" y="50" width="3" height="76"/></g>`);
      const slots = [[104, 37], [126, 37], [104, 69], [126, 69], [104, 101], [126, 101]], n = stage >= 6 ? 6 : stage >= 5 ? 4 : 2;
      slots.slice(0, n).forEach(([x, y], i) => o.push(item(x, y, 0.47, pc, dark, "s" + i)));
    }
    // 2: Werkbank, Lehrling dahinter
    if (stage >= 2) {
      o.push(`<g fill="${dark}"><circle cx="207" cy="94" r="8.5"/><path d="M198 92C199 82 215 82 216 92C212 88 202 88 198 92Z"/><path d="M193 132V112C193 105 199 103 207 103S221 105 221 112V132Z"/></g>`);
      o.push(`<path d="M199 108H215V132H199Z" fill="${tin}" opacity=".85"/><path d="M194 116L186 128M220 116L228 128" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>`);
      o.push(`<g fill="#8a5a33"><rect x="156" y="128" width="102" height="7" rx="1.5"/><rect x="162" y="135" width="6" height="41"/><rect x="246" y="135" width="6" height="41"/><rect x="162" y="158" width="90" height="4"/></g>`);
      if (stage >= 6) o.push(item(166, 109, 0.48, pc, dark, "b"));
    }
    // 3: Werkzeugbrett mit dem Zunftzeichen in Eisen
    if (stage >= 3) {
      o.push(`<rect x="164" y="24" width="86" height="48" rx="3" fill="#a87447" stroke="${beam}" stroke-width="2"/><g fill="${dark}"><circle cx="170" cy="30" r="1.4"/><circle cx="244" cy="30" r="1.4"/><circle cx="170" cy="66" r="1.4"/><circle cx="244" cy="66" r="1.4"/></g>`);
      o.push(item(190, 27, 0.85, "#3a3436", "#a87447", "t"));
    }
    // 4: Gesellenbrief, 7: Meisterbrief
    const letter = (x, sealCol) => `<rect x="${x}" y="78" width="26" height="30" fill="#6b4426"/><rect x="${x + 3}" y="81" width="20" height="24" fill="#fbf3df"/><path d="M${x + 6} 87H${x + 20}M${x + 6} 91H${x + 20}M${x + 6} 95H${x + 16}" stroke="#b9a27a" stroke-width="1"/><circle cx="${x + 17}" cy="100" r="3" fill="${sealCol}"/>`;
    if (stage >= 4) o.push(letter(166, "#a5322c"));
    if (stage >= 7) {
      o.push(letter(226, gold));
      // Zunftschild in Gold über der Tür, Blumenkasten am Fenster
      o.push(`<path d="M346 18H300M300 18V26M322 18V26" stroke="${dark}" stroke-width="2"/><path d="M290 28H332V46C332 56 322 62 311 66 300 62 290 56 290 46Z" fill="${tin}" stroke="${gold}" stroke-width="2.5"/>`);
      o.push(`<g transform="translate(298 30) scale(.65)">${sym(gold, tin, u + "sg")}</g>`);
      o.push(`<rect x="22" y="98" width="64" height="8" rx="2" fill="#8a5a33"/><g>${[30, 40, 50, 60, 70, 78].map((x, i) => `<path d="M${x} 98V90" stroke="#4f8a4a" stroke-width="1.5"/><circle cx="${x}" cy="88" r="3.2" fill="${["#d14f7a", "#f0b84a", "#e8e4f0"][i % 3]}"/>`).join("")}</g>`);
    }
    // 8: Meisterstück im Vordergrund, Girlande, Katze
    if (stage >= 8) {
      o.push(`<g>${Array.from({ length: 13 }, (_, i) => { const x = 14 + i * 26; return `<path d="M${x} 13L${x + 13} 13L${x + 6.5} 25Z" fill="${["#d24a4a", "#f0b84a", "#3f9150", "#3a78c0", "#7a4bb0"][i % 5]}"/>`; }).join("")}<path d="M10 13Q180 20 350 13" stroke="${dark}" stroke-width="1" fill="none"/></g>`);
      o.push(`<circle cx="180" cy="186" r="40" fill="url(#${u}glow)"/><path d="M152 214L158 196H202L208 214Z" fill="#a5322c"/><rect x="156" y="192" width="48" height="6" rx="2" fill="#c0463a"/>`);
      o.push(item(162, 150, 0.95, gold, "#8a5f12", "m"));
      o.push(`<g fill="#fff">${[[150, 160], [212, 156], [182, 140]].map(([x, y]) => `<path d="M${x} ${y - 5}L${x + 1.3} ${y - 1.3}L${x + 5} ${y}L${x + 1.3} ${y + 1.3}L${x} ${y + 5}L${x - 1.3} ${y + 1.3}L${x - 5} ${y}L${x - 1.3} ${y - 1.3}Z"/>`).join("")}</g>`);
      o.push(`<g fill="${dark}"><ellipse cx="80" cy="206" rx="20" ry="9"/><circle cx="96" cy="198" r="7"/><path d="M91 193L92 186L96 192ZM99 192L102 186L102 194Z"/><path d="M61 208C52 206 50 198 56 196" fill="none" stroke="${dark}" stroke-width="4" stroke-linecap="round"/></g>`);
    }
    if (stage === 0) o.push(`<rect width="360" height="220" fill="#fffaf0" opacity=".55"/>`);
    return `<svg viewBox="0 0 360 220" aria-hidden="true">${o.join("")}</svg>`;
  }
  let toastTimer = 0;
  function showToast(html) {
    const t = $("toast");
    t.innerHTML = html; t.hidden = false;
    t.classList.remove("in"); void t.offsetWidth; t.classList.add("in");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }
  function announceGrade(skillId, g) {
    const s = SKILL_BY_ID[skillId];
    logEv("G", skillId, g);
    showToast(`${emblemSVG(s, g)}<div><b>Lehrling bei den ${/n$/.test(s.zunft) ? s.zunft : s.zunft + "n"}!</b><span>Neues Zunftzeichen für ${s.group === "mal" ? "die " + s.label : "„" + s.label + "“"}. Deine ${(GUILD[s.id] || GUILD.x2).o} ist eröffnet!</span></div>`);
  }
  function announceChapter(id, k) {
    const s = SKILL_BY_ID[id], G = GUILD[id] || GUILD.x2, g = (state.stats[id] || {}).g || 1;
    logEv("W", id, k);
    showToast(`${emblemSVG(s, g)}<div><b>Neues Kapitel in deiner ${G.o}!</b><span>Kapitel ${k}: ${wsChapters(s)[k - 1][0]}. Zu lesen im Album unter Zunftzeichen.</span></div>`);
    speak(`Neues Kapitel in deiner ${G.o}!`);
  }
  // Gesellenbrief und Meisterbrief: eine kleine Urkunde, wenn ein höherer Grad erreicht ist
  let certQueue = null;
  function showCert() {
    const { s, g, ws: certWs } = certQueue;
    certQueue = null;
    logEv("G", s.id, g);
    const name = state.cfg.name, f = state.cfg.titel !== "m", what = s.group === "mal" ? "die " + s.label : "„" + s.label + "“";
    $("certTitle").textContent = g >= 3 ? "Meisterbrief" : "Gesellenbrief";
    $("certZunft").textContent = "Zunft der " + s.zunft;
    $("certEmblem").innerHTML = emblemSVG(s, g);
    $("certText").textContent = g >= 3
      ? `Hiermit ${name ? "wird " + name : "wirst du"} ${f ? "zur" : "zum"} ${gradeName(3)} der Zunft der ${s.zunft} ernannt. ${what[0].toUpperCase() + what.slice(1)} sitzt, sogar an zwei verschiedenen Tagen!`
      : `Hiermit ${name ? "wird " + name : "wirst du"} als ${gradeName(2)} in die Zunft der ${s.zunft} aufgenommen. Du kannst ${what} jetzt sicher.`;
    $("certWs").textContent = certWs ? `Und in deiner ${(GUILD[s.id] || GUILD.x2).o} beginnt Kapitel ${certWs}: ${wsChapters(s)[certWs - 1][0]}.` : "";
    $("toast").hidden = true;
    $("cert").hidden = false;
    $("cert").scrollTop = 0;
    try { $("certClose").focus({ preventScroll: true }); } catch (e) { $("certClose").focus(); }
    setTimeout(() => SFX.mark(), 250);
    speak(`${g >= 3 ? "Meisterbrief" : "Gesellenbrief"}! Du bist jetzt ${gradeName(g)} in der Zunft der ${s.zunft}!`);
  }
  function closeCert() {
    $("cert").hidden = true;
    setFeedback("", "");
    afterTask();
  }

  // ---------- Aufgaben stellen ----------
  function newTask() {
    if (offerOpen) return;
    task = nextTask();
    input = ""; tries = 0; revealed = false; locked = false;
    shownAt = performance.now(); firstMs = null; away = false;
    renderTask(""); renderTags(); renderPic();
    logEv("A", task.skill, logTask(task));
    hintEl.hidden = true;
    focusAnswer();
    if (state.cfg.readTask) speak(taskWords(task));
  }
  // Nach einer gelösten Aufgabe: entweder Angebot für etwas Leichteres oder gleich die nächste
  function afterTask() {
    if (needOffer()) showOffer(); else newTask();
  }
  function showOffer() {
    offerOpen = true; locked = true;
    logEv("F");
    setFeedback("", "");
    hintEl.hidden = true;
    $("offer").hidden = false;
    $("checkBtn").hidden = true;
    $("offerText").textContent = phrase([
      "Das waren gerade ein paar knifflige Aufgaben. Das ist völlig in Ordnung! Soll als Nächstes etwas Leichteres kommen?",
      "Puh, die waren schwer. Möchtest du kurz etwas Leichteres rechnen?",
    ]);
    try { $("offerYes").focus({ preventScroll: true }); } catch (e) { $("offerYes").focus(); }
  }
  function closeOffer(accept) {
    offerAnswered(accept);
    logEv("FA", accept ? 1 : 0);
    $("offer").hidden = true;
    offerOpen = false;
    applyPad();
    newTask();
  }
  $("offerYes").addEventListener("click", () => closeOffer(true));
  $("offerNo").addEventListener("click", () => closeOffer(false));

  // ---------- Eingabe ----------
  const coarse = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  const padVisible = () => state.pad === "show" || (state.pad === "auto" && coarse);
  const overlayOpen = () => ["reward", "album", "viewer", "parents", "cert", "markView"].some((id) => !$(id).hidden);

  function applyPad() {
    const show = padVisible();
    $("pad").hidden = !show;
    $("checkBtn").hidden = show;
    // Mit Bildschirm-Tasten am Tablet keine zweite Tastatur aufklappen; eine echte Tastatur geht trotzdem
    answerEl.setAttribute("inputmode", show && coarse ? "none" : "numeric");
  }
  function focusAnswer() {
    if (overlayOpen() || offerOpen) return;
    if (coarse && padVisible()) return;
    try { answerEl.focus({ preventScroll: true }); } catch (e) { answerEl.focus(); }
  }
  answerEl.addEventListener("input", () => {
    if (locked) { answerEl.value = input; return; }
    input = answerEl.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 3);
    renderTask("");
  });
  function typeDigit(d) {
    if (locked || input.length >= 3) return;
    if (input === "0") input = "";
    input += d;
    renderTask("");
  }
  function del() {
    if (locked) return;
    input = input.slice(0, -1);
    renderTask("");
  }

  function check() {
    if (locked || input === "") return;
    const val = parseInt(input, 10);
    if (firstMs === null && !away) firstMs = performance.now() - shownAt;
    if (val === task.result) solved(); else wrong(val);
  }

  function solved() {
    locked = true;
    logEv("R", task.result, 1, Math.round(performance.now() - shownAt), tries + 1, "");
    renderTask("right");
    const h = state.cfg.helpAfter;
    const code = revealed ? 0 : tries === 0 ? 3 : tries < h ? 2 : 1;
    const ws0 = wsStage(task.skill);
    const { grade } = recordResult(task, code, away ? NaN : firstMs);
    const ws1 = wsStage(task.skill);
    let reward = false, popAt = -1;
    if (!revealed) {
      state.correct += 1; state.sincePic += 1;
      popAt = state.sincePic - 1;
      if (state.sincePic >= state.cfg.rewardEvery) { state.sincePic = 0; reward = true; }
    }
    save();
    renderProgress(reward ? state.cfg.rewardEvery - 1 : popAt);
    const text = praise(code, task.hard);
    setFeedback(text, "good");
    if (reward) {
      [...starsEl.children].forEach((s) => s.classList.add("on"));
      setFeedback(`${text} ${state.cfg.rewardEvery} Sterne! Da wartet etwas auf dich …`, "good");
      SFX.pic();
      speak(text);
    } else {
      code === 3 ? SFX.ok(mem.streak) : code === 2 ? SFX.again() : code === 1 ? SFX.stay() : SFX.soft();
      if (code >= 1) speak(text);
    }
    if (grade === 1) setTimeout(() => announceGrade(task.skill, 1), 500);
    else if (grade >= 2) certQueue = { s: SKILL_BY_ID[task.skill], g: grade, ws: ws1 > ws0 ? ws1 : 0 };
    else if (ws1 > ws0) setTimeout(() => announceChapter(task.skill, ws1), 500);
    // Bei Bildaufgaben erst zuschauen, wie verteilt wird
    const shareMs = task.pic ? animateShare(true) + 900 : 0;
    setTimeout(reward ? showReward : () => (certQueue ? showCert() : afterTask()), Math.max(shareMs, reward ? 900 : code === 0 ? 1300 : 1000));
  }

  function wrong(val) {
    tries += 1;
    input = "";
    renderTask("wrong");
    SFX.soft();
    const h = state.cfg.helpAfter;
    let detective = null;
    if (tries === 1) {
      detective = state.cfg.detektiv ? diagnose(task, val) : null;
      const kind = detective ? detective.kind : "other";
      state.err[kind] = (state.err[kind] || 0) + 1;
    }
    logEv("R", val, 0, Math.round(performance.now() - shownAt), tries, detective ? detective.kind : "");
    if (tries < h) {
      setFeedback(detective ? detective.text : phrase(PHRASES.nudge1), "try");
      if (state.cfg.speechMode === "mut") speak(phrase(PHRASES.mut1));
    } else if (tries === h) {
      const type = hintType(task);
      setFeedback(detective ? detective.text : type === "pic" ? "Schau, wie es verteilt wird:" : type === "line" ? (task.gap ? "Schau auf den Zahlenstrahl:" : "Spring auf dem Zahlenstrahl mit:") : type === "field" ? (task.op === ":" ? "Zähl die Reihen!" : "Zähl die Punkte. In Fünferschritten geht's schneller!")
        : type === "steps" ? "Hier ist ein Rechenweg für dich:"
        : task.op === "+" ? "Zähl alle Punkte zusammen." : "Zähl die Punkte, die übrig bleiben.", "try");
      renderHint();
      logEv("H", type);
      if (state.cfg.speechMode === "mut") speak(phrase(PHRASES.mut2));
    } else {
      revealed = true;
      logEv("L");
      setFeedback(`Das Ergebnis ist ${task.result}. Tipp es ein!`, "try");
      renderHint();
    }
  }

  const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "ok"];
  $("pad").innerHTML = KEYS.map((k) =>
    k === "del" ? `<button class="key del" type="button" data-k="del" aria-label="Löschen">Löschen</button>`
    : k === "ok" ? `<button class="key ok" type="button" data-k="ok" aria-label="Prüfen">OK</button>`
    : `<button class="key" type="button" data-k="${k}">${k}</button>`).join("");
  $("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    if (k === "del") del(); else if (k === "ok") check(); else typeDigit(k);
    focusAnswer();
  });
  $("checkBtn").addEventListener("click", () => { check(); focusAnswer(); });

  document.addEventListener("keydown", (e) => {
    const field = e.target.closest && e.target.closest("input:not(#answer), textarea, select");
    if (overlayOpen()) {
      if (e.key === "Escape") { e.preventDefault(); closeOverlays(); return; }
      const onButton = e.target.closest && e.target.closest("button, summary, label");
      if (e.key === "Enter" && !onButton && !field && $("parents").hidden) { e.preventDefault(); closeOverlays(); }
      return;
    }
    if (offerOpen || field) return;
    // Im Antwortfeld tippt der Browser selbst; nur Enter prüft
    if (e.target === answerEl) {
      if (e.key === "Enter") { e.preventDefault(); check(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // Getippt, während etwas anderes den Fokus hat: Ziffer trotzdem ins Antwortfeld

    const cr = CREATURES[card.c], w = worldOf(card), wp = worldProgress(w.id), lp = legendProgress();
    $("rewardTitle").textContent = gold ? `${mark === state.correct ? "" : "Schon über "}${mark} richtige Aufgaben! Eine Legende erscheint!` : "Geschafft! Ein neues Bild für deine Sammlung";

    $("rewardWorld").textContent = cr.legend ? `Legenden · ${lp.found} von ${lp.total} entdeckt` : `${w.name} · ${wp.found} von ${wp.total} ${w.what} entdeckt`;

    document.querySelectorAll(".gspark").forEach((x) => x.remove());

        sheet.appendChild(sp);

    $("reward").hidden = false;
    $("rewardClose").focus();
    const art = /^Goldene /.test((cr.golden || "") + " ") ? "eine" : "ein";

      </details>

      <details class="pg"><summary>Belohnungen</summary>
        ${seg("cfg.rewardEvery", "Ein Bild nach je", [[3, "3"], [5, "5"], [7, "7"], [10, "10"]], "…richtig gelösten Aufgaben.")}
        ${seg("cfg.goldEvery", "Ein goldenes Bild nach je", [[0, "nie"], [50, "50"], [100, "100"], [200, "200"]], "…richtig gelösten Aufgaben. Planbar, kein Zufall.")}
      </details>

      <details class="pg"><summary>Bedienung</summary>
        ${seg("pad", "Bildschirm-Tasten", [["auto", "automatisch"], ["show", "immer zeigen"], ["hide", "nur Tastatur"]],
          "„Automatisch“ zeigt die großen Zahlentasten am Tablet und Handy. Am Computer tippt man ins Antwortfeld. Die Tastatur funktioniert immer.", { auto: "padAuto", show: "padShow", hide: "padHide" })}
      </details>

      <details class="pg" id="pgLern"><summary>Lernstand</summary>
        <p class="note" id="lernSum"></p>
        <div class="ls-list" id="lernList"></div>
        <p class="note">Punkte: <i class="ld ok"></i> ohne Hilfe richtig · <i class="ld help"></i> mit Hilfe · <i class="ld no"></i> Lösung gezeigt. Eine Auswertung mit Verlauf kommt später.</p>
        <div class="reset-row" id="lernReset"><button class="link-btn" type="button" data-lr="ask">Lernstand zurücksetzen</button></div>
      </details>

      ${homeGroup()}

      <details class="pg"><summary>Spielstand</summary>
        <p class="note" id="saveStatus"></p>
        <div class="save-actions">
          <button class="small-btn primary" id="backupBtn" type="button">Sicherung speichern</button>
          <button class="small-btn" id="codeShowBtn" type="button">Spielstand-Code anzeigen</button>
          <button class="small-btn" id="codeEnterBtn" type="button">Code eingeben</button>
        </div>
        <p class="note" id="backupMsg" role="status"></p>
        <div class="code-box" id="codeBox" hidden>
          <label class="note" for="codeOut">Diesen Code kopieren und aufheben, zum Beispiel in einer Notiz. Auf einem anderen Gerät unter „Code eingeben“ einfügen.</label>
          <textarea id="codeOut" rows="3" readonly></textarea>
          <div class="code-row"><button class="small-btn" id="codeCopyBtn" type="button">Kopieren</button><span class="note" id="codeCopyMsg" role="status"></span></div>
        </div>
        <div class="code-box" id="codeInBox" hidden>
          <label class="note" for="codeIn">Spielstand-Code hier einfügen:</label>
          <textarea id="codeIn" rows="3" placeholder="ZR2.…" autocomplete="off" spellcheck="false"></textarea>
          <div class="code-row"><button class="small-btn" id="codeLoadBtn" type="button">Laden</button><span class="note" id="codeInMsg" role="status"></span></div>
          <div class="code-row" id="codeConfirm" hidden>
            <span class="note" id="codeConfirmText"></span>
            <button class="link-btn danger" id="codeYes" type="button">Ja, laden</button>
            <button class="link-btn" id="codeNo" type="button">Abbrechen</button>
          </div>
        </div>
        <div class="reset-row" id="resetRow"><button class="link-btn" id="resetBtn" type="button">Alles zurücksetzen (Fortschritt, Sammlung, Lernstand)</button></div>
      </details>
      <details class="pg" id="pgLog"><summary>Protokoll für Claude</summary>
        <p class="note">Die App schreibt mit, wie gespielt wird: Aufgaben, Antworten mit Zeit, Hilfen, Pausen, Bilder und geänderte Einstellungen. Das bleibt auf diesem Gerät. Wenn du es mit Claude teilst, kann Claude sehen, wo es hakt, und die App gezielt verbessern. Der Name deines Kindes ist nicht enthalten.</p>
        <div class="p-field"><label class="tog"><input type="checkbox" id="logOn"><span>Protokoll aufzeichnen</span></label></div>
        <p class="note" id="logInfo"></p>
        <div class="save-actions">
          <button class="small-btn primary" id="logShare" type="button">Letzte 14 Tage teilen</button>
          <button class="small-btn" id="logShareAll" type="button">Alles teilen</button>
          <button class="small-btn" id="logShow" type="button">Anzeigen</button>
        </div>
        <p class="note" id="logMsg" role="status"></p>
        <div class="code-box" id="logBox" hidden>
          <textarea id="logOut" rows="8" readonly></textarea>
          <div class="code-row"><button class="small-btn" id="logCopy" type="button">Kopieren</button><span class="note" id="logCopyMsg" role="status"></span></div>
        </div>
        <div class="reset-row" id="logReset"><button class="link-btn" type="button" data-lg="ask">Protokoll löschen</button></div>
      </details>
      <p class="note version">Rechenreise · Version ${VERSION}</p>`;
  }

  const CHIP_TXT = { 0: "aus", 1: "normal", 2: "öfter üben" };
  const STATUS_TXT = { neu: "noch neu", uebend: "übt noch", sicher: "sicher", wackelig: "wackelt" };
  function parentsSync() {
    const body = $("parentsBody");
    body.querySelectorAll("[data-p]").forEach((inp) => {
      const v = getP(inp.dataset.p);
      if (inp.type === "radio") inp.checked = String(v) === inp.dataset.v;
      else if (inp.type === "checkbox") inp.checked = !!v;
      else if (inp.type === "range" || inp.type === "text") { if (document.activeElement !== inp) inp.value = v; }
    });
    body.querySelectorAll("[data-out]").forEach((o) => { o.textContent = getP(o.dataset.out) + " %"; });
    body.querySelectorAll("[data-sk]").forEach((inp) => { inp.checked = String(skLevel(inp.dataset.sk)) === inp.dataset.v; });
    body.querySelectorAll("[data-chip]").forEach((b) => {
      const s = SKILL_BY_ID[b.dataset.chip], lv = skLevel(s.id);
      b.dataset.s = lv;
      b.textContent = `${lv === 2 ? "★ " : ""}${s.id.slice(1)}er`;
      b.setAttribute("aria-label", `${s.label}: ${CHIP_TXT[lv]}. Tippen zum Ändern.`);
    });
    const manual = state.cfg.mode === "manual";
    $("pgAuto").classList.toggle("off", manual);
    $("pgAuto").querySelectorAll("input").forEach((i) => { i.disabled = manual; });
    $("pgAuto").querySelector("summary").textContent = manual ? "Auto-Modus (gerade aus)" : "Auto-Modus";
    renderSaveStatus();
    renderLogInfo();
  }
  function renderLogInfo() {
    const ev = LOG.ev, n = ev.filter((e) => e[1] === "A").length, ses = ev.filter((e) => e[1] === "S").length;
    $("logOn").checked = LOG.on;
    $("logInfo").textContent = ev.length
      ? `${ses} ${ses === 1 ? "Sitzung" : "Sitzungen"} mit ${n} Aufgaben seit ${dayOf(ev[0][0])} · Älteres als ${LOG_DAYS} Tage wird gelöscht.`
      : LOG.on ? "Noch nichts aufgezeichnet." : "Aufzeichnung ist aus.";
  }
  function renderLernstand() {
    const today = todayKey(), [n, ok] = state.days[today] || [0, 0];
    let n7 = 0, ok7 = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(Date.now() - i * 864e5), p = (x) => String(x).padStart(2, "0");
      const v = state.days[`${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`];
      if (v) { n7 += v[0]; ok7 += v[1]; }
    }
    $("lernSum").textContent = `Heute ${n} ${n === 1 ? "Aufgabe" : "Aufgaben"}, davon ${ok} ohne Hilfe richtig. Letzte 7 Tage: ${n7} Aufgaben, ${ok7} ohne Hilfe richtig.`;
    const on = new Set(enabledSkills().map((s) => s.id));
    $("lernList").innerHTML = SKILLS.map((s) => {
      const st = state.stats[s.id], status = statusOf(s.id);
      const dots = (st ? st.h : "").split("").map((c) => `<i class="ld ${c >= "2" ? "ok" : c === "1" ? "help" : "no"}"></i>`).join("");
      return `<div class="ls-row${on.has(s.id) ? "" : " off"}"><span class="ls-name">${s.label}${st && st.g ? `<small>${gradeName(st.g)}</small>` : ""}</span>` +
        `<span class="ls-dots" aria-label="letzte Ergebnisse">${dots || "<small>noch nicht geübt</small>"}</span><span class="ls-st st-${status}">${STATUS_TXT[status]}</span></div>`;
    }).join("");
  }

  function afterChange(path) {
    // Schieberegler: nur den letzten Wert behalten
    const lastEv = LOG.ev[LOG.ev.length - 1];
    if (lastEv && lastEv[1] === "E" && lastEv[2] === path && Date.now() - lastEv[0] < 5000) LOG.ev.pop();
    logEv("E", path, JSON.stringify(getP(path)));
    if (path === "pad") applyPad();
    if (path === "sound") syncSettings();
    if (path === "cfg.rewardEvery" || path === "cfg.goldEvery") renderProgress();
    if (!QUIET_PATHS.test(path)) dirtyTask = true;
    save();
    parentsSync();
  }
  let nameTimer = 0;
  function wireParents() {
    const body = $("parentsBody");
    body.addEventListener("change", (e) => {
      const t = e.target;
      if (t.dataset.sk) { setSk(t.dataset.sk, Number(t.dataset.v)); afterChange("cfg.sk"); return; }
      const p = t.dataset.p;
      if (!p || t.type === "text" || t.type === "range") return;
      const v = t.type === "checkbox" ? t.checked : NUM_PATHS.has(p) ? Number(t.dataset.v) : t.dataset.v;
      if (p.startsWith("ops.")) {
        const next = { ...state.ops, [p.slice(4)]: v };
        if (!next.plus && !next.minus && !next.mal && !next.luecke && !next.teilen) { parentsSync(); return; }   // mindestens eine Rechenart
      }
      setP(p, v); afterChange(p);
    });
    body.addEventListener("input", (e) => {
      const t = e.target, p = t.dataset.p;
      if (!p) return;
      if (t.type === "range") { setP(p, Number(t.value)); afterChange(p); }
      else if (t.type === "text") {
        // sofort übernehmen, damit ein schneller Tipp auf eine andere Option den Namen nicht überschreibt; gespeichert wird gebündelt
        setP(p, cleanCfg({ name: t.value }).name);
        clearTimeout(nameTimer);
        nameTimer = setTimeout(save, 400);
      }
    });
    body.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.chip) {
        const id = b.dataset.chip, lv = skLevel(id);
        setSk(id, lv === 1 ? 2 : lv === 2 ? 0 : 1);
        afterChange("cfg.sk");
      } else if (b.id === "voiceTest") {
        if (!hasSpeech) { $("voiceMsg").textContent = " Dieses Gerät hat keine Sprachausgabe."; return; }
        $("voiceMsg").textContent = voice ? ` Stimme: ${voice.name}` : " Keine deutsche Stimme gefunden, das Gerät nimmt seine Standardstimme.";
        speak(`Gut gemacht${state.cfg.name ? ", " + state.cfg.name : ""}! So klingt die Sprachausgabe.`, true);
      } else if (b.dataset.lr) {
        const box = $("lernReset");
        if (b.dataset.lr === "ask") box.innerHTML = `<span class="note">Lernstand wirklich löschen? Bilder, Sterne und Einstellungen bleiben.</span><button class="link-btn danger" type="button" data-lr="yes">Ja, löschen</button><button class="link-btn" type="button" data-lr="no">Abbrechen</button>`;
        else {
          if (b.dataset.lr === "yes") { state.stats = {}; state.days = {}; state.err = {}; state.seq = 0; dirtyTask = true; save(); renderLernstand(); }
          box.innerHTML = `<button class="link-btn" type="button" data-lr="ask">Lernstand zurücksetzen</button>`;
        }
      }
    });
    body.addEventListener("toggle", (e) => { if (e.target.id === "pgLern" && e.target.open) renderLernstand(); }, true);
  }
  function setSk(id, v) {
    if (v === (DEFAULT_SK[id] ?? 1)) delete state.cfg.sk[id]; else state.cfg.sk[id] = v;
  }
  function openParents() {
    logEv("O", "Eltern-Menü");
    parentsSync();
    if ($("pgLern").open) renderLernstand();
    $("parents").hidden = false;
    $("parents").scrollTop = 0;
    try { $("parentsClose").focus({ preventScroll: true }); } catch (e) { $("parentsClose").focus(); }
  }
  function closeParents() {
    $("parents").hidden = true;
    if (dirtyTask && !offerOpen) { dirtyTask = false; setFeedback("", ""); newTask(); } else focusAnswer();
  }
  // Das Eltern-Menü öffnet sich erst nach zwei Sekunden Gedrückthalten, damit Kinder nichts aus Versehen verstellen
  const HOLD_MS = 2000, pb = $("parentsBtn");
  let holdTimer = 0, holdAt = 0;
  function holdBegin() {
    if (holdTimer) return;
    holdAt = Date.now();
    pb.classList.add("holding");
    holdTimer = setTimeout(() => { holdTimer = 0; pb.classList.remove("holding"); openParents(); }, HOLD_MS);
  }
  function holdCancel() {
    if (!holdTimer) return;
    clearTimeout(holdTimer); holdTimer = 0;
    pb.classList.remove("holding");
  }
  pb.addEventListener("pointerdown", (e) => { e.preventDefault(); holdBegin(); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => pb.addEventListener(ev, holdCancel));
  pb.addEventListener("contextmenu", (e) => e.preventDefault());
  pb.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); if (!e.repeat) holdBegin(); } });
  pb.addEventListener("keyup", (e) => { if (e.key === "Enter" || e.key === " ") holdCancel(); });
  $("parentsClose").addEventListener("click", closeParents);
  $("parents").addEventListener("click", (e) => { if (e.target.id === "parents") closeParents(); });

  function syncSettings() {
    const btn = $("soundBtn");
    btn.textContent = state.sound ? "Ton an" : "Ton aus";
    btn.setAttribute("aria-pressed", String(state.sound));
  }
  $("soundBtn").addEventListener("click", () => {
    state.sound = !state.sound;
    if (!state.sound && hasSpeech) { try { window.speechSynthesis.cancel(); } catch (e) { /* egal */ } }
    save(); syncSettings();
    if (!$("parents").hidden) parentsSync();
  });

  // ---------- Spielstand ----------
  const BACKUP_KEY = "zr-backup-at";
  const backupAt = () => { try { return Number(localStorage.getItem(BACKUP_KEY)) || 0; } catch (e) { return 0; } };
  function markBackup() { try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) { /* egal */ } renderSaveStatus(); }
  const clockTime = (t) => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  function renderSaveStatus() {
    const el = $("saveStatus");
    if (!el) return;
    const when = state.savedAt ? ` Zuletzt gespeichert um ${clockTime(state.savedAt)} Uhr.` : "";
    let text;
    if (cloud.status === "on") text = "Wird automatisch in deinem Claude-Konto gespeichert und ist auf jedem Gerät gleich, auf dem du mit diesem Konto angemeldet bist." + when;
    else if (!localOk) text = "Dieser Browser speichert gerade nichts (zum Beispiel im privaten Fenster). Sichere den Fortschritt mit dem Spielstand-Code.";
    else text = "Wird automatisch in diesem Browser auf diesem Gerät gespeichert." + when +
      (cloud.status === "error" ? " Das Speichern im Claude-Konto klappt gerade nicht." : "") +
      " Für ein anderes Gerät oder als Sicherung: „Sicherung speichern“.";
    if (cloud.status !== "on") {
      const b = backupAt(), days = b ? Math.floor((Date.now() - b) / 864e5) : 0;
      text += b ? ` Letzte Sicherung: ${days === 0 ? "heute" : days === 1 ? "gestern" : "vor " + days + " Tagen"}.` : " Noch nie gesichert.";
      if (state.correct >= 30 && (!b || days >= 7)) text += " Es ist Zeit für eine Sicherung.";
    }
    el.textContent = text;
  }
  function wireSaveUI() {
    let pendingImport = null;
    // Sicherung: über das Teilen-Menü des Geräts (zum Beispiel in eine Notiz oder Nachricht an sich selbst), sonst in die Zwischenablage
    $("backupBtn").addEventListener("click", async () => {
      const code = exportCode(), msg = $("backupMsg");
      try {
        if (navigator.share) {
          await navigator.share({ title: "Rechenreise Spielstand", text: code });
          markBackup(); msg.textContent = "Gesichert. Bewahre die Notiz oder Nachricht gut auf.";
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") { msg.textContent = "Abgebrochen. Es wurde nichts gesichert."; return; }
      }
      try { await navigator.clipboard.writeText(code); markBackup(); msg.textContent = "Code kopiert. Jetzt in einer Notiz einfügen und aufbewahren."; }
      catch (e) { $("codeShowBtn").click(); msg.textContent = "Kopiere den Code unten und bewahre ihn auf."; }
    });
    $("codeShowBtn").addEventListener("click", () => {
      $("codeInBox").hidden = true;
      $("codeOut").value = exportCode();
      $("codeCopyMsg").textContent = "";
      $("codeBox").hidden = false;
      $("codeOut").select();
    });
    $("codeCopyBtn").addEventListener("click", () => {
      const done = () => { $("codeCopyMsg").textContent = "Kopiert."; markBackup(); };
      const fallback = () => { $("codeOut").select(); $("codeCopyMsg").textContent = "Markiert. Jetzt mit Strg+C oder „Kopieren“ übernehmen."; };
      try { navigator.clipboard.writeText($("codeOut").value).then(done, fallback); } catch (e) { fallback(); }
    });
    $("codeEnterBtn").addEventListener("click", () => {
      $("codeBox").hidden = true;
      $("codeInMsg").textContent = "";
      $("codeConfirm").hidden = true;
      $("codeInBox").hidden = false;
      $("codeIn").focus();
    });
    $("codeLoadBtn").addEventListener("click", () => {
      const next = parseCode($("codeIn").value);
      if (!next) {
        $("codeInMsg").textContent = "Dieser Code passt nicht. Er beginnt mit „ZR2.“ (oder „ZR1.“ aus älteren Versionen) und muss vollständig kopiert sein.";
        $("codeConfirm").hidden = true;
        return;
      }
      pendingImport = next;
      $("codeInMsg").textContent = "";
      $("codeConfirmText").textContent = `Spielstand mit ${next.correct} richtigen Aufgaben und ${next.album.length} Bildern laden? Der jetzige Stand (${state.correct} Aufgaben, ${state.album.length} Bilder) wird ersetzt.`;
      $("codeConfirm").hidden = false;
    });
    $("codeNo").addEventListener("click", () => { pendingImport = null; $("codeConfirm").hidden = true; });
    $("codeYes").addEventListener("click", () => {
      if (!pendingImport) return;
      adopt(pendingImport);
      pendingImport = null;
      dirtyTask = true;
      save();
      $("codeConfirm").hidden = true;
      $("codeIn").value = "";
      $("codeInMsg").textContent = "Spielstand geladen.";
    });
    $("resetRow").addEventListener("click", (e) => {
      const id = e.target.id, box = $("resetRow");
      if (id === "resetBtn") box.innerHTML = `<span class="note">Wirklich alles zurücksetzen? Die Einstellungen bleiben.</span><button class="link-btn danger" id="resetYes" type="button">Ja, zurücksetzen</button><button class="link-btn" id="resetNo" type="button">Abbrechen</button>`;
      else if (id === "resetNo" || id === "resetYes") {
        if (id === "resetYes") {
          const keep = { max: state.max, ops: state.ops, level: state.level, pad: state.pad, sound: state.sound, cfg: state.cfg };
          state = { ...freshState(), ...keep };
          dirtyTask = true; save(); renderProgress(); renderLernstand();
        }
        box.innerHTML = `<button class="link-btn" id="resetBtn" type="button">Alles zurücksetzen (Fortschritt, Sammlung, Lernstand)</button>`;
      }
    });
  }

  function wireLogUI() {
    const msg = $("logMsg");
    $("logOn").addEventListener("change", (e) => { logSet(e.target.checked); renderLogInfo(); });
    // Teilen als Textdatei (iPhone: zum Beispiel direkt in die Claude-App), sonst als Text, sonst kopieren
    const share = async (days) => {
      logFlush();
      const text = logText(days), d = new Date(), file = `rechenreise-protokoll-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.txt`;
      try {
        const f = typeof File === "function" ? new File([text], file, { type: "text/plain" }) : null;
        if (f && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: "Rechenreise Protokoll" }); msg.textContent = "Geteilt. In Claude einfach die Datei anhängen und fragen, was auffällt."; return; }
        if (navigator.share) { await navigator.share({ title: "Rechenreise Protokoll", text }); msg.textContent = "Geteilt."; return; }
      } catch (e) {
        if (e && e.name === "AbortError") { msg.textContent = "Abgebrochen."; return; }
      }
      try { await navigator.clipboard.writeText(text); msg.textContent = "Kopiert. Jetzt in den Chat mit Claude einfügen."; }
      catch (e) { show(days); msg.textContent = "Kopiere den Text unten."; }
    };
    const show = (days) => { $("logOut").value = logText(days); $("logCopyMsg").textContent = ""; $("logBox").hidden = false; };
    $("logShare").addEventListener("click", () => share(14));
    $("logShareAll").addEventListener("click", () => share(0));
    $("logShow").addEventListener("click", () => show(14));
    $("logCopy").addEventListener("click", () => {
      const fallback = () => { $("logOut").select(); $("logCopyMsg").textContent = "Markiert. Jetzt kopieren."; };
      try { navigator.clipboard.writeText($("logOut").value).then(() => { $("logCopyMsg").textContent = "Kopiert."; }, fallback); } catch (e) { fallback(); }
    });
    $("logReset").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-lg]"), box = $("logReset");
      if (!b) return;
      if (b.dataset.lg === "ask") box.innerHTML = `<span class="note">Protokoll wirklich löschen? Spielstand und Bilder bleiben.</span><button class="link-btn danger" type="button" data-lg="yes">Ja, löschen</button><button class="link-btn" type="button" data-lg="no">Abbrechen</button>`;
      else {
        if (b.dataset.lg === "yes") { logClear(); $("logBox").hidden = true; msg.textContent = "Protokoll gelöscht."; }
        box.innerHTML = `<button class="link-btn" type="button" data-lg="ask">Protokoll löschen</button>`;
        renderLogInfo();
      }
    });
  }

  // ---------- Start ----------
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* kein Problem */ }
  buildParents();
  wireParents();
  wireSaveUI();
  wireLogUI();
  logLoad();
  load();
  syncSettings();
  applyPad();
  renderProgress();
  renderSaveStatus();
  drawBackdrop();
  newTask();
  initCloud();
})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
