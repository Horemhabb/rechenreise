/* Layout: Bilderbuch auf Rechenheft-Karopapier – Titel mit Buntstiftstrich, Fortschritt, Aufgabenkarte, Ziffernfeld; unten die gemalte Märchenszene */
:root {
  --paper: #f2f6fb;
  --grid: #d3e1ef;
  --ink: #3b2f45;
  --muted: #7d6f80;
  --card: #fffaf0;
  --line: #cdbfa9;
  --plum: #7a4bb0;
  --plum-dark: #5d3590;
  --plum-soft: #f1e8fa;
  --rose: #a64a6b;
  --rose-soft: #fbeaf0;
  --green: #3f8a5c;
  --green-soft: #e4f3e8;
  --gold: #f0b84a;
  --gold-dark: #c9921e;
  --gold-soft: rgba(240, 184, 74, .38);
  --night: #14122b;
  --font-title: "Fraunces", Georgia, "Times New Roman", serif;
  --font-ui: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  /* Schrift für alle Zahlen: Aufgabe, Antwortfeld, Ziffernfeld */
  --font-num: "Lexend", "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 17px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, .opt input:focus-visible + span, .tog input:focus-visible + span {
  outline: 3px solid var(--plum); outline-offset: 3px;
}

.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.backdrop svg { display: block; width: 100%; height: 100%; }
.app {
  position: relative; z-index: 1;
  max-width: 480px; min-height: 100%; margin: 0 auto;
  padding-inline: 16px; padding-block: 16px 24px;
  display: flex; flex-direction: column; gap: 14px;
}

/* Karten: Papier mit feiner Kontur und leicht versetztem Schatten */
.progress, .task, .sheet, .settings {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 3px 3px 0 rgba(59, 47, 69, .12);
}

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 {
  font-family: var(--font-title); font-weight: 700; font-size: 1.85rem; letter-spacing: -.01em;
  margin: 0; line-height: 1.05; color: var(--plum); text-wrap: balance;
}
/* Titel in Regenbogenfarben, Buchstabe für Buchstabe; Gelb als Ocker, damit es auf hellem Papier lesbar bleibt */
h1 span:nth-child(6n+1) { color: #d24a4a; }
h1 span:nth-child(6n+2) { color: #e07b24; }
h1 span:nth-child(6n+3) { color: #c4960c; }
h1 span:nth-child(6n+4) { color: #3f9150; }
h1 span:nth-child(6n+5) { color: #3a78c0; }
h1 span:nth-child(6n+6) { color: #7a4bb0; }
.top-actions { display: flex; gap: 8px; }
.chip {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 9px;
  padding: 5px 11px; font-weight: 700; font-size: 0.88rem; white-space: nowrap; box-shadow: 2px 2px 0 rgba(59, 47, 69, .1);
}
.chip:active { transform: translateY(1px); box-shadow: none; }

/* Sterne */
.progress { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.stars { display: flex; gap: 6px; }
.star { width: 32px; height: 32px; }
.star path { fill: #f3ead9; stroke: var(--line); stroke-width: 2; stroke-linejoin: round; transition: fill .2s; }
.star.on path { fill: var(--gold); stroke: var(--gold-dark); }
.star.pop { animation: pop .45s ease-out; }
.progress-text { font-size: 0.85rem; color: var(--muted); text-align: right; line-height: 1.25; font-style: italic; }
.progress-text b { color: var(--ink); font-style: normal; font-variant-numeric: tabular-nums; }

/* Aufgabe */
.task { padding: 16px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.equation {
  font-family: var(--font-num); font-weight: 600; font-size: clamp(2.2rem, 11vw, 3.4rem);
  line-height: 1; display: flex; align-items: center; gap: .24em; font-variant-numeric: tabular-nums;
}
.answer {
  /* Innenabstand oben/unten nachgemessen, damit "?" und Ziffern in der Zahlenschrift optisch mittig sitzen */
  width: 2.3em; min-width: 0; margin: 0; padding: .08em .1em .16em; line-height: 1.1; text-align: center;
  font: inherit; color: var(--plum); background: #fff; caret-color: var(--plum);
  border: 2px dashed #b9a6c9; border-radius: 10px; outline: none; appearance: none;
}
.answer::placeholder { color: #d8cce3; opacity: 1; }
.answer:focus { border-style: solid; border-color: var(--plum); box-shadow: 0 0 0 4px var(--plum-soft); }
.answer:focus::placeholder { color: transparent; }
.answer.right { border-style: solid; border-color: var(--green); color: var(--green); background: var(--green-soft); box-shadow: none; }
.answer.wrong { animation: shake .4s; border-color: var(--rose); }
.keys-hint { display: none; margin: 0; font-size: 0.85rem; color: var(--muted); text-align: center; }
.keys-hint kbd {
  font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700; color: var(--ink); background: #fff;
  border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px;
}
@media (hover: hover) and (pointer: fine) { .keys-hint { display: block; } }
.feedback { min-height: 1.5em; font-weight: 800; font-size: 1.05rem; text-align: center; text-wrap: balance; }
.feedback.good { color: var(--green); }
.feedback.try { color: var(--rose); }

.tag {
  font-size: 0.72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--plum); border: 1px solid #d9c6ea; border-radius: 999px; padding: 1px 10px;
}

/* Hilfen: Zwanzigerfeld mit Fünferbündeln, Punktefeld fürs Einmaleins, Rechenweg ab 20 */
.hint { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; }
.hint .row { display: flex; gap: 12px; }
.hint .row.split { margin-bottom: 8px; }
.hint .group { display: flex; gap: 4px; }
.hint.small .dot { width: 14px; height: 14px; }
.hint.small .group { gap: 3px; }
.hint.small .row { gap: 9px; }
.steps { margin: 0; text-align: center; font-size: 1.05rem; text-wrap: balance; max-width: 34ch; }
.steps.caption { font-size: 0.9rem; color: var(--muted); }
.steps .nb { white-space: nowrap; font-family: var(--font-num); font-weight: 500; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink); }
.dot.a { background: #b77fd6; }
.dot.b { background: #8cc79f; }
.dot.gone { background: #fff; border-style: dashed; position: relative; }
.dot.gone::after {
  content: ""; position: absolute; left: -3px; right: -3px; top: 6.5px; height: 2px;
  background: var(--ink); transform: rotate(-45deg);
}

/* Ziffernfeld */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  height: 60px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--card);
  font-family: var(--font-num); font-weight: 600; font-size: 1.75rem; color: var(--ink);
  box-shadow: 0 3px 0 var(--line); touch-action: manipulation;
}
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.key.del { font-family: var(--font-ui); font-weight: 700; font-size: 1rem; color: var(--rose); }
.key.ok { font-family: var(--font-ui); font-weight: 800; font-size: 1.4rem; background: var(--plum); border-color: var(--plum-dark); color: #fff; box-shadow: 0 3px 0 var(--plum-dark); }

/* Zeichen über der Aufgabe: Knobelaufgabe, Übung. Feste Höhe, damit nichts springt */
.tags { display: flex; gap: 6px; min-height: 1.35rem; align-items: center; }
.tag.ueb { color: var(--green); border-color: #b5d9c0; }
.gold-hint { font-size: 0.78rem; color: var(--gold-dark); font-weight: 700; font-style: normal; }
.stars.many { flex-wrap: wrap; gap: 3px; max-width: 150px; }
.stars.many .star { width: 24px; height: 24px; }

/* Frustschutz: freundliches Angebot statt nächster Aufgabe */
.offer {
  width: 100%; display: grid; gap: 10px; justify-items: center; text-align: center;
  background: var(--plum-soft); border: 1.5px dashed #c9b2e0; border-radius: 10px; padding: 12px;
}
.offer p { margin: 0; font-weight: 700; text-wrap: balance; }
.offer-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }

/* Meistermarke als Einblendung */
.toast {
  position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 20;
  transform: translateX(-50%); width: min(380px, calc(100% - 32px));
  display: flex; gap: 12px; align-items: center; padding: 10px 14px;
  background: var(--card); border: 1.5px solid var(--gold-dark); border-radius: 12px;
  box-shadow: 0 0 0 3px var(--gold-soft), 4px 4px 0 rgba(59, 47, 69, .18);
  pointer-events: none;   /* nur Anzeige: Tippen geht durch, zum Beispiel auf „Schließen“ im Album */
}
.toast.in { animation: toastIn .45s ease-out; }
.toast svg { width: 58px; height: 68px; flex: none; }
.toast div { display: grid; line-height: 1.3; }
.toast b { font-family: var(--font-title); font-weight: 700; color: var(--plum); font-size: 1.05rem; }
.toast span { font-size: 0.85rem; color: var(--muted); }
@keyframes toastIn { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* Sammlung: Reiter Bilder / Meistermarken */
.tabs { display: flex; gap: 4px; padding: 3px; background: #efe6d6; border-radius: 10px; }
.tab { border: 0; background: none; border-radius: 8px; padding: 5px 14px; font-weight: 800; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--card); color: var(--plum); box-shadow: 1px 1px 0 rgba(59, 47, 69, .15); }
.panel { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.marks-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px 10px; }
.mark { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25; border: 0; background: none; padding: 4px 2px; border-radius: 10px; }
.mark:hover svg { transform: rotate(-2deg); }
.mark svg { width: 84px; height: 99px; margin-bottom: 4px; transform-origin: 10% 10%; transition: transform .2s; }
.mark.open b { color: var(--muted); font-weight: 600; }
.mark b { font-family: var(--font-title); font-weight: 700; color: var(--plum); font-size: 0.95rem; }
.mark span { font-size: 0.82rem; }
.mark small { font-size: 0.72rem; color: var(--muted); }

/* Eltern-Menü */
.parents-btn {
  position: relative; overflow: hidden; align-self: flex-start; color: var(--muted); padding: 3px 10px; border-radius: 8px; border: 0;
  background: rgba(255, 250, 240, .85); font-weight: 700; font-size: 0.95rem;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
/* Füllbalken beim Gedrückthalten (2 Sekunden) */
.parents-btn::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--plum); }
.parents-btn.holding::after { width: 100%; transition: width 2s linear; }
.parents-btn.holding { color: var(--plum-dark); }
.sheet.wide { max-width: 560px; align-items: stretch; text-align: left; gap: 8px; font-size: 0.95rem; }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 4px; }
.p-head .big-btn { padding: 7px 18px; font-size: 1rem; }
.pg { border-top: 1.5px solid #e6dccb; padding: 4px 0; }
.pg > summary {
  cursor: pointer; padding: 8px 2px; font-weight: 800; font-size: 1.05rem; color: var(--plum-dark);
  list-style-position: inside;
}
.pg[open] > summary { margin-bottom: 4px; }
.pg-in > summary { cursor: pointer; font-weight: 700; padding: 4px 0; color: var(--ink); }
.pg-in { border: 1.5px solid #e6dccb; border-radius: 10px; padding: 6px 10px; margin-bottom: 12px; background: #fff; }
.p-field { border: 0; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; min-width: 0; }
.p-field legend { font-weight: 800; padding: 0 0 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-block; padding: 4px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; }
.opt input:checked + span { border-color: var(--plum); background: var(--plum-soft); color: var(--plum-dark); font-weight: 800; }
.opt input:disabled + span { opacity: .55; cursor: default; }
.seg-sm .opt span { padding: 2px 9px; font-size: 0.85rem; }
/* Schalter */
.tog { display: flex; align-items: center; gap: 10px; position: relative; cursor: pointer; font-weight: 700; }
.tog input { position: absolute; opacity: 0; width: 44px; height: 26px; margin: 0; cursor: pointer; }
.tog span { display: flex; align-items: flex-start; gap: 10px; }
.tog span::before {
  content: ""; flex: none; width: 42px; height: 24px; border-radius: 999px;
  background: #ddd3c4 radial-gradient(circle at 12px 12px, #fff 8px, transparent 9px); transition: background-color .15s, background-position .15s;
}
.tog input:checked + span::before { background-color: var(--plum); background-position: 18px 0; }
.tog input:disabled + span { opacity: .55; }
/* Einmaleins-Reihen: normal, ★ öfter, aus */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchip {
  min-width: 52px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
  font-weight: 700; font-family: var(--font-num); font-size: 0.92rem;
}
.rchip[data-s="2"] { border-color: var(--gold-dark); background: #fdf1d6; color: #8a5f08; font-weight: 600; }
.rchip[data-s="0"] { color: #aaa0a6; background: #f4efe7; border-style: dashed; text-decoration: line-through; }
.sk-list { display: grid; gap: 2px; margin: 6px 0 8px; }
.sk-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; padding: 5px 0; border-bottom: 1px solid #f0e8da; }
.sk-name { display: grid; line-height: 1.25; font-weight: 700; font-size: 0.9rem; }
.sk-name small { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.rng-l { font-weight: 800; }
.p-field input[type="range"] { width: 100%; accent-color: var(--plum); margin: 0; }
.slider-scale { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); }
.p-text {
  font: inherit; width: 100%; max-width: 260px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink);
}
#pgAuto.off > :not(summary) { opacity: .55; }
/* Lernstand */
.ls-list { display: grid; margin: 8px 0; }
.ls-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n s" "d d"; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid #f0e8da; }
.ls-row.off { opacity: .45; }
.ls-name { grid-area: n; font-weight: 700; font-size: 0.9rem; }
.ls-name small { margin-left: 6px; font-weight: 700; color: var(--gold-dark); font-size: 0.78rem; }
.ls-dots { grid-area: d; display: flex; gap: 3px; align-items: center; min-height: 12px; }
.ls-dots small { color: var(--muted); font-size: 0.78rem; }
.ls-st { grid-area: s; font-size: 0.8rem; font-weight: 800; }
.st-neu { color: var(--muted); }
.st-uebend { color: #8a5f08; }
.st-sicher { color: var(--green); }
.st-wackelig { color: var(--rose); }
.ld { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
.ld.ok { background: var(--green); }
.ld.help { background: var(--gold); }
.ld.no { background: #fff; border: 1.5px solid var(--rose); }
.reset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.link-btn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); }
.link-btn.danger { color: var(--rose); font-weight: 800; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0; }
.version { font-size: 0.75rem; padding-top: 6px; }
.small-btn.primary { background: var(--plum); border-color: var(--plum-dark); color: #fff; box-shadow: 0 2px 0 var(--plum-dark); }
.steps-list { margin: 4px 0 8px; padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.92rem; }
/* Belohnung: Karte dreht sich auf, neue Wesen werden gefeiert */
.reward .pic { animation: reveal .8s ease-out; }
@keyframes reveal { 0% { transform: perspective(600px) rotateY(85deg) scale(.85); opacity: 0; } 60% { transform: perspective(600px) rotateY(-8deg) scale(1.03); opacity: 1; } 100% { transform: none; } }
.pic-new {
  font-weight: 800; color: #8a5f08; background: #fdf1d6; border: 1.5px solid var(--gold-dark); border-radius: 999px;
  padding: 2px 14px; animation: pop .6s .5s both;
}
.pic-world { font-size: 0.88rem; color: var(--muted); }
.worlds { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.wchip { font-size: 0.82rem; padding: 2px 10px; border-radius: 999px; background: #f1eadd; color: var(--ink); }
.wchip b { font-family: var(--font-num); font-weight: 600; }
.wchip.full { background: #fdf1d6; box-shadow: inset 0 0 0 1.5px var(--gold-dark); }
/* Gesellen- und Meisterbrief */
.sheet.cert {
  background: #fbf3df linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(201, 146, 30, .08));
  border: 3px double #b48a3c; max-width: 380px; animation: pop .5s ease-out;
}
.cert-kicker { font-size: 0.8rem; letter-spacing: .12em; text-transform: uppercase; color: #8a5f08; font-weight: 800; }
.sheet.cert h2 { font-size: 2rem; color: #6b3f12; }
.cert-emblem svg { width: 150px; height: 176px; }
.cert-text { font-family: var(--font-title); font-size: 1.08rem; line-height: 1.4; text-wrap: balance; }
.cert-foot { display: flex; align-items: center; gap: 14px; justify-content: center; }
.cert-sign { font-family: var(--font-title); font-style: italic; color: var(--muted); border-top: 1px solid #c9b48a; padding-top: 2px; }
.seal { width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d2554a, #8e1f1a 70%); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); position: relative; }
.seal::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; color: #f6c9b9; font-size: 1.1rem; }
/* Zunftzeichen im Detail */
.mark-big svg { width: 170px; height: 200px; }
.mv-fact { font-size: 0.98rem; text-wrap: balance; }
.mv-next { font-weight: 700; color: var(--plum-dark); background: var(--plum-soft); border-radius: 10px; padding: 8px 12px; }
#markView, #cert { z-index: 12; }
/* Lückenaufgaben: Zahl hinter dem Gleichheitszeichen */
.equation.gap #numC { color: var(--ink); }
/* Zahlenstrahl */
.numline { width: 100%; max-width: 340px; height: auto; overflow: visible; }
.nl-axis, .nl-tick { stroke: var(--ink); stroke-width: 1.6; }
.nl-tick { stroke-width: 1.2; }
.nl-head { fill: var(--ink); }
.nl-arc { fill: none; stroke: var(--plum); stroke-width: 2.2; }
.nl-tip { fill: var(--plum); }
.nl-stop { fill: var(--plum); }
.nl-num { font: 600 12px var(--font-num); fill: var(--ink); text-anchor: middle; }
.nl-num.soft { fill: var(--muted); font-weight: 500; font-size: 10.5px; }
.nl-jump { font: 700 12px var(--font-ui); fill: var(--plum-dark); text-anchor: middle; }
.nl-q { fill: var(--plum-soft); stroke: var(--plum); stroke-width: 1.4; }
.nl-qt { font: 800 13px var(--font-ui); fill: var(--plum-dark); text-anchor: middle; }
/* Werkstatt in der Detailansicht */
.mv-head { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; }
.mv-head .mark-big svg { width: 74px; height: 87px; }
.mv-head h2 { font-size: 1.3rem; }
.ws-pic { width: 100%; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--line); }
.ws-pic svg { display: block; width: 100%; height: auto; }
.ws-story { text-align: left; width: 100%; display: grid; gap: 6px; }
.ws-story p { margin: 0; }
.ws-title { font-family: var(--font-title); font-weight: 700; color: var(--plum-dark); font-size: 1.05rem; }
.ws-more summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.ws-more p { margin: 6px 0 0; font-size: 0.92rem; }
.ws-next { font-size: 0.9rem; color: var(--muted); font-style: italic; }
.cert-ws { font-size: 0.92rem; color: #8a5f08; font-weight: 700; text-wrap: balance; }
.cert-ws:empty { display: none; }

/* Overlays */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(43, 33, 52, .62); overflow-y: auto;
}
.sheet {
  width: 100%; max-width: 420px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  align-items: center; text-align: center; margin: auto; box-shadow: 5px 5px 0 rgba(20, 14, 26, .25);
}
.reward .sheet { animation: pop .5s ease-out; }
.sheet h2 { font-family: var(--font-title); font-weight: 700; font-size: 1.55rem; line-height: 1.15; margin: 0; color: var(--plum); text-wrap: balance; }
.sheet p { margin: 0; }
.pic {
  display: block; width: 100%; max-width: 340px; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
  border: 2px solid var(--ink); background: var(--night);
}
.pic svg { display: block; width: 100%; height: 100%; }
.pic.rare { border-color: var(--gold-dark); box-shadow: 0 0 0 3px var(--gold-soft), 0 0 24px var(--gold-soft); }
.pic-name { font-family: var(--font-title); font-weight: 500; font-size: 1.25rem; }
.pic-no { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.big-btn {
  border: 1.5px solid var(--plum-dark); border-radius: 11px; background: var(--plum); color: #fff;
  font-weight: 800; font-size: 1.1rem; padding: 11px 22px; box-shadow: 0 3px 0 var(--plum-dark);
}
.big-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--plum-dark); }
.big-btn.mint { background: var(--plum); }
.album-grid { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 12px; }
.album-item {
  display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0; border: 0; background: none;
  text-align: left; border-radius: 10px;
}
.album-item .pic { max-width: none; border-width: 1.5px; margin-bottom: 4px; }
.album-item:hover .pic { transform: translateY(-2px); }
.album-name { font-family: var(--font-title); font-size: 0.92rem; font-weight: 500; line-height: 1.25; }
.album-no { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#viewer { z-index: 11; }

/* Spielstand */
.save-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.small-btn {
  background: #fff; border: 1.5px solid var(--line); border-radius: 9px; padding: 5px 12px;
  font-weight: 800; font-size: 0.9rem;
}
.code-box { display: grid; gap: 8px; width: 100%; }
.code-box textarea {
  width: 100%; min-width: 0; font: 0.8rem/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 9px; padding: 8px; resize: vertical;
  word-break: break-all;
}
.code-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.settings fieldset > .note, .save-actions { width: 100%; }
.version { font-size: 0.75rem; }

@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Teilen mit Bildern */
.pictask { width: 100%; display: grid; gap: 6px; justify-items: center; }
.pt-q { margin: 0; font-weight: 700; text-align: center; text-wrap: balance; max-width: 36ch; }
.pt-art { width: 100%; }
.pt-svg { display: block; width: 100%; max-width: 380px; height: auto; margin: 0 auto; overflow: visible; }
.pt-it { transform-box: fill-box; transform-origin: center; transition: transform .45s cubic-bezier(.3, .8, .4, 1); }
.pt-plate { fill: #fff; stroke: #b9a98e; stroke-width: 1.5; }
.pt-plate-in { fill: none; stroke: #e2d8c6; stroke-width: 1; }
.pt-box { opacity: 0; transition: opacity .35s; }
.pt-box.on { opacity: 1; }
.pt-basket { fill: #c99a55; stroke: #7a5426; stroke-width: 1.5; }
.pt-weave { stroke: #8a6230; stroke-width: 1; fill: none; }
.pt-count { font: 700 13px var(--font-num); fill: var(--plum-dark); text-anchor: middle; }
.div-note { margin: -2px 0 0; font-size: 0.85rem; color: var(--muted); }

/* Goldbilder (ab 1.8): Legende mit Strahlenkranz, Aufblitzen, fliegenden Sternchen, Glitzern und Lichtstreif */
.reward.gold .sheet { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fffaf0 0, #fdf1d6 45%, #f3d58c 100%); border-color: var(--gold-dark); }
.reward.gold .sheet::before {
  content: ""; position: absolute; left: 50%; top: 40%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; pointer-events: none;
  background: repeating-conic-gradient(rgba(255, 205, 70, .32) 0deg 7deg, rgba(255, 205, 70, 0) 7deg 18deg); animation: spin 30s linear infinite;
}
.reward.gold .sheet > :not(.gspark) { position: relative; }
.reward.gold h2 { color: #8a5f08; }
@keyframes spin { to { transform: rotate(1turn); } }
.reward .pic.legend { animation: goldIn 1.8s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes goldIn {
  0% { transform: perspective(700px) rotateY(540deg) scale(.3); filter: brightness(3) saturate(0); opacity: 0; }
  40% { opacity: 1; filter: brightness(2.2) saturate(.4); }
  75% { transform: perspective(700px) rotateY(0) scale(1.07); filter: brightness(1.15); }
  100% { transform: none; filter: none; }
}
.gspark {
  position: absolute; left: 50%; top: 40%; width: 16px; height: 16px; background: #ffd24a; pointer-events: none;
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: gfly 1.5s ease-out both;
}
.gspark:nth-child(odd) { background: #fff3b0; width: 11px; height: 11px; }
@keyframes gfly { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(90deg); opacity: 0; } }
.pic svg .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
.pic svg .tw1 { animation-delay: .8s; }
.pic svg .tw2 { animation-delay: 1.6s; }

@keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes foil { 0% { transform: translateX(0); } 45%, 100% { transform: translateX(480px); } }
.album-item .pic svg .tw { animation: none; }

  .gspark { display: none; }
}

<script>
(() => {
  // ---------- Bilder: jedes Belohnungsbild wird aus Zufallszutaten neu komponiert ----------
  // Eine Karte ist { s: Zufallssamen, n: Landschaft, c: Wesen, g: 1 = selten (golden) }.
  // Aus dem Samen entstehen Gebirge, Sterne, Mond, Pose, Blickrichtung und Farbton: jedes Bild ist ein Unikat.
  const SCENES = [
    { id: "nordlicht", world: "fabel", name: "Nordlicht", sky: [[228, 60, 9], [214, 55, 17], [192, 45, 30]], fg: [222, 45, 6], accent: [160, 85, 68], ground: 258 },
    { id: "mondsee", world: "fabel", name: "Mondsee", sky: [[248, 50, 10], [258, 42, 22], [282, 38, 40]], fg: [252, 42, 7], accent: [48, 90, 80], ground: 272 },
    { id: "morgenrot", world: "fabel", name: "Morgenrot", sky: [[228, 50, 24], [330, 50, 58], [32, 92, 68]], fg: [282, 35, 12], accent: [42, 100, 72], ground: 258 },
    { id: "sternennebel", world: "fabel", name: "Sternennebel", sky: [[262, 55, 5], [248, 45, 11], [222, 42, 20]], fg: [250, 40, 4], accent: [292, 90, 76], ground: 262 },
    { id: "gluehwald", world: "fabel", name: "Glühwald", sky: [[205, 45, 18], [186, 38, 34], [40, 70, 62]], fg: [165, 40, 6], accent: [55, 100, 68], ground: 264 },
    { id: "wolkenmeer", world: "fabel", name: "Wolkenmeer", sky: [[218, 55, 34], [292, 40, 62], [24, 92, 72]], fg: [252, 30, 14], accent: [36, 100, 74], ground: 236 },
    // Wald
    { id: "herbstwald", world: "wald", name: "Herbstwald", at: "im Herbstwald", sky: [[30, 70, 64], [24, 80, 72], [44, 95, 80]], fg: [18, 45, 12], accent: [28, 100, 60], ground: 262, night: false },
    { id: "mondlichtung", world: "wald", name: "Mondlichtung", at: "auf der Mondlichtung", sky: [[232, 55, 10], [222, 45, 20], [200, 40, 34]], fg: [215, 40, 6], accent: [70, 100, 70], ground: 262, night: true, stars: 60 },
    { id: "nebelwald", world: "wald", name: "Nebelwald", at: "im Nebelwald", sky: [[200, 22, 50], [185, 22, 66], [165, 25, 80]], fg: [190, 25, 13], accent: [55, 90, 75], ground: 262, night: false },
    { id: "birkenhain", world: "wald", name: "Birkenhain", at: "im Birkenhain", sky: [[205, 60, 72], [30, 80, 80], [45, 95, 84]], fg: [100, 25, 16], accent: [45, 100, 62], ground: 264, night: false },
    // Meer
    { id: "korallenriff", world: "meer", name: "Korallenriff", at: "am Korallenriff", sky: [[185, 75, 62], [192, 70, 42], [205, 70, 24]], fg: [210, 60, 12], accent: [170, 90, 70], ground: 250, night: false },
    { id: "tiefsee", world: "meer", name: "Tiefsee", at: "in der Tiefsee", sky: [[215, 65, 26], [225, 65, 13], [235, 70, 6]], fg: [235, 60, 4], accent: [180, 100, 62], ground: 250, night: false },
    { id: "seetangwald", world: "meer", name: "Seetangwald", at: "im Seetangwald", sky: [[165, 45, 52], [178, 50, 34], [195, 60, 17]], fg: [190, 55, 8], accent: [60, 95, 68], ground: 250, night: false },
    // Burg
    { id: "abendburg", world: "burg", name: "Abendrot", at: "bei der Burg im Abendrot", sky: [[255, 45, 30], [340, 55, 60], [28, 95, 66]], fg: [270, 35, 12], accent: [42, 100, 70], ground: 258, night: false },
    { id: "vollmondburg", world: "burg", name: "Vollmondnacht", at: "in der Vollmondnacht", sky: [[230, 55, 8], [235, 45, 18], [250, 35, 34]], fg: [240, 40, 5], accent: [48, 95, 72], ground: 258, night: true, stars: 70, bigMoon: true },
    { id: "winterburg", world: "burg", name: "Winterburg", at: "auf der Winterburg", sky: [[210, 40, 60], [215, 45, 74], [220, 50, 87]], fg: [220, 35, 18], accent: [195, 90, 70], ground: 258, night: false },
  ];
  const CREATURES = [
    { id: "unicorn", world: "fabel", noun: "Einhorn", golden: "Goldenes", weight: 1 },
    { id: "pegasus", world: "fabel", noun: "Pegasus", golden: "Goldener", weight: 0.8 },
    { id: "fairy", world: "fabel", noun: "Fee", golden: "Goldene", weight: 1 },
    { id: "phoenix", world: "fabel", noun: "Phönix", golden: "Goldener", weight: 0.8 },
    { id: "fox", world: "wald", noun: "Fuchs", golden: "Goldener", weight: 1 },
    { id: "deer", world: "wald", noun: "Hirsch", golden: "Goldener", weight: 1 },
    { id: "owl", world: "wald", noun: "Eule", golden: "Goldene", weight: 1 },
    { id: "hare", world: "wald", noun: "Hase", golden: "Goldener", weight: 1 },
    { id: "whale", world: "meer", noun: "Wal", golden: "Goldener", weight: 1 },
    { id: "turtle", world: "meer", noun: "Schildkröte", golden: "Goldene", weight: 1 },
    { id: "seahorse", world: "meer", noun: "Seepferdchen", golden: "Goldenes", weight: 1 },
    { id: "mermaid", world: "meer", noun: "Meerjungfrau", golden: "Goldene", weight: 1 },
    { id: "princess", world: "burg", noun: "Prinzessin", golden: "Goldene", weight: 1 },
    { id: "knight", world: "burg", noun: "Ritter", golden: "Goldener", weight: 1 },
    { id: "dragon", world: "burg", noun: "Drache", golden: "Goldener", weight: 1 },
    // Legenden (ab 1.8): nur als Goldbild, nur mit der neuen Zeichnung
    { id: "weisshirsch", world: "wald", noun: "Weißer Hirsch", legend: true, weight: 0 },
    { id: "sternenwal", world: "meer", noun: "Sternenwal", legend: true, weight: 0 },
    { id: "regenbogeneinhorn", world: "fabel", noun: "Regenbogen-Einhorn", legend: true, weight: 0 },
    { id: "golddrache", world: "burg", noun: "Goldener Drache", legend: true, weight: 0 },
  ];
  const OLD_CREATURES = 15;   // so viele Wesen kennt die erste Zeichnung
  const WORLDS = [{ id: "fabel", name: "Fabelwelt", what: "Fabelwesen" }, { id: "wald", name: "Wald", what: "Waldtieren" }, { id: "meer", name: "Meer", what: "Meeresbewohnern" }, { id: "burg", name: "Burg", what: "Burgbewohnern" }];
  const GOLD = [44, 100, 64];

  const f1 = (n) => Math.round(n * 10) / 10;
  const col = ([h, s, l], a) => (a === undefined ? `hsl(${f1(h)},${f1(s)}%,${f1(l)}%)` : `hsla(${f1(h)},${f1(s)}%,${f1(l)}%,${f1(a * 100) / 100})`);
  const mixC = (a, b, t) => {
    const dh = ((b[0] - a[0] + 540) % 360) - 180;
    return [(a[0] + dh * t + 360) % 360, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  };
  const starPath = (x, y, r) => {
    const [X, Y] = [f1(x), f1(y)];
    return `M${X} ${f1(y - r)}Q${X} ${Y} ${f1(x + r)} ${Y}Q${X} ${Y} ${X} ${f1(y + r)}Q${X} ${Y} ${f1(x - r)} ${Y}Q${X} ${Y} ${X} ${f1(y - r)}Z`;
  };
  function mulberry32(a) {
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Karten mit v: 2 (ab 1.8) nutzen die Landschaften der zweiten Generation
  const sceneOf = (k) => (k.v === 2 ? PIC2.SC[k.n] || PIC2.SC[0] : SCENES[k.n] || SCENES[0]);

  // Gold gibt es planbar (Eltern-Menü), nicht zufällig, und zeigt eine Legende: zuerst die noch nicht entdeckten.
  // Sonst nie dieselbe Welt zweimal hintereinander, kein Wesen der letzten zwei und keine Landschaft der letzten drei Bilder.
  // Noch nicht entdeckte Wesen kommen dreimal so oft dran.
  function newCard(prev, gold, recent, album) {
    const rec = recent || (prev ? [prev] : []), seen = new Set((album || rec).map((k) => k.c));
    const s = Math.floor(Math.random() * 4294967296);
    if (gold) {
      const legends = CREATURES.map((_, i) => i).filter((i) => CREATURES[i].legend), fresh = legends.filter((i) => !seen.has(i));
      const lastLeg = [...(album || rec)].reverse().find((k) => CREATURES[k.c] && CREATURES[k.c].legend);
      const pool = fresh.length ? fresh : legends.filter((i) => !lastLeg || i !== lastLeg.c);
      const c = pool[Math.floor(Math.random() * pool.length)];
      return { s, n: PIC2.sceneFor(CREATURES[c].world, true, CREATURES[c].id), c, g: 1, v: 2 };
    }
    const last = rec[rec.length - 1], lastW = last ? sceneOf(last).world : null;
    const noC = rec.slice(-2).map((k) => k.c), noN = rec.slice(-3).filter((k) => k.v === 2).map((k) => k.n);
    const all = CREATURES.map((_, i) => i).filter((i) => !CREATURES[i].legend);
    let cands = all.filter((i) => CREATURES[i].world !== lastW && !noC.includes(i));
    if (!cands.length) cands = all.filter((i) => !noC.includes(i));
    const wt = (i) => (seen.has(i) ? 1 : 3) * CREATURES[i].weight;
    let r = Math.random() * cands.reduce((a, i) => a + wt(i), 0), c = cands[cands.length - 1];
    for (const i of cands) { r -= wt(i); if (r < 0) { c = i; break; } }
    return { s, n: PIC2.sceneFor(CREATURES[c].world, false, null, noN, Math.random), c, g: 0, v: 2 };
  }

  function cardName(card) {
    const sc = sceneOf(card), cr = CREATURES[card.c] || CREATURES[0];
    if (card.v === 2) return `${cr.legend ? "Legende: " : ""}${cr.noun} ${sc.at}`;
    if (sc.world !== "fabel") return `${card.g ? cr.golden + " " : ""}${cr.noun} ${sc.at}`;
    return `${card.g ? cr.golden + " " : ""}${sc.name}-${cr.noun}`;
  }

  function cardSVG(card, uid) {
    if (card.v === 2) return PIC2.draw(card, CREATURES[card.c] || CREATURES[0], uid);
    const rng = mulberry32(card.s);
    const R = (a, b) => a + rng() * (b - a);
    const sc = SCENES[card.n] || SCENES[0], cr = CREATURES[card.c] || CREATURES[0];
    const hs = R(-12, 12);
    const tint = (c) => [(c[0] + hs + 360) % 360, c[1], c[2]];
    const sky = sc.sky.map(tint), fg = tint(sc.fg), acc = card.g ? GOLD : tint(sc.accent), hz = sky[2];
    const F = col(fg);
    // Luftperspektive: ferne Ebenen nehmen die Himmelsfarbe an, aber nie grell
    const haze = sc.id === "gluehwald" ? sky[1] : mixC(sky[1], sky[2], 0.5);
    const layer = (t) => { const c = mixC(haze, fg, t); c[1] = Math.min(c[1], 42); return col(c); };
    const night = sc.night !== undefined ? sc.night : sc.id !== "morgenrot" && sc.id !== "wolkenmeer";
    const onLeft = rng() < 0.5;
    const cx = onLeft ? R(88, 118) : R(182, 212);
    const ox = onLeft ? R(195, 250) : R(50, 105);
    const gy = sc.ground + R(-4, 4);
    const id = (k) => uid + k;
    const defs = [], o = [];
    let moon = null; // Mond für die Spiegelung im See

    defs.push(
      `<linearGradient id="${id("sky")}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col(sky[0])}"/><stop offset=".55" stop-color="${col(sky[1])}"/><stop offset="1" stop-color="${col(sky[2])}"/></linearGradient>`,
      `<radialGradient id="${id("glow")}"><stop offset="0" stop-color="${col(acc)}" stop-opacity=".95"/><stop offset=".35" stop-color="${col(acc)}" stop-opacity=".35"/><stop offset="1" stop-color="${col(acc)}" stop-opacity="0"/></radialGradient>`,
      `<radialGradient id="${id("halo")}"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`,
      `<filter id="${id("soft")}" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>`,
      `<filter id="${id("haze")}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>`,
      `<radialGradient id="${id("vig")}" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>`,
      `<linearGradient id="${id("horn")}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${col(acc)}"/><stop offset="1" stop-color="#fff"/></linearGradient>`,
    );
    o.push(`<rect width="300" height="300" fill="url(#${id("sky")})"/>`);

    // Sternennebel: Nebelwolken und Milchstraße
    if (sc.id === "sternennebel") {
      const hues = [acc, tint([200, 80, 55]), tint([330, 70, 55])];
      let neb = "";
      for (let i = 0; i < 6; i++) {
        const c = hues[i % 3];
        neb += `<ellipse cx="${f1(R(20, 280))}" cy="${f1(R(30, 180))}" rx="${f1(R(40, 90))}" ry="${f1(R(20, 45))}" transform="rotate(${f1(R(-40, 40))})" fill="${col(c, R(0.22, 0.4))}"/>`;
      }
      o.push(`<g filter="url(#${id("haze")})">${neb}</g>`);
      const y0 = R(40, 140), y1 = R(40, 140), sp = R(16, 26);
      let band = "";
      for (let i = 0; i < 160; i++) {
        const x = R(-5, 305), t = x / 300, off = (rng() + rng() + rng() - 1.5) * sp;
        band += `<circle cx="${f1(x)}" cy="${f1(y0 + (y1 - y0) * t + off)}" r="${f1(R(0.25, 0.8))}" fill="#fff" opacity="${f1(R(0.3, 0.9))}"/>`;
      }
      // als Fläche, damit der Weichzeichner auch bei einem waagerechten Band genug Platz hat
      o.push(`<path d="M-10 ${f1(y0 - sp)}L310 ${f1(y1 - sp)}L310 ${f1(y1 + sp)}L-10 ${f1(y0 + sp)}Z" fill="#fff" opacity=".1" filter="url(#${id("soft")})"/>`, band);
    }

    // Sterne
    const STARS = { nordlicht: 80, mondsee: 65, morgenrot: 14, sternennebel: 110, gluehwald: 30, wolkenmeer: 6 };
    const yMax = { morgenrot: 80, wolkenmeer: 60, gluehwald: 150 }[sc.id] || 200;
    const dim = sc.id === "morgenrot" || sc.id === "wolkenmeer" ? 0.5 : 1;
    let st = "";
    for (let i = 0; i < (STARS[sc.id] ?? sc.stars ?? 0); i++) {
      st += `<circle cx="${f1(R(0, 300))}" cy="${f1(yMax * Math.pow(rng(), 1.4))}" r="${f1(R(0.3, 1.3))}" fill="#fff" opacity="${f1(R(0.3, 1) * dim)}"/>`;
    }
    if (sc.world !== "meer") for (let i = 0; i < (night ? 4 : 1); i++) st += `<path d="${starPath(R(10, 290), R(10, yMax * 0.8), R(2.5, 4.5))}" fill="#fff" opacity="${f1(0.85 * dim)}"/>`;
    o.push(st);

    // Sternschnuppe
    if (night && rng() < 0.45) {
      const x0 = R(30, 230), y0 = R(15, 70), len = R(45, 80), a = (R(15, 35) * Math.PI) / 180;
      const x1 = x0 + Math.cos(a) * len * (onLeft ? -1 : 1), y1 = y0 + Math.sin(a) * len;
      defs.push(`<linearGradient id="${id("shoot")}" gradientUnits="userSpaceOnUse" x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x0)}" y2="${f1(y0)}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`);
      o.push(`<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}" stroke="url(#${id("shoot")})" stroke-width="1.6" stroke-linecap="round"/>`);
    }

    // Polarlicht
    if (sc.id === "nordlicht") {
      const cols = [tint([150, 90, 58]), tint([180, 85, 60]), tint([285, 70, 66])];
      let au = "";
      for (let k = 0; k < 3; k++) {
        const base = R(75, 135), amp = R(10, 26), fr = R(0.012, 0.024), ph = R(0, 6.3), h = R(45, 85);
        const bottom = [], top = [];
        for (let x = -20; x <= 320; x += 10) {
          const yb = base + amp * Math.sin(x * fr + ph) + 7 * Math.sin(x * fr * 2.7 + ph * 1.3);
          bottom.push(`${x} ${f1(yb)}`);
          top.unshift(`${x} ${f1(yb - h * (0.55 + 0.45 * Math.sin(x * fr * 0.6 + ph * 2)))}`);
        }
        const c1 = cols[k % 2], c2 = cols[2];
        defs.push(`<linearGradient id="${id("au" + k)}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${col(c1)}" stop-opacity=".85"/><stop offset=".45" stop-color="${col(c1)}" stop-opacity=".35"/><stop offset="1" stop-color="${col(c2)}" stop-opacity="0"/></linearGradient>`);
        au += `<path d="M${bottom.join("L")}L${top.join("L")}Z" fill="url(#${id("au" + k)})"/>`;
      }
      o.push(`<g filter="url(#${id("soft")})" opacity=".9">${au}</g>`);
    }

    // Mond oder Sonne
    if (night && (sc.id === "mondsee" || sc.bigMoon || rng() < 0.75)) {
      const big = sc.id === "mondsee" || !!sc.bigMoon;
      const my = big ? R(55, 95) : R(40, 85), mr = big ? R(24, 34) : R(10, 19);
      const mc = [48, 70, 90];
      o.push(`<circle cx="${f1(ox)}" cy="${f1(my)}" r="${f1(mr * 4)}" fill="url(#${id("halo")})"/>`);
      if (rng() < 0.5) {
        const off = mr * R(0.35, 0.6);
        defs.push(`<mask id="${id("moon")}" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300"><circle cx="${f1(ox)}" cy="${f1(my)}" r="${f1(mr)}" fill="#fff"/><circle cx="${f1(ox + (onLeft ? -off : off))}" cy="${f1(my - off * 0.5)}" r="${f1(mr * 0.92)}" fill="#000"/></mask>`);
        o.push(`<circle cx="${f1(ox)}" cy="${f1(my)}" r="${f1(mr)}" fill="${col(mc)}" mask="url(#${id("moon")})"/>`);
      } else {
        let cr8 = "";
        for (let i = 0; i < 4; i++) cr8 += `<circle cx="${f1(ox + R(-0.5, 0.5) * mr)}" cy="${f1(my + R(-0.5, 0.5) * mr)}" r="${f1(R(0.1, 0.22) * mr)}" fill="${col([45, 30, 70])}" opacity=".25"/>`;
        o.push(`<circle cx="${f1(ox)}" cy="${f1(my)}" r="${f1(mr)}" fill="${col(mc)}"/>${cr8}`);
      }
      moon = [ox, mr];
    }
    if (!night && sc.world !== "meer") {
      const sy = sc.id === "wolkenmeer" ? R(165, 185) : R(150, 172), sr = sc.id === "wolkenmeer" ? R(30, 40) : R(20, 30);
      o.push(`<circle cx="${f1(ox)}" cy="${f1(sy)}" r="${f1(sr * 5)}" fill="url(#${id("halo")})"/>`,
        `<circle cx="${f1(ox)}" cy="${f1(sy)}" r="${f1(sr)}" fill="${col([45, 100, 88])}"/>`);
    }

    // Gebirgsketten: Mittelpunkt-Verschiebung, hinten heller (Luftperspektive)
    const ridge = (y0, amp, rough, color, iters = 5) => {
      let pts = [[-10, y0 + R(-amp, amp) * 0.5], [310, y0 + R(-amp, amp) * 0.5]], d = amp;
      for (let it = 0; it < iters; it++) {
        const next = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          next.push(a, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + R(-d, d)]);
        }
        next.push(pts[pts.length - 1]);
        pts = next; d *= rough;
      }
      return `<path d="M-10 300L${pts.map((p) => `${f1(p[0])} ${f1(Math.min(p[1], 300))}`).join("L")}L310 300Z" fill="${color}"/>`;
    };
    const pine = (x, base, h, color) => {
      const w = h * 0.42;
      const p = [[0, -h], [0.34, -0.62], [0.17, -0.62], [0.5, -0.28], [0.26, -0.28], [0.62, 0], [-0.62, 0], [-0.26, -0.28], [-0.5, -0.28], [-0.17, -0.62], [-0.34, -0.62]]
        .map(([px, py], i) => (i === 0 ? `${f1(x)} ${f1(base - h)}` : `${f1(x + px * w * 1.6)} ${f1(base + py * h)}`));
      return `<path d="M${p.join("L")}Z" fill="${color}"/>`;
    };
    const forest = (base, hMin, hMax, color) => {
      let s = "", x = R(-10, 0);
      while (x < 310) { s += pine(x, base + R(0, 6), R(hMin, hMax), color); x += R(6, 14); }
      return s + `<rect x="-10" y="${f1(base + 3)}" width="320" height="${f1(Math.max(0, 300 - base))}" fill="${color}"/>`;
    };
    const mist = (y) => `<ellipse cx="${f1(R(60, 240))}" cy="${f1(y)}" rx="${f1(R(120, 180))}" ry="${f1(R(8, 14))}" fill="#fff" opacity=".18" filter="url(#${id("soft")})"/>`;
    const clouds = (y, rMin, rMax, color) => {
      let s = "", x = R(-20, 0);
      while (x < 320) { const r = R(rMin, rMax); s += `<circle cx="${f1(x)}" cy="${f1(y + R(-6, 6))}" r="${f1(r)}"/>`; x += r * R(0.9, 1.4); }
      return `<g fill="${color}">${s}<rect x="-10" y="${f1(y)}" width="320" height="${f1(Math.max(0, 300 - y))}"/></g>`;
    };

    const glowDot = (x, y, r, a = 1) =>
      `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="url(#${id("glow")})" opacity="${f1(a)}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(Math.max(0.6, r * 0.14))}" fill="#fff" opacity="${f1(a)}"/>`;

    // ---------- Neue Welten: Wald, Meer, Burg ----------
    if (sc.world !== "fabel") {
      const light = mixC(acc, [0, 0, 100], 0.55), pk = (a) => a[Math.floor(rng() * a.length)];
      const dir = rng() < 0.5 ? 1 : -1;
      const place = (x, y, s, inner, flip = dir) => `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(flip * s * 100) / 100} ${f1(s * 100) / 100})">${inner}</g>`;
      const hill = (fill) => {
        const l = gy + R(18, 44), r = gy + R(18, 44);
        return `<path d="M-10 300L-10 ${f1(l)}Q${f1(cx - 70)} ${f1(gy - 3)} ${f1(cx)} ${f1(gy)}Q${f1(cx + 70)} ${f1(gy + 3)} 310 ${f1(r)}L310 300Z" fill="${fill}"/>`;
      };
      const tuft = (x, y, h, c) => `<path d="M${f1(x - 4)} ${f1(y)}L${f1(x - 6)} ${f1(y - h * 0.7)}L${f1(x - 1)} ${f1(y - 2)}L${f1(x)} ${f1(y - h)}L${f1(x + 1.5)} ${f1(y - 2)}L${f1(x + 6)} ${f1(y - h * 0.8)}L${f1(x + 4)} ${f1(y)}Z" fill="${c}"/>`;
      // Laubbaum: Stamm und runde Krone aus Kreisen
      const leafTree = (x, base, h, c) => {
        const r = h * 0.3;
        let s = `<path d="M${f1(x - h * 0.035)} ${f1(base)}L${f1(x - h * 0.02)} ${f1(base - h * 0.62)}L${f1(x + h * 0.02)} ${f1(base - h * 0.62)}L${f1(x + h * 0.035)} ${f1(base)}Z" fill="${c}"/>`;
        for (let i = 0; i < 6; i++) s += `<circle cx="${f1(x + R(-0.9, 0.9) * r)}" cy="${f1(base - h * 0.68 + R(-0.6, 0.5) * r)}" r="${f1(r * R(0.55, 0.85))}" fill="${c}"/>`;
        return s;
      };

      if (sc.world === "wald") {
        if (sc.id === "birkenhain") {
          o.push(ridge(200, 20, 0.5, layer(0.3)));
          let birches = "";
          for (let i = 0; i < 9; i++) {
            const x = R(-10, 310), w = R(4, 9), far = rng() < 0.5;
            if (Math.abs(x - cx) < 40) continue;
            const c1 = far ? col(mixC(hz, [40, 30, 95], 0.6)) : col([40, 25, 93]), mark = far ? layer(0.45) : F;
            let marks = "";
            for (let y = R(20, 40); y < 280; y += R(14, 26)) marks += `<rect x="${f1(x - w / 2)}" y="${f1(y)}" width="${f1(w * R(0.4, 0.8))}" height="${f1(R(1.5, 3.2))}" fill="${mark}"/>`;
            birches += `<rect x="${f1(x - w / 2)}" y="-5" width="${f1(w)}" height="310" fill="${c1}" opacity="${far ? 0.75 : 1}"/>${marks}`;
          }
          o.push(birches, mist(230));
          let leaves = "";
          for (let i = 0; i < 26; i++) leaves += `<circle cx="${f1(R(0, 300))}" cy="${f1(R(-5, 40))}" r="${f1(R(8, 18))}" fill="${layer(R(0.5, 0.85))}"/>`;
          o.push(leaves);
        } else if (sc.id === "mondlichtung") {
          o.push(forest(212, 40, 70, layer(0.5)), mist(226), forest(234, 26, 46, layer(0.75)));
        } else if (sc.id === "nebelwald") {
          o.push(forest(176, 50, 80, layer(0.2)), mist(196), forest(200, 50, 86, layer(0.42)), mist(222), forest(228, 40, 70, layer(0.65)), mist(244));
          // Lichtstrahlen durch den Nebel
          let rays = "";
          for (let i = 0; i < 5; i++) { const x = R(20, 280), w = R(10, 26); rays += `<path d="M${f1(x)} -10L${f1(x + w)} -10L${f1(x + w + 80)} 300L${f1(x + 50)} 300Z" fill="#fff" opacity="${f1(R(0.05, 0.11))}"/>`; }
          o.push(`<g filter="url(#${id("soft")})">${rays}</g>`);
        } else {
          // Herbstwald: Laubbäume in Schichten, Sonnenstrahlen
          let back = "", mid = "";
          for (let x = R(-20, 0); x < 320; x += R(26, 44)) back += leafTree(x, 214 + R(-6, 6), R(70, 110), layer(0.35));
          for (let x = R(-20, 0); x < 320; x += R(40, 70)) if (Math.abs(x - cx) > 50) mid += leafTree(x, 240 + R(-6, 6), R(90, 140), layer(0.62));
          o.push(back, mist(222), mid);
          let rays = "";
          for (let i = 0; i < 4; i++) { const x = R(0, 240); rays += `<path d="M${f1(x)} -10L${f1(x + 20)} -10L${f1(x + 110)} 300L${f1(x + 70)} 300Z" fill="${col(acc)}" opacity="${f1(R(0.06, 0.12))}"/>`; }
          o.push(`<g filter="url(#${id("soft")})">${rays}</g>`);
        }
        o.push(hill(F));
        let near = "";
        for (let i = 0; i < 4; i++) { const x = R(0, 300); if (Math.abs(x - cx) > 80) near += sc.id === "herbstwald" || sc.id === "birkenhain" ? leafTree(x, gy + 30, R(80, 120), F) : pine(x, gy + 24, R(40, 70), F); }
        for (let i = 0; i < 14; i++) near += tuft(R(0, 300), gy + R(8, 40), R(5, 11), F);
        // Pilze am Boden
        for (let i = 0; i < 3; i++) { const x = cx + (rng() < 0.5 ? -1 : 1) * R(50, 110), y = gy + R(10, 24), h = R(6, 10); near += `<rect x="${f1(x - 1.5)}" y="${f1(y - h)}" width="3" height="${f1(h)}" fill="${F}"/><path d="M${f1(x - h * 0.8)} ${f1(y - h)}Q${f1(x)} ${f1(y - h * 2)} ${f1(x + h * 0.8)} ${f1(y - h)}Z" fill="${F}"/>`; }
        o.push(near);

        if (cr.id === "owl") {
          const by = R(150, 172), side = onLeft ? -1 : 1;
          o.push(place(cx, by, R(1.25, 1.45), owl(F, acc, id, light), side));
        } else if (cr.id === "deer") {
          o.push(place(cx, gy, R(0.82, 0.92), deer(R, F, acc, id)));
        } else if (cr.id === "hare") {
          o.push(place(cx, gy, R(1.25, 1.45), hare(R, F, light)));
        } else {
          o.push(place(cx, gy, R(1.15, 1.32), fox(R, F, light)));
        }
        // Glühwürmchen oder fallende Blätter
        let fx = "";
        if (night) for (let i = 0; i < 16; i++) fx += glowDot(R(5, 295), R(140, 285), R(2.5, 6), R(0.5, 1));
        else if (sc.id === "herbstwald") {
          const hues = [[20, 85, 55], [35, 95, 58], [8, 70, 48], [48, 90, 60]];
          for (let i = 0; i < 18; i++) { const x = R(0, 300), y = R(0, 280); fx += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(R(2.5, 4.5))}" ry="${f1(R(1.2, 2))}" transform="rotate(${f1(R(0, 180))} ${f1(x)} ${f1(y)})" fill="${col(pk(hues))}" opacity="${f1(R(0.7, 1))}"/>`; }
        } else for (let i = 0; i < 8; i++) fx += glowDot(R(5, 295), R(60, 260), R(2, 4), R(0.3, 0.7));
        o.push(fx);
      }

      if (sc.world === "meer") {
        // Lichtfächer von der Wasseroberfläche, Wellenkante oben
        let rays = "";
        const sx = R(80, 220);
        for (let i = 0; i < 7; i++) { const a = R(-0.7, 0.7), w = R(6, 16); rays += `<path d="M${f1(sx + i * 6 - 20)} -5L${f1(sx + i * 6 - 20 + w)} -5L${f1(sx + a * 300 + w * 4)} 300L${f1(sx + a * 300)} 300Z" fill="#fff" opacity="${f1(sc.id === "tiefsee" ? R(0.02, 0.05) : R(0.05, 0.12))}"/>`; }
        o.push(`<g filter="url(#${id("soft")})">${rays}</g>`);
        if (sc.id !== "tiefsee") {
          let surf = "M-10 0";
          for (let x = -10; x <= 310; x += 15) surf += `Q${f1(x + 7.5)} ${f1(R(8, 14))} ${f1(x + 15)} ${f1(R(3, 7))}`;
          o.push(`<path d="${surf}L310 -5L-10 -5Z" fill="#fff" opacity=".22"/>`);
        }
        // ferner Fischschwarm
        const fish = (x, y, s, c) => `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(s * dir)} ${f1(s)})" fill="${c}"><ellipse cx="0" cy="0" rx="6" ry="2.6"/><path d="M-5 0L-10 -3.5L-10 3.5Z"/></g>`;
        let school = "";
        const scx = R(40, 260), scy = R(50, 120);
        for (let i = 0; i < 22; i++) school += fish(scx + R(-45, 45), scy + R(-20, 20), R(0.6, 1), layer(0.35));
        o.push(school);
        // Meeresboden
        o.push(ridge(236, 18, 0.55, layer(0.45)));
        if (sc.id === "seetangwald") {
          const kelp = (x, base, h, c, w) => {
            let d = `M${f1(x)} ${f1(base)}`, ph = R(0, 6), lv = "";
            for (let y = 0; y <= h; y += 10) {
              const xx = x + Math.sin(ph + y * 0.04) * 10;
              d += `L${f1(xx)} ${f1(base - y)}`;
              if (y % 20 === 0 && y > 10) lv += `<ellipse cx="${f1(xx + 7)}" cy="${f1(base - y)}" rx="9" ry="3" transform="rotate(-30 ${f1(xx + 7)} ${f1(base - y)})" fill="${c}"/>`;
            }
            return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>${lv}`;
          };
          let k1 = "", k2 = "";
          for (let x = R(-10, 10); x < 310; x += R(18, 30)) k1 += kelp(x, 300, R(180, 290), layer(0.4), 4);
          for (let x = R(-10, 10); x < 310; x += R(30, 50)) if (Math.abs(x - cx) > 45) k2 += kelp(x, 300, R(200, 300), layer(0.72), 6);
          o.push(k1, k2);
        }
        // Korallen und Steine im Vordergrund
        const coral = (x, base, h, c) => {
          let s = "";
          const br = (x0, y0, ang, len, w, depth) => {
            const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
            s += `<path d="M${f1(x0)} ${f1(y0)}L${f1(x1)} ${f1(y1)}" stroke="${c}" stroke-width="${f1(w)}" stroke-linecap="round"/>`;
            if (depth > 0) { br(x1, y1, ang - R(0.3, 0.6), len * 0.72, w * 0.72, depth - 1); br(x1, y1, ang + R(0.3, 0.6), len * 0.72, w * 0.72, depth - 1); }
          };
          br(x, base, -Math.PI / 2 + R(-0.2, 0.2), h * 0.4, 6, 3);
          return s;
        };
        const fan = (x, base, r, c) => {
          let s = `<path d="M${f1(x - r)} ${f1(base - r * 0.2)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + r)} ${f1(base - r * 0.2)}L${f1(x)} ${f1(base)}Z" fill="${c}" opacity=".9"/>`;
          for (let a = 0.15; a < 1; a += 0.14) s += `<path d="M${f1(x)} ${f1(base)}L${f1(x - Math.cos(a * Math.PI) * r)} ${f1(base - Math.sin(a * Math.PI) * r)}" stroke="${col(acc, 0.25)}" stroke-width=".8"/>`;
          return s;
        };
        let reef = `<path d="M-10 300L-10 ${f1(262 + R(-6, 6))}Q75 ${f1(250 + R(-8, 8))} 150 ${f1(262 + R(-6, 6))}T310 ${f1(258 + R(-8, 8))}L310 300Z" fill="${F}"/>`;
        if (sc.id === "korallenriff") {
          const tints = [[340, 60, 55], [20, 80, 58], [280, 45, 55], [45, 85, 58]];
          let back = "";
          for (let i = 0; i < 7; i++) back += rng() < 0.5 ? coral(R(0, 300), 262, R(50, 90), col(mixC(pk(tints), hz, 0.55))) : fan(R(0, 300), 262, R(18, 30), col(mixC(pk(tints), hz, 0.55)));
          o.push(back);
          for (let i = 0; i < 5; i++) { const x = R(0, 300); if (Math.abs(x - cx) > 40) reef += rng() < 0.6 ? coral(x, 270, R(60, 100), F) : fan(x, 270, R(20, 34), F); }
        } else if (sc.id === "tiefsee") {
          for (let i = 0; i < 3; i++) { const x = R(0, 300); if (Math.abs(x - cx) > 40) reef += coral(x, 272, R(40, 70), F); }
        }
        for (let i = 0; i < 5; i++) reef += `<ellipse cx="${f1(R(0, 300))}" cy="${f1(R(268, 290))}" rx="${f1(R(10, 22))}" ry="${f1(R(6, 12))}" fill="${F}"/>`;
        o.push(reef);
        // Quallen in der Tiefsee
        if (sc.id === "tiefsee") {
          let jel = "";
          for (let i = 0; i < 3; i++) {
            const x = R(20, 280), y = R(40, 200), r = R(7, 13);
            if (Math.abs(x - cx) < 60 && Math.abs(y - 150) < 60) continue;
            jel += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r * 3)}" fill="url(#${id("glow")})" opacity=".45"/><path d="M${f1(x - r)} ${f1(y)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + r)} ${f1(y)}Z" fill="${col(light, 0.75)}"/>`;
            for (let k = -2; k <= 2; k++) jel += `<path d="M${f1(x + k * r * 0.35)} ${f1(y)}q${f1(R(-4, 4))} ${f1(r)} 0 ${f1(r * 2.2)}" fill="none" stroke="${col(light, 0.5)}" stroke-width=".9"/>`;
          }
          o.push(jel);
          let pl = "";
          for (let i = 0; i < 26; i++) pl += glowDot(R(0, 300), R(0, 290), R(1.5, 4), R(0.4, 0.9));
          o.push(pl);
        }
        // Das Meerestier
        const my = R(118, 168);
        if (cr.id === "whale") o.push(place(R(140, 160), R(120, 150), R(0.78, 0.9), whale(F, acc, light)));
        else if (cr.id === "turtle") o.push(place(cx, my, R(1.05, 1.2), turtle(F, acc, light)));
        else if (cr.id === "seahorse") o.push(place(cx, R(140, 160), R(1.35, 1.55), seahorse(F, acc, light)));
        else o.push(place(150 + dir * R(14, 30), my, R(1.05, 1.18), mermaid(R, F, acc, light, id)));
        // Luftblasen
        let bub = "";
        for (let i = 0; i < 14; i++) bub += `<circle cx="${f1(R(5, 295))}" cy="${f1(R(10, 260))}" r="${f1(R(1.2, 4.5))}" fill="none" stroke="#fff" stroke-width=".8" opacity="${f1(R(0.3, 0.7))}"/>`;
        const bx = cx + dir * R(20, 40);

        else o.push(place(cx, gy, R(1.05, 1.2), princess(R, F, acc, light, id)));
        if (snow) {

          for (let i = 0; i < 70; i++) sn += `<circle cx="${f1(R(0, 300))}" cy="${f1(R(0, 300))}" r="${f1(R(0.6, 2))}" fill="#fff" opacity="${f1(R(0.5, 0.95))}"/>`;

        }
      }
    } else {
    if (sc.id === "nordlicht") {

      o.push(`<rect x="0" y="208" width="300" height="92" fill="url(#${id("lake")})"/>`);
      if (moon) {

          refl += `<rect x="${f1(mx - w / 2 + R(-3, 3))}" y="${f1(212 + i * 6.5)}" width="${f1(w)}" height="1.8" rx=".9" fill="${col([48, 70, 90])}" opacity="${f1(0.55 * (1 - i / 10))}"/>`;
        }

    } else if (sc.id === "morgenrot") {

    } else if (sc.id === "wolkenmeer") {

    if (sc.world !== "fabel") { /* schon gezeichnet */ } else if (cr.id === "phoenix") {

      let dots = "";
      for (let i = 0; i < 7; i++) dots += glowDot(cx + R(-70, 70), gy - R(20, 170) * s, R(2, 5), R(0.5, 1));
      o.push(dots);
    }

    }

    // Glühwürmchen im Wald, goldener Glanz bei seltenen Bildern
    if (sc.id === "gluehwald") {

      o.push(gl);

    o.push(`<rect width="300" height="300" fill="url(#${id("vig")})"/>`);
    return `<svg viewBox="0 0 300 300" role="img" aria-label="${cardName(card)}"><defs>${defs.join("")}</defs>${o.join("")}</svg>`;
  }

  // Einhorn oder Pegasus als Silhouette, Blick nach rechts, Hufe bei y = 0
  function horse(R, rng, F, acc, id, wings, noHorn) {
    const line = (pts, w) => `<polyline points="${pts.map((p) => p.map(f1).join(",")).join(" ")}" fill="none" stroke="${F}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
    const leg = (top, knee, fet, hoof) => line([top, knee], 9) + line([knee, fet, hoof], 4.6) + `<ellipse cx="${f1(hoof[0])}" cy="${f1(hoof[1] - 1)}" rx="3.6" ry="2.6" fill="${F}"/>`;
    const pose = rng();
    const tw = R(-6, 10), hr = R(-14, 5);
    let s = "";
    // Schweif
    s += `<path d="M-38 -72C-54 -70 ${f1(-62 - tw)} -50 ${f1(-58 - tw)} -24" fill="none" stroke="${F}" stroke-width="9" stroke-linecap="round"/>`;
    s += `<path d="M-38 -70C-50 -64 ${f1(-66 - tw)} -54 ${f1(-72 - tw * 1.4)} -36" fill="none" stroke="${F}" stroke-width="5" stroke-linecap="round"/>`;
    s += `<path d="M-38 -68C-46 -56 ${f1(-52 - tw)} -40 ${f1(-48 - tw * 0.6)} -14" fill="none" stroke="${F}" stroke-width="4" stroke-linecap="round"/>`;
    // Beine: hinten und vorne, je ein fernes und ein nahes
    s += leg([-20, -60], [-26, -28], [-23, -6], [-21, 0]);
    s += leg([20, -56], [22, -30], [21, -6], [23, 0]);
    if (pose < 0.3) {
      s += leg([-28, -60], [-30, -30], [-24, -8], [-20, -2]);
      s += leg([28, -56], [42, -40], [38, -22], [41, -17]); // Vorderbein angehoben
    } else if (pose < 0.55) {
      s += leg([-28, -60], [-38, -32], [-38, -8], [-37, 0]);
      s += leg([28, -56], [34, -30], [38, -6], [40, 0]); // Schritt
    } else {
      s += leg([-28, -60], [-34, -30], [-31, -6], [-29, 0]);
      s += leg([28, -56], [29, -30], [29, -6], [31, 0]);
    }
    // Rumpf
    s += `<g fill="${F}"><ellipse cx="2" cy="-64" rx="33" ry="15"/><circle cx="-24" cy="-67" r="16"/><ellipse cx="24" cy="-66" rx="14" ry="18"/></g>`;
    // Hals, Kopf, Mähne, Horn (drehbar am Widerrist)
    let head = `<path d="M12 -78C16 -96 28 -112 40 -120L52 -112C46 -98 42 -80 38 -58Z"/>`;
    head += `<path d="M38 -124C48 -130 56 -124 62 -114L76 -96C79 -91 76 -86 70 -86C64 -86 58 -90 52 -96L44 -104Z"/><circle cx="47" cy="-110" r="10"/>`;
    head += `<path d="M39 -124L41 -138L47 -126Z"/>`;
    let mane = "";
    [[40, -122, 6], [33, -114, 6.5], [26, -105, 6.5], [19, -94, 6], [14, -82, 5]].forEach(([x, y, w]) => {
      mane += `<path d="M${x} ${y}C${x - 8} ${y + 2} ${f1(x - 15)} ${y + 10} ${f1(x - 19 + R(-4, 4))} ${f1(y + 20 + R(-4, 4))}" fill="none" stroke="${F}" stroke-width="${w}" stroke-linecap="round"/>`;
    });
    mane += `<path d="M42 -125C48 -123 52 -119 54 -112" fill="none" stroke="${F}" stroke-width="3" stroke-linecap="round"/>`;
    const horn = `<circle cx="56" cy="-150" r="18" fill="url(#${id("glow")})" opacity=".8"/><path d="M43 -127L51 -129L61 -166Z" fill="url(#${id("horn")})"/>`;
    s += `<g transform="rotate(${f1(hr)} 26 -74)"><g fill="${F}">${head}</g>${mane}${noHorn ? "" : horn}</g>`;
    if (wings) {
      // Flügelbogen von der Schulter nach hinten oben; Federn hängen daran und zeigen nach hinten
      const lift = R(-10, 8);
      const P = (t) => {
        const a = [6, -84], c = [-6, -132 + lift], b = [-60, -150 + lift];
        return [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
      };
      const feather = (t, len, ang, ry) => {
        const [bx, by] = P(t), rad = (ang * Math.PI) / 180;
        const ex = bx + (Math.cos(rad) * len) / 2, ey = by + (Math.sin(rad) * len) / 2;
        return `<ellipse cx="${f1(ex)}" cy="${f1(ey)}" rx="${f1(len / 2)}" ry="${ry}" transform="rotate(${f1(ang)} ${f1(ex)} ${f1(ey)})"/>`;
      };
      let fe = "", glow = "";
      for (let i = 0; i <= 10; i++) {
        const t = 0.12 + (i / 10) * 0.88;
        const e = feather(t, 26 + 26 * t, 128 + 50 * t, 4.2);
        fe += e;
        if (i % 2 === 1) glow += e;
      }
      for (let i = 0; i <= 6; i++) fe += feather(0.05 + i * 0.13, 18, 140 + 30 * (i / 6), 7);
      const [bx2, by2] = P(1);
      fe += `<path d="M6 -84Q${f1(-6)} ${f1(-132 + lift)} ${f1(bx2)} ${f1(by2)}" fill="none" stroke="${F}" stroke-width="7" stroke-linecap="round"/>`;
      s += `<g fill="${F}">${fe}</g><g fill="${col(acc)}" opacity=".25">${glow}</g>`;
    }
    return s;
  }

  // Fee als Silhouette mit leuchtenden Flügeln, Blick nach rechts, Hüfte bei 0/0

    s += `<path d="M-2 -30L7 -30C14 -18 20 -6 22 4C12 2 4 6 -4 3C-10 6 -18 4 -26 6C-18 -6 -10 -18 -2 -30Z"/></g>`;
    s += lim([[6, -52], [4, -46]], 4);
    s += lim([[2, 2], [-4, 22], [-13, 30]], 3.4) + lim([[9, 2], [9, 20], [3, 30]], 3.4);
    s += lim([[8, -45], [18, -52], [28, -64]], 3.4) + lim([[-1, -45], [-10, -36], [-19, -32]], 3.4);
    s += `<line x1="28" y1="-64" x2="36" y2="-80" stroke="${col(light)}" stroke-width="2" stroke-linecap="round"/>`;
    s += `<circle cx="37" cy="-82" r="12" fill="url(#${id("glow")})"/><path d="${starPath(37, -82, 5)}" fill="#fff"/>`;
    return s;
  }

  // ---------- Tiere und Figuren der neuen Welten (Silhouetten, Blick nach rechts) ----------
  const strokeL = (F, pts, w) => `<polyline points="${pts.map((p) => p.map(f1).join(",")).join(" ")}" fill="none" stroke="${F}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const eyeGlint = (x, y, c) => `<circle cx="${x}" cy="${y}" r="1.5" fill="${col(c)}"/>`;

  // Fuchs im Trab, Pfoten bei y = 0
  function fox(R, F, light) {

    s += `<g fill="${F}"><ellipse cx="-2" cy="-35" rx="29" ry="12"/><path d="M14 -44C21 -53 26 -60 29 -64L41 -57C37 -49 32 -39 24 -27Z"/><circle cx="33" cy="-61" r="9.5"/>`;

  // Hirsch mit Geweih

      <path d="M37 -117C33 -131 26 -143 16 -158"/><path d="M36 -121C43 -123 48 -128 51 -134"/><path d="M33 -130C40 -136 44 -143 45 -151"/><path d="M28 -140C33 -148 34 -155 33 -163"/><path d="M22 -149C24 -156 23 -162 20 -168"/></g>`;

  // Eule auf einem Ast, von vorn; Ast bei y = 0
  function owl(F, acc, id, light) {
    let s = `<path d="M-120 4C-60 -2 10 1 120 -4L120 3C10 9 -60 9 -120 13Z" fill="${F}"/><path d="M-60 2C-70 -10 -80 -16 -92 -18M40 0C50 -12 62 -18 74 -18M74 -18C80 -22 86 -22 90 -20" fill="none" stroke="${F}" stroke-width="2.4" stroke-linecap="round"/>`;

  // Drache im Flug, auf Wunsch mit Feueratem; Mitte bei 0/0

  // Phönix: Feuervogel mit Federschwingen und langem Glutschweif; Mitte bei 0/0
  function phoenix(R, F, acc, id) {
    const fire = mixC(acc, [26, 100, 58], 0.8), ember = mixC(acc, [46, 100, 70], 0.7), lift = R(-8, 6);
    let s = "";
    // Schweif: drei lange Federn mit Augenflecken
    [[0, 96, 30], [1, 118, 16], [2, 104, 4]].forEach(([k, len, dy]) => {
      const ex = -len, ey = dy + 24;
      const d = `M-12 4C-36 ${dy + 4} ${-len + 34} ${dy + 34} ${ex} ${ey}`;
      s += `<path d="${d}" fill="none" stroke="${col(fire)}" stroke-width="7" opacity=".55" filter="url(#${id("soft")})"/><path d="${d}" fill="none" stroke="${col(ember)}" stroke-width="1.6"/>`;
      s += `<ellipse cx="${ex}" cy="${ey}" rx="9" ry="5" transform="rotate(${15 - k * 10} ${ex} ${ey})" fill="${col(fire)}" opacity=".9"/><circle cx="${ex}" cy="${ey}" r="2.4" fill="#fff" opacity=".9"/>`;
    });
    // Schwingen wie beim Pegasus: Federn hängen an einem Bogen und zeigen nach hinten; die Spitzen glühen
    const wing = (tip, op) => {
      const P = (t) => { const a = [2, -6], c = [tip[0] * 0.2, -46 + lift], b = [tip[0], tip[1] + lift]; return [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]; };
      let f = "", g = "";
      for (let i = 0; i <= 10; i++) {
        const t = 0.1 + (i / 10) * 0.9, [bx, by] = P(t), len = 16 + 26 * t, ang = 150 + 40 * t, rad = (ang * Math.PI) / 180;
        const ex = bx + (Math.cos(rad) * len) / 2, ey = by + (Math.sin(rad) * len) / 2;
        f += `<ellipse cx="${f1(ex)}" cy="${f1(ey)}" rx="${f1(len / 2)}" ry="3.8" transform="rotate(${f1(ang)} ${f1(ex)} ${f1(ey)})"/>`;
        if (i % 2 === 0) g += `<circle cx="${f1(bx + Math.cos(rad) * len)}" cy="${f1(by + Math.sin(rad) * len)}" r="${f1(2 + t * 2.5)}" fill="${col(ember)}"/>`;
      }
      const [tx, ty] = P(1);
      f += `<path d="M2 -6Q${f1(tip[0] * 0.2)} ${f1(-46 + lift)} ${f1(tx)} ${f1(ty)}" fill="none" stroke="${F}" stroke-width="6" stroke-linecap="round"/>`;
      return `<g opacity="${op}"><g fill="${F}">${f}</g><g filter="url(#${id("soft")})" opacity=".9">${g}</g></g>`;
    };
    s += wing([-66, -56], 0.75) + wing([-30, -74], 1);
    s += `<g fill="${F}"><ellipse cx="0" cy="0" rx="17" ry="9" transform="rotate(-14)"/><path d="M10 -6C14 -12 18 -16 22 -16L26 -8C20 -6 16 -2 12 2Z"/><circle cx="23" cy="-13" r="6.4"/><path d="M28 -15L37 -11L28 -9Z"/></g>`;
    s += `<g fill="none" stroke="${col(ember)}" stroke-width="2" stroke-linecap="round"><path d="M21 -18C17 -26 12 -29 7 -29M23 -19C22 -28 18 -33 13 -36M25 -18C26 -27 25 -33 21 -38"/></g>`;
    s += `<circle cx="0" cy="-4" r="40" fill="url(#${id("glow")})" opacity=".35"/>`;
    return s + `<circle cx="25" cy="-14" r="1.5" fill="${col(ember)}"/>`;
  }

  // Burg mit Türmen, Zinnen, Fahnen und erleuchteten Fenstern; Fuß bei y = base
  function castle(x, base, k, c, acc, light, rng, R, snow) {
    const w = 120 * k;
    let s = "", win = "", flags = "", snowCaps = "";
    const tower = (tx, tw, th, roof) => {
      s += `<rect x="${f1(tx - tw / 2)}" y="${f1(base - th)}" width="${f1(tw)}" height="${f1(th)}" fill="${c}"/>`;
      if (roof) {
        s += `<path d="M${f1(tx - tw / 2 - 3 * k)} ${f1(base - th)}L${f1(tx)} ${f1(base - th - tw * 1.3)}L${f1(tx + tw / 2 + 3 * k)} ${f1(base - th)}Z" fill="${c}"/>`;
        const fy = base - th - tw * 1.3;
        flags += `<path d="M${f1(tx)} ${f1(fy)}V${f1(fy - 12 * k)}" stroke="${c}" stroke-width="1.2"/><path d="M${f1(tx)} ${f1(fy - 12 * k)}L${f1(tx + 10 * k)} ${f1(fy - 9 * k)}L${f1(tx)} ${f1(fy - 6 * k)}Z" fill="${col(acc)}"/>`;
        if (snow) snowCaps += `<path d="M${f1(tx - tw * 0.3)} ${f1(base - th - tw * 0.55)}L${f1(tx)} ${f1(base - th - tw * 1.3)}L${f1(tx + tw * 0.3)} ${f1(base - th - tw * 0.55)}Z" fill="#fff" opacity=".85"/>`;
      } else {
        for (let i = 0; i < 3; i++) s += `<rect x="${f1(tx - tw / 2 + i * tw * 0.38)}" y="${f1(base - th - 5 * k)}" width="${f1(tw * 0.24)}" height="${f1(5 * k)}" fill="${c}"/>`;
      }
      for (let i = 0; i < 2; i++) if (rng() < 0.7) win += `<rect x="${f1(tx - 1.5 * k)}" y="${f1(base - th * R(0.4, 0.8))}" width="${f1(3 * k)}" height="${f1(5 * k)}" rx="${f1(1.5 * k)}" fill="${col(light)}"/>`;
    };
    // Mauer mit Zinnen und Tor
    s += `<rect x="${f1(x - w / 2)}" y="${f1(base - 30 * k)}" width="${f1(w)}" height="${f1(30 * k)}" fill="${c}"/>`;
    for (let i = 0; i < 12; i++) s += `<rect x="${f1(x - w / 2 + i * (w / 12) + 2 * k)}" y="${f1(base - 35 * k)}" width="${f1(w / 24)}" height="${f1(5 * k)}" fill="${c}"/>`;
    tower(x - w / 2, 22 * k, R(58, 70) * k, true);
    tower(x + w / 2, 22 * k, R(58, 70) * k, true);
    tower(x - w * 0.12, 30 * k, R(82, 96) * k, rng() < 0.6);
    tower(x + w * 0.2, 18 * k, R(64, 76) * k, true);
    s += `<path d="M${f1(x - 8 * k)} ${f1(base)}V${f1(base - 16 * k)}A${f1(8 * k)} ${f1(8 * k)} 0 0 1 ${f1(x + 8 * k)} ${f1(base - 16 * k)}V${f1(base)}Z" fill="#000" opacity=".35"/>`;
    return s + snowCaps + flags + win;
  }

  // ---------- Bilder, zweite Generation (ab 1.8) ----------
  // Bilderbuch statt Scherenschnitt: farbige Wesen mit Gesicht, natürliche Landschaften, auch nachts gut erkennbar.
  // Karten mit v: 2 werden hiermit gezeichnet, ältere Karten bleiben genau so, wie sie gesammelt wurden.
  // Goldbilder zeigen Legenden, die es nur in Gold gibt, in eigenen Landschaften.
  const PIC2 = (() => {
    const INK = "#2a2030";
    // Farbe aufhellen (t > 0) oder abdunkeln (t < 0)
    const sh = (hex, t) => {
      const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
      return "#" + c.map((v) => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t).toString(16).padStart(2, "0")).join("");
    };
    const eye = (x, y, r) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${f1(r * 1.15)}" fill="${INK}"/><circle cx="${f1(x + r * 0.32)}" cy="${f1(y - r * 0.4)}" r="${f1(r * 0.42)}" fill="#fff"/><circle cx="${f1(x - r * 0.3)}" cy="${f1(y + r * 0.38)}" r="${f1(r * 0.17)}" fill="#fff" opacity=".85"/>`;
    const cheek = (x, y, r) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${f1(r * 0.6)}" fill="#ff6f86" opacity=".38"/>`;
    const smile = (x, y, w, c = INK) => `<path d="M${f1(x - w)} ${y}Q${x} ${f1(y + w * 0.9)} ${f1(x + w)} ${y}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`;
    // Umriss in dunklerer Farbe: wirkt gezeichnet und hebt sich von hellem und dunklem Grund ab
    const S = (fill, w = 2) => `fill="${fill}" stroke="${sh(fill, -0.45)}" stroke-width="${w}" stroke-linejoin="round"`;

    // ----- Wesen: Blick nach rechts. Landtiere stehen auf (0|0), Flieger und Schwimmer haben (0|0) in der Körpermitte -----
    function fox(o = {}) {
