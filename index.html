      return `<path d="M-12 -86C-26 -78 -28 -50 -20 -40C-16 -52 -12 -66 -8 -74Z" fill="${H}" stroke="${sh(H, -0.35)}" stroke-width="1.4"/><path d="M12 -86C26 -78 28 -50 20 -40C16 -52 12 -66 8 -74Z" fill="${H}" stroke="${sh(H, -0.35)}" stroke-width="1.4"/>` +
        `<path d="M-8 -60C-12 -50 -12 -40 -10 -36C-20 -20 -30 -6 -36 0H36C30 -6 20 -20 10 -36C12 -40 12 -50 8 -60Z" ${S(D)}/>` +
        `<path d="M-36 0C-30 -4 -24 2 -18 -2C-12 2 -6 -2 0 2C6 -2 12 2 18 -2C24 2 30 -4 36 0" fill="none" stroke="${sh(D, 0.5)}" stroke-width="2.4"/>` +
        `<path d="M-10 -36C-4 -32 4 -32 10 -36" fill="none" stroke="${G}" stroke-width="2.4"/>` +
        `<path d="M-9 -56C-18 -46 -22 -38 -20 -30M9 -56C18 -46 22 -38 20 -30" fill="none" stroke="${K}" stroke-width="3.6" stroke-linecap="round"/>` +
        `<path d="M20 -30L22 -40" stroke="#4f9a4a" stroke-width="1.6"/><circle cx="22" cy="-42" r="3.6" fill="#ff6f86" stroke="#b03a54" stroke-width="1"/>` +
        `<path d="M-4 -60H4V-66H-4Z" fill="${K}"/>` +
        `<circle cx="0" cy="-74" r="12" fill="${K}" stroke="${sh(K, -0.3)}" stroke-width="1.4"/>` +
        `<path d="M-13 -74C-14 -88 -4 -92 4 -90C12 -88 16 -80 13 -72C8 -80 -4 -82 -13 -74Z" fill="${H}"/>` +
        `<path d="M-9 -86L-10 -96L-5 -90L0 -99L5 -90L10 -96L9 -86Z" fill="${G}" stroke="#b07a12" stroke-width="1.3"/><circle cx="0" cy="-90" r="1.8" fill="#ff5a7a"/>` +
        eye(-4, -73, 2.5) + eye(5, -73, 2.5) + cheek(-7, -67, 3) + cheek(8, -67, 3) + smile(0.5, -66, 3);
    }
    function knight(o = {}) {
      const M = "#c9d3de", C = o.c || "#3f7fd6", K = "#ffd9c2", G = "#ffd24a";
      return `<path d="M-14 -10V-2H-4V-10ZM4 -10V-2H14V-10Z" ${S(M, 1.6)}/>` +
        `<path d="M-18 -50C-20 -34 -18 -18 -16 -10H16C18 -18 20 -34 18 -50Z" ${S(C)}/>` +
        `<path d="M0 -48V-12M-12 -32H12" stroke="${G}" stroke-width="3"/>` +
        `<path d="M18 -46L28 -74" stroke="#7a5a3a" stroke-width="3" stroke-linecap="round"/><path d="M27 -74L46 -70L28 -62Z" fill="${G}" stroke="#b07a12" stroke-width="1.2"/>` +
        `<path d="M-16 -46C-24 -40 -26 -30 -22 -26" fill="none" stroke="${M}" stroke-width="6" stroke-linecap="round"/>` +
        `<path d="M-34 -40H-12V-24C-12 -16 -18 -10 -23 -8C-28 -10 -34 -16 -34 -24Z" ${S(C, 1.8)}/><path d="M-23 -36V-14M-31 -26H-15" stroke="${G}" stroke-width="2.6"/>` +
        `<path d="M16 -46C22 -42 24 -40 22 -44" fill="none" stroke="${M}" stroke-width="6" stroke-linecap="round"/>` +
        `<path d="M-15 -60C-16 -80 -8 -86 0 -86C8 -86 16 -80 15 -60C10 -54 -10 -54 -15 -60Z" ${S(M)}/>` +
        `<path d="M-9 -74H9V-60C6 -56 -6 -56 -9 -60Z" fill="${K}"/>` +
        `<path d="M0 -86C2 -96 10 -102 18 -98C12 -96 6 -92 4 -86Z" fill="#ff5a5f" stroke="#a8302f" stroke-width="1.2"/>` +
        eye(-3.5, -67, 2.4) + eye(4.5, -67, 2.4) + cheek(-6, -61.5, 2.6) + cheek(7, -61.5, 2.6) + smile(0.5, -60.5, 2.6);
    }
    function dragon(o = {}) {
      const G = o.c || "#6cc46a", B = o.belly || "#f5e6a3", W = o.wing || "#a4dd7f";
      let stripes = "";
      for (let i = 0; i < 4; i++) stripes += `<path d="M${-2 + i} ${-48 + i * 10}h${12 - i}" stroke="${sh(B, -0.25)}" stroke-width="1.3"/>`;
      return `<path d="M-20 -8C-44 -2 -58 -14 -62 -28C-54 -22 -46 -18 -38 -22" fill="none" stroke="${sh(G, -0.45)}" stroke-width="12" stroke-linecap="round"/><path d="M-20 -8C-44 -2 -58 -14 -62 -28C-54 -22 -46 -18 -38 -22" fill="none" stroke="${G}" stroke-width="8.5" stroke-linecap="round"/>` +
        `<path d="M-62 -28L-72 -36L-60 -38Z" ${S(sh(G, -0.15), 1.4)}/>` +
        `<path d="M-12 -46C-30 -70 -40 -84 -54 -88C-48 -74 -50 -62 -40 -56C-46 -52 -44 -44 -34 -42C-34 -36 -24 -34 -14 -36Z" ${S(W, 1.6)}/>` +
        `<path d="M-24 -2C-32 -30 -20 -58 4 -58C26 -56 30 -28 22 -2Z" ${S(G)}/>` +
        `<path d="M-4 -52C10 -52 16 -32 12 -6C4 -4 -6 -4 -10 -8C-12 -30 -10 -46 -4 -52Z" fill="${B}"/>` + stripes +
        `<ellipse cx="-14" cy="-10" rx="14" ry="11" ${S(G)}/><ellipse cx="-8" cy="-2" rx="11" ry="4" ${S(sh(G, 0.15), 1.5)}/>` +
        `<path d="M10 -36C18 -32 20 -24 16 -20" fill="none" stroke="${G}" stroke-width="7" stroke-linecap="round"/>` +
        `<path d="M-4 -74L-8 -90L4 -78Z" fill="#fff3c4" stroke="#b49a5a" stroke-width="1.2"/><path d="M8 -78L10 -94L18 -78Z" fill="#fff3c4" stroke="#b49a5a" stroke-width="1.2"/>` +
        `<path d="M-14 -64C-16 -80 0 -86 12 -82C26 -80 38 -74 40 -64C40 -54 30 -50 18 -50C4 -50 -12 -52 -14 -64Z" ${S(G)}/>` +
        `<path d="M-14 -66L-22 -70L-16 -60Z" ${S(sh(G, -0.15), 1.2)}/>` +
        `<circle cx="34" cy="-68" r="1.6" fill="${sh(G, -0.5)}"/><circle cx="37" cy="-64" r="1.6" fill="${sh(G, -0.5)}"/>` +
        eye(14, -68, 4) + cheek(18, -57, 4.4) + `<path d="M28 -56Q33 -53 38 -57" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>` + (o.crown ? `<path d="M-2 -80L-4 -92L2 -86L8 -96L12 -86L18 -92L16 -80Z" fill="#ffe14d" stroke="#a87a12" stroke-width="1.3"/>` : "");
    }
    const DRAW = { fox, deer, owl, hare, unicorn, pegasus, fairy, phoenix, whale, turtle, seahorse, mermaid, princess, knight, dragon };

    // ----- Legenden: gibt es nur als Goldbild -----
    const LEGEND = {
      weisshirsch: { base: "deer", o: { c: "#f4f1ea", antler: "#ffd24a" }, scene: "silberwald" },
      sternenwal: { base: "whale", o: { c: "#3d4fa8", belly: "#c9d6ff" }, scene: "sternenmeer", stars: true },
      regenbogeneinhorn: { base: "unicorn", o: { mane: RAINBOW }, scene: "regenbogenbruecke" },
      golddrache: { base: "dragon", o: { c: "#f2b632", belly: "#fff1b8", wing: "#ffd970", crown: true }, scene: "schatzkammer" },
    };

    // ----- Bausteine der Landschaften -----
    const hill = (R, y, amp, n, fill, extra = "") => {
      const w = 320 / n;
      let d = `M-10 300L-10 ${f1(y + R(-amp, amp) * 0.4)}`;
      for (let i = 0; i < n; i++) { const x = -10 + w * (i + 1); d += `Q${f1(x - w / 2)} ${f1(y - R(0.4, 1) * amp)} ${f1(x)} ${f1(y + R(-amp, amp) * 0.3)}`; }
      return `<path d="${d}L310 300Z" fill="${fill}"${extra}/>`;
    };
    const cloud = (x, y, s, c = "#ffffff", d = "#dfeaf7") =>
      `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(s * 100) / 100})"><ellipse cx="4" cy="8" rx="34" ry="9" fill="${d}"/>` +
      `<circle cx="-16" cy="2" r="11" fill="${c}"/><circle cx="0" cy="-6" r="15" fill="${c}"/><circle cx="16" cy="0" r="12" fill="${c}"/><circle cx="28" cy="5" r="8" fill="${c}"/><ellipse cx="4" cy="6" rx="32" ry="7" fill="${c}"/></g>`;
    const sun = (u, x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r * 3)}" fill="url(#${u}sunglow)"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#fff3a8"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r * 0.8)}" fill="#ffe46b"/>`;
    const moon = (u, x, y, r, crescent) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r * 3.2)}" fill="url(#${u}moonglow)"/>` +
      (crescent ? `<path d="M${f1(x)} ${f1(y - r)}A${r} ${r} 0 0 1 ${f1(x)} ${f1(y + r)}A${f1(r * 1.25)} ${f1(r * 1.25)} 0 0 0 ${f1(x)} ${f1(y - r)}Z" fill="#fff6cf" transform="rotate(-25 ${f1(x)} ${f1(y)})"/>`
        : `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="#fff6d6"/><circle cx="${f1(x - r * 0.3)}" cy="${f1(y - r * 0.2)}" r="${f1(r * 0.18)}" fill="#efe3b8"/><circle cx="${f1(x + r * 0.28)}" cy="${f1(y + r * 0.3)}" r="${f1(r * 0.12)}" fill="#efe3b8"/><circle cx="${f1(x + r * 0.2)}" cy="${f1(y - r * 0.38)}" r="${f1(r * 0.09)}" fill="#efe3b8"/>`);
    const stars = (R, n, y1, c = "#fff") => {
      let o = "";
      for (let i = 0; i < n; i++) o += `<circle cx="${f1(R(4, 296))}" cy="${f1(R(4, y1))}" r="${f1(R(0.5, 1.5))}" fill="${c}" opacity="${f1(R(0.5, 1))}"/>`;
      for (let i = 0; i < Math.ceil(n / 12); i++) o += `<path d="${starPath(R(10, 290), R(10, y1 * 0.8), R(3, 5))}" fill="${c}"/>`;
      return o;
    };
    const roundTree = (x, y, h, c, trunk = "#8a5a3a") => {
      const r = h * 0.32;
      return `<path d="M${f1(x - h * 0.05)} ${f1(y)}L${f1(x - h * 0.035)} ${f1(y - h * 0.55)}H${f1(x + h * 0.035)}L${f1(x + h * 0.05)} ${f1(y)}Z" fill="${trunk}"/>` +
        `<circle cx="${f1(x - r * 0.6)}" cy="${f1(y - h * 0.6)}" r="${f1(r * 0.8)}" fill="${sh(c, -0.12)}"/><circle cx="${f1(x + r * 0.6)}" cy="${f1(y - h * 0.62)}" r="${f1(r * 0.85)}" fill="${sh(c, -0.12)}"/>` +
        `<circle cx="${f1(x)}" cy="${f1(y - h * 0.8)}" r="${f1(r)}" fill="${c}"/><circle cx="${f1(x - r * 0.3)}" cy="${f1(y - h * 0.88)}" r="${f1(r * 0.4)}" fill="${sh(c, 0.2)}"/>`;
    };
    const pine = (x, y, h, c, snow) => {
      let o = `<rect x="${f1(x - h * 0.04)}" y="${f1(y - h * 0.16)}" width="${f1(h * 0.08)}" height="${f1(h * 0.16)}" fill="#6b4a34"/>`;
      for (let i = 0; i < 3; i++) {
        const top = y - h * (0.45 + i * 0.27), bot = y - h * (0.1 + i * 0.25), w = h * (0.36 - i * 0.09);
        o += `<path d="M${f1(x)} ${f1(top - h * 0.1)}L${f1(x + w)} ${f1(bot)}Q${f1(x)} ${f1(bot + h * 0.05)} ${f1(x - w)} ${f1(bot)}Z" fill="${c}"/>`;
        if (snow) o += `<path d="M${f1(x)} ${f1(top - h * 0.1)}L${f1(x + w * 0.5)} ${f1(top + (bot - top) * 0.35)}Q${f1(x)} ${f1(top + (bot - top) * 0.5)} ${f1(x - w * 0.5)} ${f1(top + (bot - top) * 0.35)}Z" fill="#fbfdff"/>`;
      }
      return o;
    };
    const birch = (x, y, h, crown, bark = "#f6f3ec") => {
      let o = `<rect x="${f1(x - 3)}" y="${f1(y - h)}" width="6" height="${f1(h)}" fill="${bark}"/>`;
      for (let i = 1; i < 6; i++) o += `<rect x="${f1(x - 3)}" y="${f1(y - h * i / 6)}" width="${i % 2 ? 4 : 3}" height="1.6" fill="#4a4a52"/>`;
      return o + `<ellipse cx="${f1(x)}" cy="${f1(y - h)}" rx="${f1(h * 0.22)}" ry="${f1(h * 0.28)}" fill="${crown}"/><ellipse cx="${f1(x - h * 0.05)}" cy="${f1(y - h * 1.08)}" rx="${f1(h * 0.1)}" ry="${f1(h * 0.12)}" fill="${sh(crown, 0.18)}"/>`;
    };
    const flower = (x, y, c, s = 1) => {
      let o = `<path d="M${f1(x)} ${f1(y)}V${f1(y - 9 * s)}" stroke="#4f9a44" stroke-width="${f1(1.3 * s)}"/>`;
      for (let i = 0; i < 5; i++) { const a = (i * 72 * Math.PI) / 180; o += `<circle cx="${f1(x + Math.cos(a) * 2.6 * s)}" cy="${f1(y - 10 * s + Math.sin(a) * 2.6 * s)}" r="${f1(2 * s)}" fill="${c}"/>`; }
      return o + `<circle cx="${f1(x)}" cy="${f1(y - 10 * s)}" r="${f1(1.5 * s)}" fill="#ffcf3a"/>`;
    };
    const tuft = (x, y, s, c) => `<path d="M${f1(x - 4 * s)} ${f1(y)}Q${f1(x - 3 * s)} ${f1(y - 6 * s)} ${f1(x - 6 * s)} ${f1(y - 10 * s)}M${f1(x)} ${f1(y)}Q${f1(x + s)} ${f1(y - 8 * s)} ${f1(x)} ${f1(y - 13 * s)}M${f1(x + 4 * s)} ${f1(y)}Q${f1(x + 4 * s)} ${f1(y - 6 * s)} ${f1(x + 7 * s)} ${f1(y - 9 * s)}" fill="none" stroke="${c}" stroke-width="${f1(1.6 * s)}" stroke-linecap="round"/>`;
    const mushroom = (x, y, s, cap = "#e5483c") => `<path d="M${f1(x - 3 * s)} ${f1(y)}L${f1(x - 2.4 * s)} ${f1(y - 8 * s)}H${f1(x + 2.4 * s)}L${f1(x + 3 * s)} ${f1(y)}Z" fill="#fbf1de" stroke="#c9b38f" stroke-width="${f1(0.6 * s)}"/>` +
      `<path d="M${f1(x - 9 * s)} ${f1(y - 7 * s)}Q${f1(x)} ${f1(y - 19 * s)} ${f1(x + 9 * s)} ${f1(y - 7 * s)}Z" fill="${cap}" stroke="${sh(cap, -0.35)}" stroke-width="${f1(0.8 * s)}"/>` +
      `<circle cx="${f1(x - 3.5 * s)}" cy="${f1(y - 10 * s)}" r="${f1(1.3 * s)}" fill="#fff"/><circle cx="${f1(x + 3 * s)}" cy="${f1(y - 11.5 * s)}" r="${f1(1.1 * s)}" fill="#fff"/><circle cx="${f1(x + 0.5 * s)}" cy="${f1(y - 8.5 * s)}" r="${f1(0.9 * s)}" fill="#fff"/>`;
    const butterfly = (x, y, c, s = 1) => `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})"><ellipse cx="-4" cy="-3" rx="4.5" ry="3.5" fill="${c}"/><ellipse cx="4" cy="-3" rx="4.5" ry="3.5" fill="${c}"/><ellipse cx="-3" cy="2.5" rx="3" ry="2.4" fill="${sh(c, 0.3)}"/><ellipse cx="3" cy="2.5" rx="3" ry="2.4" fill="${sh(c, 0.3)}"/><path d="M0 -4V4" stroke="${INK}" stroke-width="1.2"/></g>`;
    const fish = (x, y, s, c, flip) => `<g transform="translate(${f1(x)} ${f1(y)}) scale(${flip ? -s : s} ${s})"><path d="M-8 0L-14 -5V5Z" fill="${sh(c, -0.15)}"/><ellipse cx="0" cy="0" rx="9" ry="5.5" fill="${c}"/><path d="M-1 -5Q2 0 -1 5" fill="none" stroke="${sh(c, 0.4)}" stroke-width="1.4"/><circle cx="4.5" cy="-1" r="1.4" fill="${INK}"/></g>`;
    const weed = (x, y, h, c, R) => { let d = `M${f1(x)} ${f1(y)}`; for (let i = 1; i <= 4; i++) d += `Q${f1(x + (i % 2 ? 7 : -7))} ${f1(y - h * (i - 0.5) / 4)} ${f1(x + R(-2, 2))} ${f1(y - h * i / 4)}`; return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${f1(R(3.5, 5.5))}" stroke-linecap="round"/>`; };
    const coral = (x, y, h, c, R) => {
      let d = "";
      const br = (x0, y0, a, l, k) => { if (k > 2 || l < 6) return; const x1 = x0 + Math.sin(a) * l, y1 = y0 - Math.cos(a) * l; d += `M${f1(x0)} ${f1(y0)}L${f1(x1)} ${f1(y1)}`; br(x1, y1, a - R(0.3, 0.6), l * 0.7, k + 1); br(x1, y1, a + R(0.3, 0.6), l * 0.7, k + 1); };
      br(x, y, 0, h * 0.42, 0);
      return `<path d="${d}" fill="none" stroke="${sh(c, -0.25)}" stroke-width="8" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="5.5" stroke-linecap="round"/>`;
    };
    const bubbles = (R, n, y0, y1) => { let o = ""; for (let i = 0; i < n; i++) o += `<circle cx="${f1(R(10, 290))}" cy="${f1(R(y0, y1))}" r="${f1(R(1.5, 4))}" fill="#ffffff" fill-opacity=".25" stroke="#ffffff" stroke-opacity=".7" stroke-width="1"/>`; return o; };
    const rays = (R, n, c, op) => { let o = ""; for (let i = 0; i < n; i++) { const x = R(0, 300), w = R(10, 26), sk = R(30, 80); o += `<path d="M${f1(x)} -5H${f1(x + w)}L${f1(x + w + sk)} 260H${f1(x + sk - w * 0.5)}Z" fill="${c}" opacity="${f1(op * R(0.6, 1))}"/>`; } return o; };
    const glow = (x, y, r, c, op = 1) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r * 3)}" fill="${c}" opacity="${f1(0.18 * op)}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${c}" opacity="${f1(op)}"/>`;
    const jelly = (x, y, s, c) => `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(s)})"><circle r="16" fill="${c}" opacity=".18"/><path d="M-9 0Q-9 -11 0 -11Q9 -11 9 0Q4.5 -2 0 0Q-4.5 -2 -9 0Z" fill="${c}" opacity=".85"/><path d="M-6 0q-2 6 0 12M-2 0q2 7 0 14M2 0q-2 7 0 13M6 0q2 6 0 11" fill="none" stroke="${c}" stroke-width="1.3" opacity=".8"/></g>`;
    const castle = (x, base, s, stone, roof, win) => {
      const S2 = (n) => f1(n * s);
      const tower = (tx, w, h, r) => `<rect x="${f1(x + tx * s - w * s / 2)}" y="${f1(base - h * s)}" width="${S2(w)}" height="${S2(h)}" fill="${stone}" stroke="${sh(stone, -0.3)}" stroke-width="1"/>` +
        `<path d="M${f1(x + tx * s - w * s * 0.62)} ${f1(base - h * s)}L${f1(x + tx * s)} ${f1(base - (h + r) * s)}L${f1(x + tx * s + w * s * 0.62)} ${f1(base - h * s)}Z" fill="${roof}" stroke="${sh(roof, -0.3)}" stroke-width="1"/>` +
        `<path d="M${f1(x + tx * s)} ${f1(base - (h + r) * s)}V${f1(base - (h + r + 12) * s)}" stroke="#7a5a3a" stroke-width="1"/><path d="M${f1(x + tx * s)} ${f1(base - (h + r + 12) * s)}l${S2(9)} ${S2(3)}l${S2(-9)} ${S2(3)}Z" fill="${roof}"/>` +
        `<rect x="${f1(x + tx * s - 2.5 * s)}" y="${f1(base - h * s * 0.7)}" width="${S2(5)}" height="${S2(8)}" rx="${S2(2.5)}" fill="${win}"/>`;
      let crn = "";
      for (let i = -3; i <= 3; i++) crn += `<rect x="${f1(x + (i * 10 - 3.5) * s)}" y="${f1(base - 48 * s)}" width="${S2(7)}" height="${S2(6)}" fill="${stone}" stroke="${sh(stone, -0.3)}" stroke-width="1"/>`;
      return crn + `<rect x="${f1(x - 36 * s)}" y="${f1(base - 43 * s)}" width="${S2(72)}" height="${S2(43)}" fill="${stone}" stroke="${sh(stone, -0.3)}" stroke-width="1"/>` +
        `<path d="M${f1(x - 9 * s)} ${f1(base)}V${f1(base - 16 * s)}Q${f1(x)} ${f1(base - 28 * s)} ${f1(x + 9 * s)} ${f1(base - 16 * s)}V${f1(base)}Z" fill="#7a5638"/>` +
        tower(-40, 18, 70, 24) + tower(40, 18, 70, 24) + tower(0, 22, 92, 30) +
        `<rect x="${f1(x - 22 * s)}" y="${f1(base - 32 * s)}" width="${S2(5)}" height="${S2(8)}" rx="${S2(2.5)}" fill="${win}"/><rect x="${f1(x + 17 * s)}" y="${f1(base - 32 * s)}" width="${S2(5)}" height="${S2(8)}" rx="${S2(2.5)}" fill="${win}"/>`;
    };
    const rainbow = (x, y, r, op = 0.85) => RAINBOW.map((c, i) => `<path d="M${f1(x - r + i * 6)} ${f1(y)}A${f1(r - i * 6)} ${f1(r - i * 6)} 0 0 1 ${f1(x + r - i * 6)} ${f1(y)}" fill="none" stroke="${c}" stroke-width="6.5" opacity="${op}"/>`).join("");
    const sparkle = (x, y, r, c = "#fff", cls = "") => `<path class="${cls}" d="${starPath(x, y, r)}" fill="${c}"/>`;

    // ----- Landschaften. sky: Himmel oben → unten. Jede liefert hinten (back) und vorne (front) -----

        n: int(e.n, 0, 1e6) ?? 0, c: int(e.c, 0, 1e6) ?? 0, l: int(e.l, 0, 1e9) ?? 0,

        sd: Array.isArray(e.sd) ? e.sd.filter((x) => typeof x === "string" && DAY_RE.test(x)).slice(-3) : [],
        ms: Array.isArray(e.ms) ? e.ms.filter((x) => int(x, 0, 60000) !== null).slice(-6) : [],
      };
    }
    return out;
  }
  function cleanDays(raw) {
    const out = {};
    if (!raw || typeof raw !== "object") return out;
    Object.keys(raw).filter((k) => DAY_RE.test(k)).sort().slice(-120).forEach((k) => {
      const v = raw[k];
      if (Array.isArray(v) && int(v[0], 0, 1e5) !== null && int(v[1], 0, 1e5) !== null) out[k] = [v[0], v[1]];
    });
    return out;
  }
  const ERR_KEYS = ["op", "copy", "dig", "row", "ten", "one", "other"];
  function cleanErr(raw) {
    const out = {};
    if (raw && typeof raw === "object") ERR_KEYS.forEach((k) => { const v = int(raw[k], 0, 1e6); if (v) out[k] = v; });
    return out;
  }

  // Prüft alles, was von außen kommt (Browser, Konto, Spielstand-Code), und füllt Lücken mit Standardwerten
  function sanitize(raw) {
    if (!raw || typeof raw !== "object") return null;
    const out = freshState();
    if ([10, 20, 100].includes(raw.max)) out.max = raw.max;
    if (raw.ops && typeof raw.ops === "object") {
      const dflt = (k) => (raw.ops[k] === undefined ? true : !!raw.ops[k]);   // neue Rechenarten sind bei alten Spielständen an
      const ops = { plus: !!raw.ops.plus, minus: !!raw.ops.minus, mal: !!raw.ops.mal, luecke: dflt("luecke"), teilen: dflt("teilen") };
      if (ops.plus || ops.minus || ops.mal || ops.luecke || ops.teilen) out.ops = ops;
    }
    if (["easy", "mix", "hard"].includes(raw.level)) out.level = raw.level;
    if (["auto", "show", "hide"].includes(raw.pad)) out.pad = raw.pad;
    if (typeof raw.sound === "boolean") out.sound = raw.sound;
    out.cfg = cleanCfg(raw.cfg);
    // Fortschritt zählt nur aus Spielständen ab 1.1; Einstellungen werden immer übernommen
    if (raw.gen !== DATA_GEN) return out;
    out.correct = int(raw.correct, 0, 1e7) ?? 0;
    out.sincePic = int(raw.sincePic, 0, 99) ?? (out.correct % 5);
    if (Array.isArray(raw.album)) out.album = raw.album.slice(0, 5000).map(toCard).filter(Boolean);
    out.stats = cleanStats(raw.stats); out.days = cleanDays(raw.days); out.err = cleanErr(raw.err);
    out.seq = int(raw.seq, 0, 1e9) ?? 0;
    out.savedAt = typeof raw.savedAt === "number" && raw.savedAt > 0 ? raw.savedAt : 0;
    return out;
  }

  // ---------- Lernstand ----------
  const skLevel = (id) => (id in state.cfg.sk ? state.cfg.sk[id] : (DEFAULT_SK[id] ?? 1));
  const RULES = { "3in3": { k: 3, n: 3 }, "4in5": { k: 4, n: 5 }, "9in10": { k: 9, n: 10 } };
  const isOk = (ch) => ch === "2" || ch === "3";   // 3 = beim 1. Versuch, 2 = vor der Hilfe, 1 = mit Hilfe, 0 = Lösung gezeigt
  function statusOf(id) {
    const st = state.stats[id], h = st ? st.h : "";
    const r = RULES[state.cfg.sicher] || RULES["4in5"];
    const last = h.slice(-r.n), okc = [...last].filter(isOk).length;
    if (last.length >= r.k && okc >= r.k && (last.length === r.n || okc === last.length)) return "sicher";
    if (st && st.w) return "wackelig";
    return h.length < 3 ? "neu" : "uebend";
  }
  function rateOf(id) {
    const st = state.stats[id], l = st ? st.h.slice(-5) : "";
    return l.length ? [...l].filter(isOk).length / l.length : 0.5;
  }
  // Langzeit-Trefferquote: schützt davor, dass ein Glückstreffer ("4 von 5") eine Fähigkeit dauerhaft als sicher einfriert
  function rate10(id) {
    const st = state.stats[id], l = st ? st.h.slice(-10) : "";
    return l.length >= 5 ? [...l].filter(isOk).length / l.length : rateOf(id);
  }
  const needsPractice = (id) => {
    const st = statusOf(id);
    return st === "uebend" || st === "wackelig" || skLevel(id) === 2 || (st === "sicher" && rate10(id) < 0.7);
  };
  const sinceSeen = (id) => { const st = state.stats[id]; return st && st.l ? state.seq - st.l : 999; };

  const clock = { day: null };
  const todayKey = () => {
    if (clock.day) return clock.day;
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };

  // ---------- Auswahl: kurzes Gedächtnis dieser Sitzung ----------
  const mem = { recent: [], skills: [], ops: [], hard: [], codes: [], miss: 0, streak: 0, retry: [], cool: 0, easy: 0, last: "" };
  const taskKey = (t) => (t.op === ":" ? `${t.pic || ""}${t.a}:${t.b}` : t.gap ? `${t.gap}:${t.a}${t.op}${t.b}` : t.op === "−" ? `${t.a}−${t.b}` : `${t.op}${Math.min(t.a, t.b)}_${Math.max(t.a, t.b)}`);

  const unlocked = (s) => {
    const need = TEILEN_NEEDS[s.id];
    if (!need || state.cfg.teilenStufen === "alle") return true;
    return need.some((id) => ((state.stats[id] || {}).g || 0) >= 1);
  };
  function enabledSkills() {
    const ok = (s) => state.ops[s.group] && s.min <= state.max;
    const on = SKILLS.filter((s) => ok(s) && skLevel(s.id) !== 0 && unlocked(s));
    return on.length ? on : SKILLS.filter(ok).length ? SKILLS.filter(ok) : [SKILL_BY_ID.p1];
  }
  function wpick(items, wf) {
    const ws = items.map(wf), tot = ws.reduce((x, y) => x + y, 0);
    if (!(tot > 0)) return pick(items);
    let r = Math.random() * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r < 0) return items[i]; }
    return items[items.length - 1];
  }
  function needScore(s) {                       // wie dringend braucht diese Fähigkeit Übung?
    const status = statusOf(s.id), rate = rateOf(s.id);
    let w = status === "neu" ? 1.5 : 1 + 3 * (1 - Math.min(rate, rate10(s.id))) + (status === "wackelig" ? 1.5 : 0);
    if (skLevel(s.id) === 2) w = Math.max(w, status === "sicher" ? 1.6 : 2.2);
    const since = sinceSeen(s.id);
    w *= since < 4 ? 0.3 : since > 25 ? 1.25 : 1;
    return w * w;                               // quadriert: die schwächsten bekommen deutlich mehr
  }
  function mixWeight(s) {                       // normale Mischung: Neues zuerst kennenlernen, Sicheres seltener
    const status = statusOf(s.id);
    let w = status === "neu" ? 1.5 : status === "wackelig" ? 1.2 : status === "sicher" ? (rate10(s.id) < 0.8 ? 0.8 : sinceSeen(s.id) > 90 ? 3 : sinceSeen(s.id) > 50 ? 1.2 : 0.35) : 1;
    if (sinceSeen(s.id) < 3) w *= 0.3;
    return w;
  }
  function autoHardShare() {
    const base = { langsam: 0.25, mittel: 0.45, schnell: 0.65 }[state.cfg.steigern] ?? 0.45;
    const c = mem.codes.slice(-10);
    let adj = 0;
    if (c.length >= 6) { const r = c.filter((x) => x >= 2).length / c.length; adj = r >= 0.85 ? 0.15 : r < 0.6 ? -0.2 : 0; }
    return Math.max(0.1, Math.min(0.85, base + adj));
  }
  function easyPool(skills) {
    let p = skills.filter((s) => statusOf(s.id) === "sicher");
    if (!p.length) p = skills.filter((s) => !s.hard && rateOf(s.id) >= 0.6);
    if (!p.length) p = skills.filter((s) => !s.hard);
    return p.length ? p : skills;
  }
  // Abwechslung beim Auswählen: Was gerade nicht dran sein darf, wird gar nicht erst gezogen.
  function avoidNow(skills) {
    const L = mem.skills, n = L.length, O = mem.ops, H = mem.hard;
    const groups = new Set(skills.map((s) => s.group));
    return {
      skills: new Set([
        ...(n >= 2 && L[n - 1] === L[n - 2] ? [L[n - 1]] : []),                    // dieselbe Fähigkeit höchstens zweimal in Folge
        ...(n >= 1 && SKILL_BY_ID[L[n - 1]] && SKILL_BY_ID[L[n - 1]].group === "mal" ? [L[n - 1]] : []),   // dieselbe Reihe nie direkt nacheinander
      ]),
      group: O.length >= 3 && O.slice(-3).every((o) => o === O[O.length - 1]) && groups.size > 1 ? O[O.length - 1] : null,
      hard: H.length >= 3 && H.slice(-3).every(Boolean) && skills.some((s) => !s.hard),   // nach drei schweren eine Verschnaufpause
      hard2: H.length >= 2 && H.slice(-2).every(Boolean),
      teilen: O.slice(-3).includes("teilen") && groups.size > 1,   // Teilen ist neu: höchstens jede vierte Aufgabe
    };
  }
  const allowed = (list, av) => list.filter((s) => !av.skills.has(s.id) && s.group !== av.group && !(av.hard && s.hard) && !(av.teilen && s.group === "teilen"));

  // Der Topf (Übung, Mischung, Erfolg) wird einmal pro Aufgabe festgelegt, damit die Anteile stabil bleiben.
  function decidePool(skills, plan) {
    const auto = state.cfg.mode === "auto", av = avoidNow(skills);
    if (plan === "easy") return { pool: "erfolg", av };
    if (auto) {
      const ueb = allowed(skills.filter((s) => needsPractice(s.id)), av);
      if (ueb.length && Math.random() < state.cfg.anteil / 100) return { pool: "ueb", ueb, av };
    }
    const share = auto ? autoHardShare() : ({ easy: 0.2, mix: 0.45, hard: 0.75 }[state.level] ?? 0.45);
    return { pool: "mix", wantHard: !av.hard2 && Math.random() < share, av };
  }
  function drawSkill(skills, d) {
    if (d.pool === "erfolg") { const e = allowed(easyPool(skills), d.av); return wpick(e.length ? e : easyPool(skills), (x) => 0.5 + rateOf(x.id)); }
    if (d.pool === "ueb") return wpick(d.ueb, needScore);
    const ok = allowed(skills, d.av), base = ok.length ? ok : skills;
    let cand = base.filter((s) => s.hard === d.wantHard);
    if (!cand.length) cand = base;
    return wpick(cand, state.cfg.mode === "auto" ? mixWeight : (s) => (skLevel(s.id) === 2 ? 3 : 1));
  }

  // Abwechslung: Regeln, die eine Aufgabe erfüllen muss (relax = 0 streng, 2 locker)
  function acceptable(t, relax, identOk) {
    const key = taskKey(t);
    const wide = Math.min(40, Math.max(3, Math.floor((SPACE[t.skill] ?? 40) * 0.6)));   // kleine Aufgabenräume brauchen kürzere Pausen
    const win = identOk ? 3 : [wide, Math.min(wide, 12), 3][relax];
    return !mem.recent.slice(-win).includes(key);
  }
  const makeFor = (s) => { const t = s.make(state.max); t.skill = s.id; t.group = s.group; t.hard = s.hard; return t; };
  function commit(t) {
    mem.recent.push(taskKey(t)); mem.skills.push(t.skill); mem.ops.push(t.group); mem.hard.push(t.hard);
    for (const k of ["recent", "skills", "ops", "hard"]) if (mem[k].length > 80) mem[k].shift();
  }

  function nextTask() {
    mem.cool = Math.max(0, mem.cool - 1);
    const skills = enabledSkills(), auto = state.cfg.mode === "auto";
    let plan = "normal", retry = null;
    const av = avoidNow(skills);
    const di = state.cfg.retry ? mem.retry.findIndex((r) => r.due <= state.seq && skills.some((s) => s.id === r.skill) && allowed([SKILL_BY_ID[r.skill]], av).length) : -1;
    if (mem.easy > 0) { plan = "easy"; mem.easy--; }
    else if (di >= 0 && Math.random() < 0.85) { plan = "retry"; retry = mem.retry.splice(di, 1)[0]; }
    else if (auto && state.cfg.erfolg && mem.miss >= 2) plan = "easy";
    let chosen = null, lastT = null;
    const decided = plan === "retry" ? null : decidePool(skills, plan);
    for (let attempt = 0; attempt < 40; attempt++) {
      const relax = attempt < 16 ? 0 : attempt < 30 ? 1 : 2;
      let t, identOk = false;
      if (plan === "retry") {
        const s = SKILL_BY_ID[retry.skill];
        if (attempt === 0 && retry.exact) {
          t = retry.gap ? gapT(retry.a, retry.op, retry.b, retry.gap) : { a: retry.a, b: retry.b, op: retry.op, result: retry.op === "+" ? retry.a + retry.b : retry.op === "−" ? retry.a - retry.b : retry.op === ":" ? retry.a / retry.b : retry.a * retry.b };
          Object.assign(t, { skill: s.id, group: s.group, hard: s.hard });
          identOk = true;
        } else t = makeFor(s);
        t.pool = "retry"; t.retried = true;
      } else {
        t = makeFor(drawSkill(skills, decided)); t.pool = decided.pool;
      }
      lastT = t;
      if (acceptable(t, relax, identOk)) { chosen = t; break; }
    }
    const t = chosen || lastT;
    commit(t);
    return t;
  }

  // Ergebnis eines gelösten Aufgabe festhalten. code: 3 = 1. Versuch, 2 = vor der Hilfe, 1 = mit Hilfe, 0 = Lösung gezeigt
  function recordResult(t, code, ms) {
    const id = t.skill;
    const st = state.stats[id] || (state.stats[id] = { h: "", n: 0, c: 0, l: 0, w: 0, g: 0, sd: [], ms: [] });
    st.h = (st.h + code).slice(-10); st.n++;
    if (code >= 2) st.c++;
    st.l = ++state.seq;
    if (Number.isFinite(ms) && ms >= 0) st.ms = [...st.ms, Math.min(60000, Math.round(ms))].slice(-6);
    const day = todayKey(), d = state.days[day] || (state.days[day] = [0, 0]);
    d[0]++; if (code >= 2) d[1]++;
    const keys = Object.keys(state.days).sort();
    if (keys.length > 120) keys.slice(0, keys.length - 120).forEach((k) => delete state.days[k]);
    if (statusOf(id) === "sicher") { st.w = 1; if (!st.sd.includes(day)) st.sd = [...st.sd, day].slice(-3); }
    mem.codes.push(code); if (mem.codes.length > 30) mem.codes.shift();
    mem.miss = code <= 1 ? mem.miss + 1 : 0;
    mem.streak = code >= 2 ? mem.streak + 1 : 0;
    if (code <= 1 && state.cfg.retry && !t.retried) mem.retry.push({ skill: id, a: t.a, b: t.b, op: t.op, gap: t.gap, due: state.seq + rand(5, 8), exact: !t.pic && Math.random() < 0.3 });
    // Zunftgrad: 1 Lehrling (3 Aufgaben ohne Hilfe), 2 Geselle (sicher), 3 Meister (an zwei Tagen sicher). Er sinkt nie.
    let g = st.c >= 3 ? 1 : 0;
    if (st.w) g = 2;
    if (st.sd.length >= 2) g = 3;
    let up = 0;
    if (g > st.g) { st.g = g; up = g; }
    return { grade: up };
  }

  // Frustschutz: Angebot nach mehreren nicht gelösten Aufgaben in Folge
  const needOffer = () => state.cfg.frustN > 0 && mem.miss >= state.cfg.frustN && mem.cool <= 0;
  const offerAnswered = (accepted) => { if (accepted) mem.easy = 2; mem.miss = 0; mem.cool = 8; };

  // Fehler-Detektiv: erkennt typische Flüchtigkeitsfehler und gibt einen freundlichen Hinweis, ohne die Lösung zu verraten
  const OPNAME = { "+": "Plus", "−": "Minus", "·": "Mal" };
  function diagnose(t, val) {
    if (!Number.isFinite(val) || val === t.result) return null;
    if (t.op === ":") {
      const a = t.a, b = t.b, r = t.result, d = val - r;
      if (val === a * b || val === a + b || val === a - b) return { kind: "op", text: "Schau aufs Zeichen: Hier wird geteilt. Jeder bekommt gleich viel." };
      if (val === a) return { kind: "copy", text: t.pic ? "Das sind alle zusammen. Wie viele sind es in einer Gruppe?" : "Das ist die Zahl, die geteilt wird. Was kommt heraus?" };
      if (val === b && b !== r) return { kind: "copy", text: t.pic === "verteilen" ? "So viele Teller sind es. Wie viele kommen auf einen Teller?" : t.pic ? "So viele kommen jeweils zusammen. Wie viele Gruppen werden es?" : "Durch diese Zahl wird geteilt. Was kommt heraus?" };
      if (Math.abs(d) === 1) return { kind: "row", text: "Ganz knapp! Prüf es mit der Malaufgabe nach." };
      return null;
    }
    if (t.gap) {
      // Lücke: typisch ist, die sichtbaren Zahlen einfach zu verrechnen, statt rückwärts zu denken
      const known = t.gap === "a" ? t.b : t.a, r = t.result, d = val - r;
      const forward = t.op === "+" ? t.c + known : t.op === "·" ? t.c * known : t.gap === "a" ? t.c - t.b : t.a + t.c;
      if (val === t.c || val === known) return { kind: "copy", text: "Diese Zahl steht schon da. Gesucht ist die Zahl, die in der Lücke fehlt." };
      if (val === forward) return { kind: "op", text: "Andersherum! Denk rückwärts: Welche Zahl passt in die Lücke, damit es stimmt?" };
      const sv = String(val), sr = String(r);
      if (sv.length === sr.length && sv.length >= 2 && [...sv].reverse().join("") === sr) return { kind: "dig", text: "Fast: Die Ziffern stehen vertauscht. Erst die Zehner, dann die Einer." };
      if (Math.abs(d) === 10 && t.op !== "·") return { kind: "ten", text: "Fast! Die Zehnerstelle stimmt noch nicht. Schau auf den Zehner." };
      if (Math.abs(d) === 1) return { kind: "one", text: "Ganz knapp! Zähl die Schritte noch einmal genau." };
      return null;
    }
    const a = t.a, b = t.b, r = t.result, d = val - r;
    const alt = t.op === "+" ? [a - b, a * b] : [a + b];
    if (alt.includes(val)) return { kind: "op", text: `Schau noch einmal aufs Rechenzeichen: Hier steht ein ${OPNAME[t.op]}.` };
    if (val === a || val === b) return { kind: "copy", text: "Das ist eine Zahl aus der Aufgabe. Was kommt am Ende heraus?" };
    const sv = String(val), sr = String(r);
    if (sv.length === sr.length && sv.length >= 2 && [...sv].reverse().join("") === sr) return { kind: "dig", text: "Fast: Die Ziffern stehen vertauscht. Erst die Zehner, dann die Einer." };
    if (t.op === "·" && (Math.abs(d) === a || Math.abs(d) === b)) return { kind: "row", text: "Eine Reihe zu viel oder zu wenig? Rechne die Reihe noch einmal von vorn." };
    if (Math.abs(d) === 10 && t.op !== "·") return { kind: "ten", text: "Fast! Die Zehnerstelle stimmt noch nicht. Denk an den Zehnerübergang." };
    if (Math.abs(d) === 1) return { kind: "one", text: "Ganz knapp! Rechne den letzten Schritt noch einmal." };
    return null;
  }

  // Lob und Ermutigung
  const PHRASES = {
    ok: ["Super!", "Richtig!", "Klasse!", "Spitze!", "Genau!", "Gut gemacht!", "Stark gerechnet!", "Weiter so!", "Das sitzt!", "Sauber gerechnet!"],
    hard: ["Stark, das war eine Knobelaufgabe!", "Wow, sogar die schwere Aufgabe!", "Knobel-Profi!", "Das war knifflig, und du hast es geschafft!"],
    again: ["Genau, jetzt stimmt es!", "Gut hingeschaut!", "Sauber korrigiert!"],
    stay: ["Toll, dass du drangeblieben bist!", "Geschafft! Dranbleiben lohnt sich.", "Das war knifflig, und du hast es gelöst!", "Gut, dass du nicht aufgegeben hast!"],
    shown: ["Gut gemacht! Beim nächsten Mal klappt es noch besser.", "Das war eine knifflige. Die nächste schaffst du!"],
    nudge1: ["Noch nicht ganz. Versuch es noch einmal.", "Fast! Rechne nochmal nach.", "Schau noch einmal genau hin."],
    mut1: ["Fast! Probier es noch einmal.", "Noch nicht ganz, du schaffst das!"],
    mut2: ["Schau dir die Hilfe an, dann klappt es.", "Keine Sorge, das ist eine knifflige Aufgabe."],
  };
  const STREAK = { 3: "Drei richtig hintereinander!", 5: "Fünf in Folge, das läuft!", 10: "Zehn in Folge. Beeindruckend!", 15: "Fünfzehn in Folge. Wow!", 20: "Zwanzig in Folge. Das ist Meisterklasse!", 30: "Dreißig in Folge!" };
  function phrase(list) {
    const c = list.filter((x) => x !== mem.last), t = pick(c.length ? c : list);
    mem.last = t;
    return t;
  }
  function withName(t) {
    const n = state.cfg.name;
    return n && /[!.]$/.test(t) && Math.random() < 0.35 ? t.replace(/[!.]$/, `, ${n}!`) : t;
  }
  function praise(code, hard) {
    if (code >= 2 && STREAK[mem.streak]) { mem.last = STREAK[mem.streak]; return withName(STREAK[mem.streak]); }
    if (code === 3) return withName(phrase(hard ? PHRASES.hard : PHRASES.ok));
    if (code === 2) return withName(phrase(PHRASES.again));
    if (code === 1) return withName(phrase(PHRASES.stay));
    return phrase(PHRASES.shown);
  }
  const gradeName = (g) => ["", "Lehrling", state.cfg.titel === "m" ? "Geselle" : "Gesellin", state.cfg.titel === "m" ? "Meister" : "Meisterin"][g] || "";
  // ---------- LOGIK-ENDE ----------
  // ---------- Protokoll ----------
  // Zeichnet auf, wie gespielt wird, damit Eltern es mit Claude teilen und die App gezielt verbessern können.
  // Bleibt auf diesem Gerät, getrennt vom Spielstand (nicht im Spielstand-Code). Kein Name, keine Geräte-Kennung.
  // Ein Eintrag ist [Zeit in ms, Art, …Daten]. Älteres fällt nach 60 Tagen oder 6000 Einträgen heraus.
  const LOG_KEY = "zauber-rechnen-log", LOG_MAX = 6000, LOG_DAYS = 60, LOG_GAP = 10 * 60e3;
  const LOG = { on: true, ev: [], dirty: false, timer: 0, last: 0 };
  function logLoad() {
    try {
      const raw = JSON.parse(localStorage.getItem(LOG_KEY) || "null");
      if (raw && typeof raw === "object") {
        LOG.on = raw.on !== false;
        LOG.ev = Array.isArray(raw.ev) ? raw.ev.filter((e) => Array.isArray(e) && typeof e[0] === "number" && typeof e[1] === "string") : [];
      }
    } catch (e) { /* ohne Protokoll weiterspielen */ }
    const cut = Date.now() - LOG_DAYS * 864e5;
    LOG.ev = LOG.ev.filter((e) => e[0] >= cut).slice(-LOG_MAX);
    LOG.last = LOG.ev.length ? LOG.ev[LOG.ev.length - 1][0] : 0;
  }
  function logFlush() {
    clearTimeout(LOG.timer); LOG.timer = 0;
    if (!LOG.dirty) return;
    LOG.dirty = false;
    try { localStorage.setItem(LOG_KEY, JSON.stringify({ on: LOG.on, ev: LOG.ev })); }
    catch (e) { LOG.ev = LOG.ev.slice(-Math.floor(LOG.ev.length / 2)); }   // Speicher voll: ältere Hälfte opfern, beim nächsten Mal klappt es
  }
  // ev("A", …): neuer Eintrag; nach mehr als 10 Minuten Ruhe beginnt automatisch eine neue Sitzung
  function logEv(kind, ...data) {

    if (kind !== "S" && (!LOG.last || now - LOG.last > LOG_GAP)) LOG.ev.push(logStart(now));
    LOG.ev.push([now, kind, ...data]);
    LOG.last = now;
    if (LOG.ev.length > LOG_MAX + 200) LOG.ev = LOG.ev.slice(-LOG_MAX);

    const home = navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    return [now, "S", typeof VERSION === "string" ? VERSION : "", home ? "Home-App" : window.claude ? "Claude" : "Browser", `${screen.width}x${screen.height}`];
  };
  const logTask = (t) => (t.pic ? `${t.pic === "verteilen" ? "Bild-Verteilen" : "Bild-Aufteilen"} ${t.a}:${t.b}`
    : t.gap ? `${t.gap === "a" ? "□" : t.a}${t.op}${t.gap === "b" ? "□" : t.b}=${t.c}` : `${t.a}${t.op}${t.b}`);
  function logSet(on) {
    LOG.on = on;
    if (on) LOG.last = 0;
    LOG.dirty = true; logFlush();
  }
  function logClear() { LOG.ev = []; LOG.last = 0; LOG.dirty = true; logFlush(); }

  // ---------- Protokoll als Text: erst eine Auswertung, dann der Verlauf ----------
  const p2 = (x) => String(x).padStart(2, "0");
  const dayOf = (t) => { const d = new Date(t); return `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.`; };
  const timeOf = (t) => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
  const sec = (ms) => (ms / 1000).toFixed(1).replace(".", ",") + " s";
  const mins = (ms) => Math.round(ms / 6e4) + " min";
  const median = (a) => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const pct = (a, b) => (b ? Math.round((100 * a) / b) + " %" : "–");
  const LOG_WHAT = {
    S: "Start", A: "Aufgabe", R: "Antwort", H: "Hilfe", L: "Lösung gezeigt", F: "Angebot „leichter“", FA: "Angebot beantwortet",
    B: "Bild bekommen", BZ: "Bild geschlossen", G: "Zunftgrad", W: "Werkstatt-Kapitel", O: "geöffnet", OZ: "geschlossen",
    E: "Einstellung", P: "App verlassen", Z: "App wieder da", X: "Fehler im Programm",
  };
  function logLine(e) {
    const [t, k, ...d] = e;
    let x = d;
    if (k === "R") x = [d[0], d[1] ? "richtig" : "falsch", sec(d[2]), `${d[3]}. Versuch`, d[4] ? `Detektiv: ${d[4]}` : ""];
    else if (k === "B") x = [d[0] ? "GOLD" : "normal", d[1] ? "neu entdeckt" : "", d[2], d[3]];
    else if (k === "FA") x = [d[0] ? "ja, leichter" : "nein, weiter so"];
    else if (k === "S") x = ["Version " + d[0], d[1], d[2]];
    return `${timeOf(t)}  ${LOG_WHAT[k] || k}  ${x.filter((v) => v !== "" && v !== undefined).join("  ")}`.trimEnd();
  }
  // Sitzungen: von einem Start bis zum nächsten
  function logSessions(ev) {
    const out = [];
    ev.forEach((e) => { if (e[1] === "S" || !out.length) out.push([]); out[out.length - 1].push(e); });
    return out;
  }
  function logSummary(ev) {
    const L = [], ses = logSessions(ev);
    const dur = ses.map((s) => s[s.length - 1][0] - s[0][0]);
    const tasksPer = ses.map((s) => s.filter((e) => e[1] === "A").length);
    L.push(`Sitzungen: ${ses.length} · Dauer im Mittel (Median) ${mins(median(dur))}, kürzeste ${mins(Math.min(...dur))}, längste ${mins(Math.max(...dur))} · Aufgaben je Sitzung im Mittel ${median(tasksPer)}`);
    // Spielzeit je Tag
    const days = {};
    ses.forEach((s, i) => { const d = dayOf(s[0][0]); days[d] = days[d] || [0, 0, 0]; days[d][0] += dur[i]; days[d][1] += tasksPer[i]; days[d][2] += 1; });
    L.push("Je Tag: " + Object.entries(days).map(([d, [ms, n, k]]) => `${d} ${mins(ms)}, ${n} Aufgaben, ${k}× gestartet`).join(" · "));
    // Aufgaben auswerten: erster Versuch, Antwortzeit, Hilfe
    const per = {}, hard = {};
    let cur = null;
    ev.forEach((e) => {
      if (e[1] === "A") { cur = { skill: e[2], text: e[3], first: null, ms: null, help: false, tries: 0 }; (per[e[2]] = per[e[2]] || []).push(cur); }
      else if (cur && e[1] === "R") { cur.tries += 1; if (cur.first === null) { cur.first = !!e[3]; cur.ms = e[4]; } if (!e[3]) { const h = (hard[cur.text] = hard[cur.text] || [0, 0]); h[0] += 1; } }
      else if (cur && (e[1] === "H" || e[1] === "L")) cur.help = true;
      if (e[1] === "A") { const h = (hard[e[3]] = hard[e[3]] || [0, 0]); h[1] += 1; }
    });
    const label = (id) => (typeof SKILL_BY_ID !== "undefined" && SKILL_BY_ID[id] ? SKILL_BY_ID[id].label : id);
    const rows = Object.entries(per).filter(([, a]) => a.some((x) => x.first !== null)).map(([id, a]) => {
      const done = a.filter((x) => x.first !== null), ok = done.filter((x) => x.first).length, ms = done.filter((x) => x.first && x.ms > 0 && x.ms < 120e3).map((x) => x.ms);
      return `- ${label(id)} (${id}): ${done.length} Aufgaben, beim 1. Versuch richtig ${pct(ok, done.length)}, mit Hilfe ${done.filter((x) => x.help).length}, Zeit bis zur richtigen 1. Antwort im Mittel ${ms.length ? sec(median(ms)) : "–"}`;
    });
    if (rows.length) L.push("Je Aufgabenart:", ...rows);
    const worst = Object.entries(hard).filter(([, [f]]) => f > 0).sort((a, b) => b[1][0] - a[1][0] || b[1][1] - a[1][1]).slice(0, 10);
    if (worst.length) L.push("Meiste Fehlversuche: " + worst.map(([t, [f, n]]) => `${t} (${f} falsch bei ${n}× gestellt)`).join(" · "));
    // Wie enden Sitzungen? Was geschah direkt vor dem letzten Eintrag
    const ends = {};
    ses.forEach((s) => {
      const real = s.filter((e) => e[1] !== "P" && e[1] !== "Z" && e[1] !== "OZ");
      const last = real[real.length - 1], prevR = [...real].reverse().find((e) => e[1] === "R");
      let why = "direkt nach dem Start";
      if (last[1] === "A") why = prevR && !prevR[3] ? "neue Aufgabe offen, davor ein Fehler" : "neue Aufgabe offen, nicht beantwortet";
      else if (last[1] === "R") why = last[3] ? "nach einer richtigen Antwort" : "nach einer falschen Antwort";
      else if (last[1] === "H" || last[1] === "L") why = "während eine Hilfe gezeigt wurde";
      else if (last[1] === "B" || last[1] === "BZ") why = "nach einem Bild";
      else if (last[1] === "O") why = `in ${last[2]}`;
      else if (last[1] !== "S") why = LOG_WHAT[last[1]] || last[1];
      ends[why] = (ends[why] || 0) + 1;
    });
    L.push("Sitzungsende: " + Object.entries(ends).sort((a, b) => b[1] - a[1]).map(([w, n]) => `${n}× ${w}`).join(" · "));
    const pics = ev.filter((e) => e[1] === "B"), look = [];
    ev.forEach((e, i) => { if (e[1] === "B") { const z = ev.slice(i + 1).find((x) => x[1] === "BZ"); if (z && z[0] - e[0] < 600e3) look.push(z[0] - e[0]); } });
    const opens = {};
    ev.filter((e) => e[1] === "O").forEach((e) => { opens[e[2]] = (opens[e[2]] || 0) + 1; });
    L.push(`Bilder: ${pics.length} bekommen (${pics.filter((e) => e[2]).length} golden), angeschaut im Mittel ${look.length ? sec(median(look)) : "–"} · Geöffnet: ${Object.entries(opens).map(([w, n]) => `${w} ${n}×`).join(", ") || "nichts"}`);
    const offers = ev.filter((e) => e[1] === "FA");
    if (offers.length) L.push(`Angebot „etwas Leichteres“: ${offers.length}×, davon angenommen ${offers.filter((e) => e[2]).length}×`);
    const errs = ev.filter((e) => e[1] === "X");
    if (errs.length) L.push(`Programmfehler: ${errs.length}× (siehe Verlauf, „Fehler im Programm“)`);

  }
  function logText(days) {
    const cut = days ? Date.now() - days * 864e5 : 0, ev = LOG.ev.filter((e) => e[0] >= cut);
    const now = new Date(), L = [];
    L.push("# Rechenreise – Protokoll", "");
    L.push(`Version ${VERSION} · erstellt am ${dayOf(now)}${now.getFullYear()} um ${timeOf(now).slice(0, 5)} · ${ev.length} Einträge${ev.length ? ` vom ${dayOf(ev[0][0])} bis ${dayOf(ev[ev.length - 1][0])}` : ""}${days ? ` (letzte ${days} Tage)` : ""}`);
    L.push("", "Hinweis für Claude: Das ist das Nutzungsprotokoll eines Mathe-Lernspiels für ein Kind der 3. Klasse (Einmaleins, Plus/Minus bis 100, Lücken, Teilen). " +
      "Bitte werte aus, wo das Kind hängt, wann und warum es aufhört, welche Hilfen wirken und was man an Spiel oder Einstellungen verbessern könnte. " +
      "Zeitangaben sind Ortszeit. „Antwort“: eingegebene Zahl, richtig/falsch, Sekunden seit die Aufgabe erschien, Versuch Nr. „□“ ist die Lücke. Der Name des Kindes ist nicht enthalten.");
    L.push("", "## Auswertung", "");
    if (!ev.length) L.push("Noch keine Einträge.");
    else L.push(...logSummary(ev));
    L.push("", "## Einstellungen und Lernstand", "");
    const { name, ...cfg } = state.cfg;
    L.push(`Einstellungen: ${JSON.stringify({ max: state.max, ops: state.ops, ...cfg })}`);
    L.push(`Gesamt: ${state.correct} richtige Aufgaben, ${state.album.length} Bilder, Fehlerarten ${JSON.stringify(state.err)}`);
    if (typeof SKILLS !== "undefined") L.push("Lernstand: " + SKILLS.filter((s) => state.stats[s.id]).map((s) => `${s.id} ${statusOf(s.id)}${state.stats[s.id].g ? " Grad " + state.stats[s.id].g : ""}`).join(" · "));
    L.push("", "## Verlauf", "");

    ev.forEach((e) => {
      const d = dayOf(e[0]);
      if (d !== day) { day = d; L.push("", `### ${d}`); }
      if (e[1] === "S") L.push("");
      L.push(logLine(e));
    });

  }
  // ---------- Zustand und Speichern ----------
  // Gespeichert wird dreifach: sofort im Browser, im Claude-Viewer zusätzlich im Konto
  // und auf Wunsch als Spielstand-Code zum Sichern oder Mitnehmen auf ein anderes Gerät.
  const VERSION = "1.8";
  const STORE_KEY = "zauber-rechnen-v2"; // Schlüssel bleiben trotz neuem Namen, damit der Fortschritt erhalten bleibt
  const OLD_STORE_KEY = "zauber-rechnen-v1";
  let task = null;   // { a, b, op, result, skill, group, hard, pool }
  let input = "", tries = 0, revealed = false, locked = false, localOk = true;
  let shownAt = 0, firstMs = null, away = false, offerOpen = false, dirtyTask = false;

  const stored = () => ({ ...state, gen: DATA_GEN, album: state.album.map((k) => (k.v ? [k.s, k.n, k.c, k.g, k.v] : [k.s, k.n, k.c, k.g])) });

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY);
      const parsed = raw && JSON.parse(raw);
      const loaded = sanitize(parsed);
      if (loaded) {
        state = loaded;
        // Älterer Stand: einmalig bei null beginnen und das sofort festhalten, damit auch das Konto nachzieht
        if (parsed.gen !== DATA_GEN) { save(); localStorage.removeItem(OLD_STORE_KEY); }
      }

  }

  // Claude-Konto: ein privates Dokument pro Person, nur im Claude-Viewer verfügbar
  const cloud = { ref: null, status: "off", busy: false, dirty: false, timer: 0, retried: false };
  async function initCloud() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = db && user ? await user.id() : null;
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/progress");
      const snap = await ref.get();
      cloud.ref = ref;
      cloud.status = "on";
      const raw = snap.exists ? snap.data() : null, remote = raw && sanitize(raw);
      if (remote && remote.savedAt > state.savedAt) adopt(remote);
      // Gerät neuer, oder im Konto liegt noch ein Stand von vor 1.1: den aktuellen Stand hinschreiben
      else if (raw ? raw.gen !== DATA_GEN || state.savedAt > remote.savedAt : state.savedAt) { cloud.dirty = true; flushCloud(); }
    } catch (e) {

  }

  }

    if (!cloud.ref || cloud.busy || !cloud.dirty) return;

      await cloud.ref.set(stored());
      cloud.status = "on"; cloud.retried = false;
    } catch (e) {
      if (e && e.code === "unavailable" && !cloud.retried) {

  const genSig = () => JSON.stringify([state.max, state.ops, state.level, state.cfg.mode, state.cfg.sk]);
  function adopt(next) {
    const before = genSig();

  const CODE_PREFIX = "ZR2.";
  const b64 = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
  const exportCode = () => CODE_PREFIX + b64(JSON.stringify(stored()));
  function parseCode(text) {
    const raw = String(text || "").replace(/\s+/g, "");

      if (raw.startsWith("ZR2.")) return sanitize({ ...JSON.parse(unb64(raw.slice(4))), gen: DATA_GEN });

  }

  // ---------- Töne und Sprache ----------
  const VOLS = { leise: 0.5, mittel: 1, laut: 1.7 };
  let audioCtx = null;
  function play(freqs, { step = 0.12, type = "triangle", gain = 0.16, len = 1.6 } = {}) {
    if (!state.sound || !state.cfg.fx) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const g0 = gain * (VOLS[state.cfg.vol] || 1);

        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        const t0 = audioCtx.currentTime + i * step;

    again: () => play([440, 587.33], { type: "sine", gain: 0.14 }),

  }

  // ---------- Darstellung ----------
  const $ = (id) => document.getElementById(id);

  const STAR_PATH = "M17 2.5 L21.2 11.6 L31 12.7 L23.6 19.4 L25.7 29.2 L17 24.2 L8.3 29.2 L10.4 19.4 L3 12.7 L12.8 11.6 Z";
  const OP_WORD = { "+": "plus", "−": "minus", "·": "mal", ":": "geteilt durch" };

  // Das Antwortfeld bleibt dasselbe Element, damit der Tastatur-Fokus nie verloren geht

  const taskWords = (t) => (t.pic ? picQuestion(t) : t.gap ? `${t.gap === "a" ? "wie viel" : t.a} ${OP_WORD[t.op]} ${t.gap === "b" ? "wie viel" : t.b} gleich ${t.c}` : `${t.a} ${OP_WORD[t.op]} ${t.b}`);
  function renderTask(cls) {

  function renderTags() {

  }
  // Gold kommt mit dem Bild, in dessen Abschnitt eine volle Hunderter- (bzw. Fünfziger-, Zweihunderter-) Marke fällt.
  // So klappt es auch, wenn "Bild nach je 3" nicht genau auf 100 trifft.
  const goldAt = (correct, N, G) => G > 0 && correct > 0 && Math.floor(correct / G) > Math.floor(Math.max(0, correct - N) / G);
  function answersToGold() {
    const N = state.cfg.rewardEvery, G = state.cfg.goldEvery;
    if (!G) return 0;
    for (let R = state.correct + Math.max(1, N - state.sincePic), i = 0; i < 1000; R += N, i++) if (goldAt(R, N, G)) return R - state.correct;
    return 0;
  }
  function renderProgress(popIndex) {
    const N = state.cfg.rewardEvery;
    if (starsEl.children.length !== N) starsEl.innerHTML = Array.from({ length: N }, () => `<svg class="star" viewBox="0 0 34 34" aria-hidden="true"><path d="${STAR_PATH}"/></svg>`).join("");
    starsEl.classList.toggle("many", N > 5);
    const n = Math.min(state.sincePic, N);
    [...starsEl.children].forEach((s, i) => {
      s.classList.toggle("on", i < n);
      s.classList.remove("pop");
      if (i === popIndex) { void s.getBoundingClientRect(); s.classList.add("pop"); }
    });
    const toGold = answersToGold();
    $("progressText").innerHTML = `Noch <b>${N - n}</b> bis zum<br>nächsten Bild` + (toGold ? `<br><span class="gold-hint">Goldbild in ${toGold}</span>` : "");
    $("albumBtn").textContent = `Album ${state.album.length}`;
  }

  // Welche Hilfe passt? Zahlenstrahl, Zwanzigerfeld, Punktefeld oder Rechenweg, je nach Aufgabe und Einstellung im Eltern-Menü
  function hintType(t) {
    const mode = state.cfg.hilfe;
    if (t.pic) return "pic";
    if (t.op === ":") return mode === "strahl" ? "line" : "field";
    if (t.gap) return "line";
    if (t.op === "·") return mode === "strahl" && t.a * t.b <= 100 ? "line" : "field";
    if (Math.max(t.a, t.result) <= 20 && mode !== "strahl") return "dots";
    return mode === "punkte" ? "steps" : "line";
  }

  // Punkte in Zehnerreihen, jede Reihe in zwei Fünferbündeln
  function dotRows(classes, perRow) {
    let html = "";
    for (let r = 0; r * perRow < classes.length; r++) {
      const row = classes.slice(r * perRow, (r + 1) * perRow);
      const groups = [row.slice(0, 5), row.slice(5)].filter((g) => g.length)
        .map((g) => `<span class="group">${g.map((c) => `<span class="dot ${c}"></span>`).join("")}</span>`).join("");
      html += `<div class="row${r === 4 ? " split" : ""}">${groups}</div>`;
    }
    return html;
  }

  function stepHint(t) {
    const { a, b } = t, add = t.op === "+", s = add ? "+" : "−";
    if (a % 10 === 0 && b % 10 === 0)
      return `Rechne mit Zehnern: ${a / 10} Zehner ${s} ${b / 10} Zehner = ? Zehner`;
    if (b % 10 === 0)
      return `Zähl in Zehnerschritten ${add ? "weiter" : "zurück"}: ${a}, ${add ? a + 10 : a - 10}, …`;
    if (b < 10) {
      const e = a % 10;
      if (add && e + b === 10) return `Die Einer ${e} + ${b} ergeben genau 10. Das ist ein Zehner mehr!`;
      if (add && e + b > 10) {
        const up = 10 - e, next = a + up;
        return `Erst bis zum nächsten Zehner: ${a} + ${up} = ${next}. Dann noch ${b - up} dazu: ${next} + ${b - up} = ?`;
      }
      if (!add && b > e && e === 0) return `${a} sind ${a - 10} und 10. Rechne 10 − ${b} und zähl das zur ${a - 10} dazu.`;
      if (!add && b > e) {
        const down = a - e;
        return `Erst zurück bis zum Zehner: ${a} − ${e} = ${down}. Dann noch ${b - e} weg: ${down} − ${b - e} = ?`;
      }
      return `Schau nur auf die Einer: ${e} ${s} ${b}. Die Zehner bleiben gleich.`;
    }
    const tens = b - (b % 10), mid = add ? a + tens : a - tens;
    return `Erst die Zehner: ${a} ${s} ${tens} = ${mid}. Dann die Einer: ${mid} ${s} ${b % 10} = ?`;
  }

  // Zahlenstrahl: Haltepunkte und Sprünge. Die gesuchte Zahl wird nie beschriftet, dort steht ein „?“.
  function lineSpec(t) {
    if (t.op === ":") {
      // Teilen als Sprünge: Wie oft passt die b in die a?
      const stops = Array.from({ length: t.result + 1 }, (_, k) => k * t.b);
      return { stops, unknown: null, labels: [0, t.a], jump: (k) => (k === 0 ? `+${t.b}` : ""), hops: true,
        text: `Wie oft passt die ${t.b} in die ${t.a}? Spring in ${t.b}er-Sprüngen von 0 bis ${t.a} und zähl die Sprünge.` };
    }
    const tenUp = (x) => Math.ceil((x + 1) / 10) * 10, tenDown = (x) => Math.floor((x - 1) / 10) * 10;
    if (t.op === "·") {
      const step = t.gap ? (t.gap === "a" ? t.b : t.a) : t.b, n = t.gap ? t.result : t.a;
      const stops = Array.from({ length: n + 1 }, (_, k) => k * step);
      const unknown = t.gap ? null : n * step;
      return { stops, unknown, labels: t.gap ? [0, t.c] : stops.slice(0, -1), jump: (k) => (k === 0 ? `+${step}` : ""), hops: true,
        text: t.gap ? `Spring in ${step}er-Sprüngen von 0 bis ${t.c}. Wie viele Sprünge sind es?` : `${n} ${n === 1 ? "Sprung" : "Sprünge"} mit je ${step}: Wo landest du?` };
    }
    const up = t.op === "+";
    if (!t.gap) {
      const { a, b } = t, r = t.result, stops = [a];
      if (b >= 10 && b % 10) stops.push(up ? a + (b - (b % 10)) : a - (b - (b % 10)));
      else if (b < 10 && up && (a % 10) + b > 10) stops.push(tenUp(a));
      else if (b < 10 && !up && b > a % 10 && a % 10) stops.push(a - (a % 10));
      stops.push(r);
      return { stops, unknown: r, labels: stops.slice(0, -1), jump: (k) => `${up ? "+" : "−"}${Math.abs(stops[k + 1] - stops[k])}`, text: stepHint(t) };
    }
    // Lücke in der Mitte: vom Start zum Ziel, wie weit ist der Sprung?
    if (t.gap === "b") {
      const from = t.a, to = t.c, stops = [from];
      const mid = up ? tenUp(from) : (from % 10 ? from - (from % 10) : tenDown(from));
      if (from % 10 && (up ? mid < to : mid > to)) stops.push(mid);
      stops.push(to);
      return { stops, unknown: null, labels: stops, jump: () => "?",
        text: up ? `Von ${from} bis ${to}: Wie weit ist es? Tipp: Erst bis zum nächsten Zehner springen.` : `Von ${from} zurück bis ${to}: Wie weit ist der Sprung?` };
    }
    // Lücke vorn: rückwärts denken mit der Umkehraufgabe
    const start = t.result;
    return { stops: [start, t.c], unknown: start, labels: [t.c], jump: () => `${up ? "+" : "−"}${t.b}`,
      text: up ? `Rechne rückwärts: ${t.c} − ${t.b} = ?` : `Rechne rückwärts: ${t.c} + ${t.b} = ?` };
  }

  function numberLineSVG(t) {
    const sp = lineSpec(t), W = 300, H = sp.hops ? 84 : 96, base = H - 30, L = 14, R = W - 14;
    let lo = Math.min(...sp.stops), hi = Math.max(...sp.stops);
    lo = sp.hops ? 0 : Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
    if (hi - lo < 10) hi = lo + 10;
    const X = (v) => L + ((v - lo) / (hi - lo)) * (R - L), span = hi - lo, unit = span <= 40 ? 1 : 5;
    let s = `<line x1="${L - 6}" y1="${base}" x2="${R + 8}" y2="${base}" class="nl-axis"/><path d="M${R + 8} ${base - 4}L${R + 14} ${base}L${R + 8} ${base + 4}Z" class="nl-head"/>`;
    for (let v = lo; v <= hi; v += unit) {
      const big = v % 10 === 0, mid = v % 5 === 0;
      s += `<line x1="${X(v).toFixed(1)}" y1="${base - (big ? 7 : mid ? 5 : 3)}" x2="${X(v).toFixed(1)}" y2="${base + (big ? 7 : mid ? 5 : 3)}" class="nl-tick"/>`;
      const crowded = [...sp.labels, ...(sp.unknown !== null ? [sp.unknown] : [])].some((l) => l !== v && Math.abs(X(l) - X(v)) < 17);
      if (big && v !== sp.unknown && !sp.labels.includes(v) && !crowded) s += `<text x="${X(v).toFixed(1)}" y="${base + 21}" class="nl-num soft">${v}</text>`;
    }
    // Sprünge als Bögen mit Pfeilspitze
    for (let k = 0; k < sp.stops.length - 1; k++) {
      const x1 = X(sp.stops[k]), x2 = X(sp.stops[k + 1]), dx = x2 - x1, h = Math.max(10, Math.min(34, Math.abs(dx) * 0.42)), mx = (x1 + x2) / 2;
      s += `<path d="M${x1.toFixed(1)} ${base - 3}Q${mx.toFixed(1)} ${(base - 3 - h * 2).toFixed(1)} ${x2.toFixed(1)} ${base - 3}" class="nl-arc"/>`;
      const dir = Math.sign(dx) || 1;
      s += `<path d="M${x2.toFixed(1)} ${base - 3}l${(-dir * 6).toFixed(1)} -5l${(dir * 1).toFixed(1)} 6Z" class="nl-tip"/>`;
      const lab = sp.jump(k);
      if (lab) s += `<text x="${mx.toFixed(1)}" y="${(base - 8 - h).toFixed(1)}" class="nl-jump">${lab}</text>`;
    }
    sp.stops.forEach((v) => { s += `<circle cx="${X(v).toFixed(1)}" cy="${base}" r="${sp.hops ? 2.6 : 3.6}" class="nl-stop"/>`; });
    sp.labels.forEach((v) => { if (v !== sp.unknown) s += `<text x="${X(v).toFixed(1)}" y="${base + 21}" class="nl-num">${v}</text>`; });
    if (sp.unknown !== null) s += `<rect x="${(X(sp.unknown) - 10).toFixed(1)}" y="${base + 8}" width="20" height="18" rx="5" class="nl-q"/><text x="${X(sp.unknown).toFixed(1)}" y="${base + 21.5}" class="nl-qt">?</text>`;
    return { svg: `<svg class="numline" viewBox="0 0 ${W} ${H}" aria-hidden="true">${s}</svg>`, text: sp.text };
  }

  // ---------- Teilen mit Bildern ----------
  // Verteilen: a Dinge gerecht auf b Teller. Aufteilen: a Dinge, immer b in einen Korb.
  // Nach der Antwort (und als Hilfe) wandern die Dinge reihum auf die Teller bzw. gruppenweise in die Körbe.
  const ITEMS = {
    verteilen: [
      { n: "Törtchen", d: '<path d="M-8 -1L-6 10H6L8 -1Z" fill="#e69ab0" stroke="#8a4a5e" stroke-width="1.2"/><path d="M-4 0V9M0 0V9M4 0V9" stroke="#8a4a5e" stroke-width=".8"/><path d="M-9 0C-10 -6 -5 -9 0 -9S10 -6 9 0Z" fill="#fff4e0" stroke="#b49a7a" stroke-width="1.2"/><circle cx="0" cy="-10" r="2.6" fill="#d23c3c"/>' },
      { n: "Kekse", d: '<circle r="9" fill="#d9a35a" stroke="#8a5a26" stroke-width="1.3"/><g fill="#5a3418"><circle cx="-3" cy="-3" r="1.4"/><circle cx="3" cy="-1" r="1.4"/><circle cx="-1" cy="4" r="1.4"/><circle cx="4" cy="4" r="1.1"/></g>' },
      { n: "Kirschen", d: '<path d="M-4 3C-3 -4 0 -8 4 -10M4 3C4 -3 4 -7 4 -10" fill="none" stroke="#4f7a3a" stroke-width="1.4"/><circle cx="-4" cy="5" r="5" fill="#c7263b" stroke="#7a1422" stroke-width="1.1"/><circle cx="4.5" cy="5" r="5" fill="#d6304a" stroke="#7a1422" stroke-width="1.1"/><circle cx="-5.5" cy="3.5" r="1.3" fill="#fff" opacity=".7"/>' },
    ],
    aufteilen: [
      { n: "Äpfel", box: ["einen Korb", "Körbe"], d: '<circle cx="0" cy="1" r="8.5" fill="#d8413a" stroke="#86211c" stroke-width="1.2"/><path d="M0 -6V-10" stroke="#5a3a1a" stroke-width="1.6"/><ellipse cx="3.5" cy="-9" rx="3.4" ry="1.7" transform="rotate(-25 3.5 -9)" fill="#5c9a44"/><circle cx="-3" cy="-2" r="1.8" fill="#fff" opacity=".55"/>' },
      { n: "Eier", box: ["eine Schachtel", "Schachteln"], d: '<ellipse cx="0" cy="0" rx="7" ry="9" fill="#efd6ad" stroke="#9a7444" stroke-width="1.4"/><ellipse cx="-2.4" cy="-3" rx="1.8" ry="2.6" fill="#fff" opacity=".8"/>' },
      { n: "Münzen", box: ["einen Beutel", "Beutel"], d: '<circle r="8.5" fill="#efc24a" stroke="#a87a12" stroke-width="1.3"/><circle r="5.6" fill="none" stroke="#a87a12" stroke-width=".9"/><path d="M-2 -3H2M-2 0H2M-2 3H2" stroke="#a87a12" stroke-width="1"/>' },
    ],
  };
  const picItem = (t) => ITEMS[t.pic][t.item % 3];
  function picQuestion(t) {
    const it = picItem(t);
    return t.pic === "verteilen"
      ? `${t.a} ${it.n} sollen gerecht auf ${t.b} Teller verteilt werden. Wie viele kommen auf jeden Teller?`
      : `${t.a} ${it.n}. Immer ${t.b} kommen in ${it.box[0]}. Wie viele ${it.box[1]} werden voll?`;
  }
  // Ziel-Platz eines Dings: Verteilen reihum (1. Ding auf Teller 1, 2. auf Teller 2 …), Aufteilen gruppenweise
  function picTargets(t) {
    const groups = t.pic === "verteilen" ? t.b : t.result, per = t.pic === "verteilen" ? t.result : t.b;
    return Array.from({ length: t.a }, (_, i) => {
      const g = t.pic === "verteilen" ? i % t.b : Math.floor(i / t.b), slot = t.pic === "verteilen" ? Math.floor(i / t.b) : i % t.b;
      const cols = Math.min(per, 3), col = slot % cols, row = Math.floor(slot / cols), gx = (320 * (g + 0.5)) / groups;
      return { g, x: gx + (col - (cols - 1) / 2) * 15, y: 120 - row * 13 };
    });
  }
  function picTaskSVG(t) {
    const it = picItem(t), groups = t.pic === "verteilen" ? t.b : t.result;
    let s = "";
    // Teller stehen von Anfang an da; Körbe erscheinen erst, wenn die Gruppen gepackt sind
    for (let g = 0; g < groups; g++) {
      const gx = (320 * (g + 0.5)) / groups;
      if (t.pic === "verteilen") s += `<ellipse cx="${gx.toFixed(1)}" cy="130" rx="${Math.min(30, 300 / groups / 2 - 3).toFixed(1)}" ry="8" class="pt-plate"/><ellipse cx="${gx.toFixed(1)}" cy="128" rx="${(Math.min(30, 300 / groups / 2 - 3) * 0.6).toFixed(1)}" ry="4" class="pt-plate-in"/>`;
      else s += `<g class="pt-box" data-g="${g}"><path d="M${(gx - 24).toFixed(1)} 110H${(gx + 24).toFixed(1)}L${(gx + 20).toFixed(1)} 136H${(gx - 20).toFixed(1)}Z" class="pt-basket"/><path d="M${(gx - 22).toFixed(1)} 120H${(gx + 22).toFixed(1)}M${(gx - 21).toFixed(1)} 128H${(gx + 21).toFixed(1)}" class="pt-weave"/></g>`;
    }
    for (let i = 0; i < t.a; i++) {
      const row = Math.floor(i / 10), inRow = Math.min(10, t.a - row * 10), x = 160 + ((i % 10) - (inRow - 1) / 2) * 29, y = 20 + row * 30;
      s += `<g class="pt-it" data-i="${i}" data-x="${x.toFixed(1)}" data-y="${y}"><g transform="translate(${x.toFixed(1)} ${y}) scale(1.12)">${it.d}</g></g>`;
    }
    return `<svg class="pt-svg" viewBox="0 0 320 152" role="img" aria-label="${picQuestion(t)}">${s}<g class="pt-labels"></g></svg>`;
  }
  // Animation: final = nach der richtigen Antwort (mit Anzahl an jedem Teller/Korb), sonst als Hilfe
  let picRun = 0;
  function animateShare(final) {
    const t = task, svg = $("picArt").querySelector("svg");
    if (!t || !t.pic || !svg) return 0;
    const run = ++picRun, targets = picTargets(t), step = Math.max(55, Math.min(110, 1800 / t.a)), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    svg.querySelectorAll(".pt-it").forEach((el) => {
      const i = Number(el.dataset.i), tg = targets[i], dx = tg.x - Number(el.dataset.x), dy = tg.y - Number(el.dataset.y);
      el.style.transitionDelay = reduce ? "0ms" : `${i * step}ms`;
      el.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(.62)`;
    });
    const total = reduce ? 0 : (t.a - 1) * step + 450;
    if (t.pic === "aufteilen") svg.querySelectorAll(".pt-box").forEach((b) => { b.style.transitionDelay = reduce ? "0ms" : `${((Number(b.dataset.g) + 1) * t.b - 1) * step + 300}ms`; b.classList.add("on"); });
    if (final) setTimeout(() => {
      if (run !== picRun) return;
      const groups = t.pic === "verteilen" ? t.b : t.result;
      svg.querySelector(".pt-labels").innerHTML = Array.from({ length: groups }, (_, g) => {
        const gx = (320 * (g + 0.5)) / groups;
        return `<text x="${gx.toFixed(1)}" y="150" class="pt-count">${t.pic === "verteilen" ? t.result : t.b}</text>`;
      }).join("");
    }, total);
    return total;
  }
  function renderPic() {
    const t = task, on = !!t.pic;
    $("picTask").hidden = !on;
    $("divNote").hidden = !(t.op === ":" && (on || !((state.stats[t.skill] || {}).g >= 2)));
    if (!on) return;
    picRun++;
    $("picQ").textContent = picQuestion(t);
    $("picArt").innerHTML = picTaskSVG(t);
  }

  function renderHint() {
    const t = task, type = hintType(t);
    hintEl.className = "hint";
    if (type === "pic") {
      const txt = t.pic === "verteilen" ? "Verteile reihum: Jeder Teller bekommt eins, dann noch eins … Wie viele liegen am Ende auf einem Teller?"
        : `Pack immer ${t.b} zusammen. Wie viele ${picItem(t).box[1]} werden es?`;
      hintEl.innerHTML = `<p class="steps caption">${txt}</p>`;
      hintEl.removeAttribute("aria-label");
      hintEl.hidden = false;
      animateShare(false);
      return;
    }
    if (type === "field" && t.op === ":") {
      hintEl.classList.add("small");
      hintEl.innerHTML = dotRows(Array(t.a).fill("a"), t.b) + `<p class="steps caption">${t.a} Punkte, immer ${t.b} in einer Reihe. Wie viele Reihen sind es?<br>Denk an das Einmaleins: <span class="nb">${t.b} · ? = ${t.a}</span></p>`;
      hintEl.setAttribute("aria-label", `${t.a} Punkte in Reihen zu je ${t.b}`);
      hintEl.hidden = false;
      return;
    }
    if (type === "line") {
      const { svg, text } = numberLineSVG(t);
      const html = text.replace(/\d+ [+−] \d+ = (\d+|\?)/g, (m) => `<span class="nb">${m}</span>`).replace(/\. /g, ".<br>");
      hintEl.innerHTML = svg + `<p class="steps caption">${html}</p>`;
      hintEl.setAttribute("aria-label", "Zahlenstrahl. " + text);
    } else if (type === "field") {
      const dots = Array(t.a * t.b).fill("a");
      hintEl.classList.add("small");
      hintEl.innerHTML = dotRows(dots, t.b) + `<p class="steps caption">${t.a} Reihen mit je ${t.b} Punkten</p>`;
      hintEl.setAttribute("aria-label", `${t.a} Reihen mit je ${t.b} Punkten`);
    } else if (type === "dots") {
      const dots = [];
      if (t.op === "+") {
        for (let i = 0; i < t.a; i++) dots.push("a");
        for (let i = 0; i < t.b; i++) dots.push("b");
      } else {
        for (let i = 0; i < t.a; i++) dots.push(i >= t.a - t.b ? "a gone" : "a");
      }
      hintEl.innerHTML = dotRows(dots, 10);
      hintEl.setAttribute("aria-label", t.op === "+"
        ? `${t.a} rosa Punkte und ${t.b} grüne Punkte`
        : `${t.a} Punkte, ${t.b} davon durchgestrichen`);
    } else {
      // jeder Satz eine Zeile, Gleichungen nie umbrechen
      const html = stepHint(t)
        .replace(/\d+ [+−] \d+ = (\d+|\?)/g, (m) => `<span class="nb">${m}</span>`)
        .replace(/\. /g, ".<br>");
      hintEl.innerHTML = `<p class="steps">${html}</p>`;
      hintEl.removeAttribute("aria-label");
    }
    hintEl.hidden = false;
  }

  function setFeedback(text, kind) {
    fbEl.textContent = text;
    fbEl.className = "feedback " + (kind || "");
  }

  // ---------- Zunftzeichen ----------
  // Jede Zunft hat ihr historisches Zeichen (Brezel mit Krone, Amboss, Mühlrad …). Es hängt wie ein altes Zunftschild
  // an einem schmiedeeisernen Ausleger. Der Grad zeigt sich am Material: Lehrling Holz, Gesellin Silber, Meisterin Gold.
  // Zeichen in einem 40×40-Feld: c = Farbe des Zeichens, d = Schnittfarbe für Linien im Zeichen (= Untergrund)
  const ZSYM = {
    // Kerzenzieher: drei Kerzen
    p1: (c, d) => `<g fill="${c}"><rect x="5.5" y="19" width="7.5" height="16" rx="1"/><rect x="16.2" y="11" width="7.6" height="24" rx="1"/><rect x="27" y="22" width="7.5" height="13" rx="1"/>
      <path d="M9.2 8.5C11.6 11.6 12 14 9.2 16.6 6.5 14 6.9 11.6 9.2 8.5Z"/><path d="M20 .5C22.5 3.8 23 6.4 20 9 17 6.4 17.5 3.8 20 .5Z"/><path d="M30.8 12C33 14.8 33.4 17 30.8 19.6 28.3 17 28.7 14.8 30.8 12Z"/>
      <rect x="2.5" y="35" width="35" height="3.2" rx="1.2"/></g><g fill="${d}" opacity=".75"><rect x="7.2" y="21" width="1.4" height="12"/><rect x="18" y="13" width="1.4" height="20"/><rect x="28.7" y="24" width="1.4" height="9"/>
      <path d="M9.2 12.5c1 1.4 1 2.6 0 3.4-1-.8-1-2 0-3.4ZM20 4.2c1 1.4 1 2.6 0 3.4-1-.8-1-2 0-3.4ZM30.8 15.8c1 1.2 1 2.2 0 3-1-.8-1-1.8 0-3Z"/></g>`,
    // Seiler: aufgerolltes, gedrehtes Seil
    m1: (c, d) => `<g fill="none" stroke-width="4.6" stroke-linecap="round"><circle cx="19" cy="18" r="13" stroke="${c}"/><circle cx="19" cy="18" r="6.5" stroke="${c}"/><path d="M32 18C34 26 33 32 27 37" stroke="${c}"/>
